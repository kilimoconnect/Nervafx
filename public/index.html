<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NervaFX — Trading Dashboard</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Notyf (toast notifications) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">

  <!-- Dashboard styles -->
  <link rel="stylesheet" href="style.css?v=5" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- GSAP (animation engine) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <!-- Lucide Icons (SVG icon library) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- CountUp.js (animated number counters) -->
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.min.js"></script>

  <!-- Notyf JS -->
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>

  <!-- Flutterwave Inline JS -->
  <script src="https://checkout.flutterwave.com/v3.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-row header-row-top">
      <div class="header-left">
        <img src="/nervafx-logo.png" alt="NervaFX" style="height:26px;display:block;">
        <span class="tagline">Currency Strength Engine</span>
        <span class="header-plan-badge" id="header-plan-badge"></span>
      </div>
      <div class="header-right">
        <button class="hdr-icon-btn" id="hdr-refresh-btn" title="Refresh data" onclick="manualRefresh()">
          <i data-lucide="refresh-cw" style="width:15px;height:15px"></i>
        </button>
        <!-- Icon toggles for collapsible panels -->
        <button class="hdr-icon-btn" id="hdr-toggle-stats" title="Account stats" onclick="toggleHdrPanel('stats')">
          <i data-lucide="wallet" style="width:15px;height:15px"></i>
        </button>
        <button class="hdr-icon-btn" id="hdr-toggle-alerts" title="Notifications" onclick="toggleHdrPanel('alerts')">
          <i data-lucide="bell" style="width:15px;height:15px"></i>
          <span class="hdr-badge" id="hdr-alert-badge" style="display:none"></span>
        </button>
        <div class="status-dot" id="status-dot" title="System status"></div>
        <span class="last-update" id="last-update">—</span>
        <span class="header-user-email" id="header-user"></span>
        <a href="/profile" class="logout-btn" style="text-decoration:none">
          <i data-lucide="settings" style="width:12px;height:12px;vertical-align:middle;margin-right:4px"></i><span class="hdr-btn-text">Settings</span>
        </a>
        <a href="/admin" id="admin-nav-btn" class="logout-btn" style="display:none;text-decoration:none;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-color:transparent">
          <i data-lucide="shield" style="width:12px;height:12px;vertical-align:middle;margin-right:4px"></i><span class="hdr-btn-text">Admin</span>
        </a>
        <button class="logout-btn" onclick="logout()">
          <i data-lucide="log-out" style="width:12px;height:12px;vertical-align:middle;margin-right:4px"></i><span class="hdr-btn-text">Sign Out</span>
        </button>
      </div>
    </div>
    <!-- Collapsible: Account stats -->
    <div class="hdr-panel" id="hdr-panel-stats" style="display:none">
      <div class="header-stats">
        <div class="stat-pill" id="stat-balance">Account Size: —</div>
      </div>
    </div>
    <!-- Collapsible: Notification bars -->
    <div class="hdr-panel" id="hdr-panel-alerts" style="display:none">
      <div id="news-alert-bar" class="news-alert-bar" style="display:none">
        <span class="nab-dot"></span>
        <span class="nab-label">News</span>
        <div class="nab-chips" id="nab-chips"></div>
      </div>
    </div>
  </header>

  <!-- TAB BAR -->
  <nav class="dash-tabs" id="dash-tabs">
    <button class="dash-tab active" data-tab="overview">Overview</button>
  </nav>

  <!-- ═══ TAB 1: OVERVIEW ═══ -->
  <main class="grid tab-panel active" id="tab-overview" data-tab="overview">

    <section class="card span-3" id="section-session">
      <h2 class="card-title"><i data-lucide="timer"></i> Trading Session</h2>
      <div id="session-display" class="session-display"></div>
    </section>

    <section class="card span-3" id="section-news">
      <h2 class="card-title"><i data-lucide="newspaper"></i> Today's News <span class="sub" id="today-news-date"></span> <span id="today-news-next-badge" class="today-news-next-badge" style="display:none"></span></h2>
      <div class="today-news-header-row">
        <span>Time</span><span>Cur</span><span>Event</span><span>Impact</span><span class="h-fc">Forecast</span><span class="h-prev">Previous</span>
      </div>
      <div id="today-news-list"></div>
      <div id="news-more-row"></div>
    </section>

  </main>

  <!-- JOURNAL DETAIL MODAL -->
  <div id="jrn-modal-overlay" class="jrn-modal-overlay" onclick="closeJournalModal()">
    <div class="jrn-modal" onclick="event.stopPropagation()">
      <div class="jrn-modal-header">
        <div class="jrn-modal-title">
          <span id="jrn-modal-time" class="jrn-modal-time"></span>
          <span id="jrn-modal-badges" class="jrn-modal-badges"></span>
        </div>
        <button class="ai-modal-close" onclick="closeJournalModal()">
          <i data-lucide="x" style="width:16px;height:16px"></i>
        </button>
      </div>
      <div id="jrn-modal-body" class="jrn-modal-body"></div>
    </div>
  </div>

  <!-- Pair Analysis Modal -->
  <div id="pair-analysis-overlay" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.8);overflow-y:auto;padding:20px">
    <div style="max-width:720px;margin:0 auto;background:#0d1117;border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden">
      <div id="pa-header" style="padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06)">
        <div>
          <div id="pa-pair" style="font-size:20px;font-weight:800;letter-spacing:-0.3px"></div>
          <div id="pa-sub" style="font-size:12px;color:#94a3b8;margin-top:2px"></div>
        </div>
        <button onclick="closePairAnalysis()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#94a3b8;font-size:18px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center">&times;</button>
      </div>
      <div id="pa-body" style="padding:20px 24px">
        <div style="text-align:center;color:#64748b;padding:40px 0"><span class="spinner"></span> Loading analysis...</div>
      </div>
    </div>
  </div>

  <script src="app.js?v=99"></script>

  <script>
    // Show Admin button only for the admin user (checked via JWT sub claim)
    (function() {
      const ADMIN_ID = '140f3854-2c85-488c-8e0a-0f965d562654';
      try {
        const tok = localStorage.getItem('nfx_token');
        if (!tok) return;
        const pay = JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        if (pay.sub === ADMIN_ID) {
          document.getElementById('admin-nav-btn').style.display = '';
        }
      } catch (_) {}
    })();
  </script>

  <script>
    // ── Fresh login: force full reload to clear any stale cached state ────────
    (function() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('fresh')) {
        params.delete('fresh');
        const clean = params.toString();
        const url = window.location.pathname + (clean ? '?' + clean : '');
        history.replaceState(null, '', url);
        window.location.reload();
        return;
      }
    })();

    // ── PLAN SWITCHER ─────────────────────────────────────────────────────────
    const PLAN_LEVELS = { free: 0, pro: 1, premium: 2 };
    const REQUIRE_LEVELS = { pro: 1, premium: 2 };
    var _currentPlan = 'free'; // tracked by applyPlan, used by upgrade modal

    function applyPlan(plan) {
      // Track current plan for upgrade modal
      _currentPlan = plan;

      // Update header plan badge
      const badge = document.getElementById('header-plan-badge');
      if (badge) {
        badge.textContent = plan.charAt(0).toUpperCase() + plan.slice(1);
        badge.className = 'header-plan-badge plan-badge-' + plan;
      }

      // Update body class
      document.body.classList.remove('plan-free', 'plan-pro', 'plan-premium');
      document.body.classList.add('plan-' + plan);

      // Update pill active state
      document.querySelectorAll('.plan-sw-pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.plan === plan);
      });

      // Show/hide lock overlays + wire upgrade buttons
      const level = PLAN_LEVELS[plan] ?? 0;
      document.querySelectorAll('.plan-lock-overlay').forEach(overlay => {
        const reqPlan  = overlay.dataset.require || 'pro';
        const required = REQUIRE_LEVELS[reqPlan] ?? 1;
        overlay.classList.toggle('visible', level < required);
        // Wire upgrade button to Flutterwave checkout
        const btn = overlay.querySelector('.plan-lock-btn');
        if (btn) {
          btn.href = '#';
          btn.onclick = (e) => { e.preventDefault(); startUpgrade(reqPlan); };
        }
      });

      // Hide tab buttons that require a higher plan
      document.querySelectorAll('.dash-tab[data-require-plan]').forEach(tab => {
        const req = REQUIRE_LEVELS[tab.dataset.requirePlan] ?? 1;
        tab.style.display = level < req ? 'none' : '';
        // If hiding the active tab, switch to overview
        if (level < req && tab.classList.contains('active')) {
          const overviewTab = document.querySelector('.dash-tab[data-tab="overview"]');
          if (overviewTab) overviewTab.click();
        }
      });

      // M15 energy bars: visible only for premium
      const m15Section = document.getElementById('section-m15-energy-bars');
      if (m15Section) m15Section.classList.toggle('plan-premium-only', plan !== 'premium');

      // For free plan: hide M15 impulse notification bar
      const m15Bar = document.getElementById('m15-impulse-bar');
      if (m15Bar && plan === 'free') m15Bar.style.display = 'none';

      // For free plan: disable most tf buttons, allow 12H and Daily
      const tfBtns = document.querySelectorAll('.tf-btn');
      if (plan === 'free') {
        const freeTFs = new Set(['12', '24']);
        tfBtns.forEach(btn => {
          if (!freeTFs.has(btn.dataset.tf)) btn.disabled = true;
        });
        // Force 12H view
        const tf12 = document.querySelector('.tf-btn[data-tf="12"]');
        if (tf12 && !tf12.classList.contains('active')) tf12.click();
      } else {
        tfBtns.forEach(btn => { btn.disabled = false; });
      }

      localStorage.setItem('nfx_plan_preview', plan);
    }

    // Init — use cached plan only if it belongs to the current user
    (function() {
      var cached    = localStorage.getItem('nfx_plan');
      var cachedUid = localStorage.getItem('nfx_plan_uid');
      var user      = JSON.parse(localStorage.getItem('nfx_user') || '{}');
      if (cached && cachedUid && cachedUid === (user.id || '')) {
        applyPlan(cached);
      }
      // Otherwise don't apply 'free' — loadUserPlan() in app.js will set it from API
    })();

    // ── Upgrade modal — context-aware: hides current plan, shows proration ──
    function showUpgradeModal(highlightPlan) {
      const old = document.getElementById('upgrade-modal-overlay');
      if (old) old.remove();

      const isProUser = _currentPlan === 'pro';
      const showProCard = !isProUser; // hide Pro if user already has it
      const gridClass = showProCard ? 'upgrade-modal-grid' : 'upgrade-modal-grid single';
      const title = isProUser ? 'Upgrade to Premium' : 'Choose Your Plan';
      const subtitle = isProUser
        ? 'You\'ll only pay the prorated difference for your remaining days.'
        : 'Upgrade to unlock the full NervaFX intelligence stack.';

      const proCard = showProCard ? `
            <div class="upgrade-card ${highlightPlan === 'pro' ? 'highlight' : ''}" id="upgrade-card-pro">
              <div class="upgrade-tier">Pro</div>
              <div class="upgrade-price"><span class="upgrade-original">$79</span> <sup>$</sup>59</div>
              <div class="upgrade-period">per month</div>
              <div class="upgrade-divider"></div>
              <div class="upgrade-best">Best for <strong>Active traders</strong></div>
              <div class="upgrade-features">
                <div class="upgrade-feat"><span class="uf-check">&#10003;</span> Full live dashboard</div>
                <div class="upgrade-feat"><span class="uf-check">&#10003;</span> M15 + 3H + 6H + 12H currency strength</div>
                <div class="upgrade-feat"><span class="uf-check">&#10003;</span> M15 impulse detection &amp; alert bar</div>
                <div class="upgrade-feat"><span class="uf-check">&#10003;</span> Flow performance ranking</div>
                <div class="upgrade-feat"><span class="uf-check">&#10003;</span> 12-engine Market Energy system</div>
                <div class="upgrade-feat"><span class="uf-check">&#10003;</span> Tradability score &amp; session grading</div>
                <div class="upgrade-feat"><span class="uf-check">&#10003;</span> Email signal alerts &amp; daily digest</div>
                <div class="upgrade-feat"><span class="uf-check">&#10003;</span> Lot sizing &amp; risk calculator</div>
                <div class="upgrade-sep"></div>
                <div class="upgrade-feat dim"><span class="uf-cross">&#10005;</span> Pair analysis (48h price + volume)</div>
                <div class="upgrade-feat dim"><span class="uf-cross">&#10005;</span> M15 energy bars</div>
                <div class="upgrade-feat dim"><span class="uf-cross">&#10005;</span> Hourly metric charts &amp; archive</div>
                <div class="upgrade-feat dim"><span class="uf-cross">&#10005;</span> AI market intelligence</div>
                <div class="upgrade-feat dim"><span class="uf-cross">&#10005;</span> Backtesting engine</div>
              </div>
              <button class="upgrade-btn" id="upgrade-btn-pro" onclick="proceedCheckout('pro')">Get Pro — $59/mo</button>
            </div>` : '';

      const premiumBtnLabel = isProUser ? 'Upgrade to Premium' : 'Get Premium — $89/mo';

      const overlay = document.createElement('div');
      overlay.id = 'upgrade-modal-overlay';
      overlay.innerHTML = `
        <div class="upgrade-modal">
          <button class="upgrade-modal-close" onclick="closeUpgradeModal()">&times;</button>
          <div class="upgrade-modal-header">
            <h2>${title}</h2>
            <p>${subtitle}</p>
          </div>
          <div class="${gridClass}">
            ${proCard}
            <div class="upgrade-card premium ${highlightPlan === 'premium' || isProUser ? 'highlight' : ''}" id="upgrade-card-premium">
              <div class="upgrade-popular">&#11088; Recommended</div>
              <div class="upgrade-tier">Premium</div>
              <div class="upgrade-price"><span class="upgrade-original">$129</span> <sup>$</sup>89</div>
              <div class="upgrade-period">per month</div>
              <div class="upgrade-divider"></div>
              <div class="upgrade-best">Best for <strong>Serious &amp; advanced traders</strong></div>
              <div class="upgrade-features">
                <div class="upgrade-feat"><span class="uf-check">&#10003;</span> Everything in Pro</div>
                <div class="upgrade-sep"></div>
                <div class="upgrade-feat"><span class="uf-star">&#9733;</span> Pair analysis — 48h price chart, volume &amp; detailed breakdown</div>
                <div class="upgrade-feat"><span class="uf-star">&#9733;</span> M15 energy bars — 15-minute market energy resolution</div>
                <div class="upgrade-feat"><span class="uf-star">&#9733;</span> AI market intelligence &amp; decision analysis</div>
                <div class="upgrade-feat"><span class="uf-star">&#9733;</span> 10 metric charts with H1/M15 toggle</div>
                <div class="upgrade-feat"><span class="uf-star">&#9733;</span> Full Market Energy archive (12 months)</div>
                <div class="upgrade-feat"><span class="uf-star">&#9733;</span> Expansion pressure &amp; session flow</div>
                <div class="upgrade-feat"><span class="uf-star">&#9733;</span> Currency leadership gap analysis</div>
                <div class="upgrade-feat"><span class="uf-star">&#9733;</span> Energy cycle classification</div>
                <div class="upgrade-feat"><span class="uf-star">&#9733;</span> Full journal &amp; performance insights</div>
                <div class="upgrade-feat"><span class="uf-star">&#9733;</span> Backtesting engine</div>
              </div>
              <button class="upgrade-btn primary" id="upgrade-btn-premium" onclick="proceedCheckout('premium')">${premiumBtnLabel}</button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('visible'));
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeUpgradeModal(); });
    }

    function closeUpgradeModal() {
      const el = document.getElementById('upgrade-modal-overlay');
      if (!el) return;
      el.classList.remove('visible');
      setTimeout(() => el.remove(), 200);
    }

    function startUpgrade(plan) {
      showUpgradeModal(plan || 'pro');
    }

    // ── Checkout flow (Flutterwave Inline) ──────────────────────────────
    async function proceedCheckout(plan) {
      // Show spinner on selected button, disable both
      const btnPro = document.getElementById('upgrade-btn-pro');
      const btnPrem = document.getElementById('upgrade-btn-premium');
      const activeBtn = plan === 'premium' ? btnPrem : btnPro;
      const otherBtn = plan === 'premium' ? btnPro : btnPrem;
      const originalText = activeBtn ? activeBtn.textContent : '';
      if (activeBtn) {
        activeBtn.disabled = true;
        activeBtn.innerHTML = '<span class="upgrade-spinner"></span> Preparing checkout...';
      }
      if (otherBtn) otherBtn.disabled = true;
      // Disable modal close while loading
      const closeBtn = document.querySelector('.upgrade-modal-close');
      if (closeBtn) closeBtn.style.display = 'none';

      try {
        const tok = localStorage.getItem('nfx_token');
        const r = await fetch('/api/create-checkout', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(tok ? { 'Authorization': 'Bearer ' + tok } : {}),
          },
          body: JSON.stringify({ plan }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.error || 'Checkout failed');
        }
        const cfg = await r.json();

        // Close upgrade modal, then launch Flutterwave inline modal
        closeUpgradeModal();
        FlutterwaveCheckout({
          public_key:     cfg.public_key,
          tx_ref:         cfg.tx_ref,
          amount:         cfg.amount,
          currency:       cfg.currency,
          customer:       cfg.customer,
          meta:           cfg.meta,
          customizations: cfg.customizations,
          callback: function (data) {
            if (data.status === 'successful' || data.status === 'completed') {
              window.location.href = '/payment-callback?tx_ref=' + cfg.tx_ref + '&plan=' + plan + '&status=successful';
            } else {
              if (window.notyf) notyf.error('Payment was not completed.');
            }
          },
          onclose: function () {},
        });
      } catch (e) {
        // Restore buttons on error
        if (activeBtn) { activeBtn.disabled = false; activeBtn.textContent = originalText; }
        if (otherBtn) otherBtn.disabled = false;
        if (closeBtn) closeBtn.style.display = '';
        if (window.notyf) notyf.error(e.message || 'Could not start checkout.');
        else alert(e.message || 'Could not start checkout.');
      }
    }
  </script>
</body>
</html>
