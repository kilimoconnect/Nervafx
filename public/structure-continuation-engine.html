<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>NervaFX — Structure Continuation</title>
<link rel="icon" type="image/png" href="/nervafx-icon.png">
<script src="/auth-guard.js"></script>
<link rel="stylesheet" href="style.css" />
<style>
  .grid { display:block !important; }
  .sc-topbar { position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 20px; height:56px; background:rgba(8,11,18,0.92); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
  .sc-left { display:flex; align-items:center; gap:12px; }
  .sc-logo img { height:24px; display:block; }
  .sc-sep { color:rgba(255,255,255,0.1); font-size:20px; }
  .sc-title { font-size:13px; font-weight:600; color:var(--text-muted); }
  .sc-live { padding:6px 12px; border-radius:8px; background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.45); color:#4ade80; font-size:12px; text-decoration:none; font-weight:700; }
  .sc-lock { background:rgba(239,68,68,0.14); border-top:1px solid rgba(239,68,68,0.4); border-bottom:1px solid rgba(239,68,68,0.4); color:#fca5a5; text-align:center; font-weight:800; letter-spacing:1px; font-size:12px; padding:7px; display:none; }
  .sc-controls { display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; padding:8px 14px; border-bottom:1px solid var(--border); }
  .sc-input { padding:5px 9px; border-radius:7px; font-size:11px; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-muted); color-scheme:dark; }
  .sc-btn { padding:5px 11px; border-radius:7px; font-size:11px; font-weight:700; background:rgba(56,189,248,0.18); border:1px solid rgba(56,189,248,0.4); color:#38bdf8; cursor:pointer; }
  .sc-btn.ghost { background:rgba(255,255,255,0.04); border-color:var(--border); color:var(--text-muted); }
  .sc-btn.live { background:rgba(34,197,94,0.18); border-color:rgba(34,197,94,0.45); color:#4ade80; }
  .sc-btn.active { background:rgba(167,139,250,0.22); border-color:rgba(167,139,250,0.5); color:#c4b5fd; }
  .sc-chk { font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:4px; }
  .sc-meta { text-align:center; padding:6px; font-size:10px; color:var(--text-dim); }
  .sc-wrap { max-width:1280px; margin:0 auto; padding:6px 14px 60px; }
  /* scan grid */
  .sc-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .sc-card { background:#0b0f18; border:1px solid var(--border); border-left-width:5px; border-radius:10px; padding:10px 12px; cursor:pointer; transition:border-color .15s; }
  .sc-card:hover { border-color:rgba(56,189,248,0.5); }
  .sc-card-hd { display:flex; align-items:center; justify-content:space-between; }
  .sc-pair { font-size:16px; font-weight:900; color:#fff; letter-spacing:.5px; }
  .sc-badge { font-size:9px; font-weight:800; padding:2px 7px; border-radius:20px; letter-spacing:.5px; }
  .sc-row { display:flex; justify-content:space-between; font-size:10px; padding:2px 0; }
  .sc-k { color:var(--text-dim); } .sc-v { color:#e2e8f0; font-weight:700; }
  .sc-sig { margin-top:6px; padding-top:6px; border-top:1px solid var(--border); font-size:11px; font-weight:700; }
  .sc-why { margin-top:6px; padding-top:6px; border-top:1px solid var(--border); font-size:10px; color:var(--text-dim); }
  .sc-carry-tag { font-size:8px; font-weight:800; color:#c4b5fd; background:rgba(167,139,250,0.16); padding:1px 5px; border-radius:10px; margin-left:4px; }
  .sc-dir-BULLISH,.sc-buy { color:#4ade80; } .sc-dir-BEARISH,.sc-sell { color:#f87171; } .sc-dir-NEUTRAL { color:#94a3b8; }
  /* detail */
  .sc-panel { background:#0b0f18; border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-top:10px; }
  .sc-panel h3 { font-size:11px; font-weight:800; color:#e2e8f0; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; }
  .sc-legend { font-size:9px; color:var(--text-dim); font-weight:600; }
  canvas.sc-canvas { width:100%; height:190px; display:block; }
  .sc-cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sc-kv { display:flex; justify-content:space-between; font-size:11px; padding:2px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
  .sc-tl { max-height:180px; overflow:auto; }
  .sc-tl-row { display:flex; gap:8px; font-size:10px; padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
  .sc-tl-tf { font-weight:800; width:26px; color:#38bdf8; }
  .sc-banner { max-width:1280px; margin:8px auto 0; padding:9px 14px; border-radius:10px; font-size:12px; font-weight:700; text-align:center; }
  .sc-weekend { background:rgba(251,191,36,0.12); border:1px solid rgba(251,191,36,0.4); color:#fcd34d; }
  .sc-loading, .sc-empty { text-align:center; color:var(--text-muted); padding:26px; }
  .sc-spin { display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:#38bdf8;border-radius:50%;animation:scspin 0.7s linear infinite;vertical-align:middle; }
  @keyframes scspin { to { transform:rotate(360deg); } }
  @media (max-width:760px){ .sc-cols{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="sc-topbar">
  <div class="sc-left"><a href="/app" class="sc-logo"><img src="/nervafx-logo.png" alt="NervaFX" /></a><span class="sc-sep">|</span><span class="sc-title">Structure Continuation · D1→H4→H1 Scanner</span></div>
  <a href="/app" class="sc-live">← Back to app</a>
</div>
<div class="sc-lock" id="sc-lock">HISTORY MODE — ORDERS DISABLED</div>

<div class="sc-controls">
  <button id="c-live" class="sc-btn live">● Live</button>
  <input type="date" id="c-date" class="sc-input" />
  <select id="c-time" class="sc-input"></select>
  <select id="c-tz" class="sc-input"></select>
  <button id="c-prev" class="sc-btn ghost">‹ Prev H1</button>
  <button id="c-next" class="sc-btn ghost">Next H1 ›</button>
  <label class="sc-chk"><input type="checkbox" id="c-qual" /> Only qualifying</label>
  <button id="c-refresh" class="sc-btn ghost">⟲ Refresh</button>
</div>

<div class="sc-meta" id="sc-meta"></div>
<div class="sc-wrap" id="sc-body"><div class="sc-loading"><span class="sc-spin"></span> Loading scanner…</div></div>

<script>
  var TOKEN = localStorage.getItem('nfx_token') || '';
  var H1 = 3600000;
  var PAIRS = ['EUR_USD','GBP_USD','AUD_USD','NZD_USD','USD_JPY','USD_CHF','USD_CAD','EUR_GBP','EUR_JPY','EUR_CHF','EUR_CAD','EUR_AUD','EUR_NZD','GBP_JPY','GBP_CHF','GBP_CAD','GBP_AUD','GBP_NZD','AUD_JPY','AUD_CHF','AUD_CAD','AUD_NZD','NZD_JPY','NZD_CHF','NZD_CAD','CAD_JPY','CAD_CHF','CHF_JPY'];
  var STAGE = { SIGNAL:{c:'#22c55e',bg:'rgba(34,197,94,0.18)'}, H4_PULLBACK:{c:'#f59e0b',bg:'rgba(245,158,11,0.16)'}, H4_IMPULSE:{c:'#38bdf8',bg:'rgba(56,189,248,0.16)'}, D1_ALIGNED:{c:'#94a3b8',bg:'rgba(148,163,184,0.14)'}, NEUTRAL:{c:'#64748b',bg:'rgba(100,116,139,0.12)'} };
  var VIEW='SCAN', live=true, atMs=Math.floor(Date.now()/H1)*H1, curPair='EUR_USD', onlyQual=false, DATA=null;

  function tz(){ var e=document.getElementById('c-tz'); return (e&&e.value)||'Africa/Dar_es_Salaam'; }
  function auth(){ return { headers:{Authorization:'Bearer '+TOKEN}, cache:'no-store' }; }
  function snapH1(ms){ return Math.floor(ms/H1)*H1; }
  function partsInTz(ms,zone){ var dtf=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); var o={}; dtf.formatToParts(new Date(ms)).forEach(function(x){if(x.type!=='literal')o[x.type]=x.value;}); if(o.hour==='24')o.hour='00'; return o; }
  function zonedWallToUtcMs(y,mo,d,h,mi,zone){ var a=Date.UTC(y,mo-1,d,h,mi,0); var p=partsInTz(a,zone); var seen=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,0); return a+(a-seen); }
  function px(v){ return v==null?'—':(+v).toFixed(5); }

  (function init(){
    var t=document.getElementById('c-time'); for(var h=0;h<24;h++){var v=('0'+h).slice(-2)+':00';var o=document.createElement('option');o.value=v;o.textContent=v;t.appendChild(o);}
    var tzs=['Africa/Dar_es_Salaam','UTC','America/New_York']; var ts=document.getElementById('c-tz'); tzs.forEach(function(z){var o=document.createElement('option');o.value=z;o.textContent=z==='Africa/Dar_es_Salaam'?'EAT':z;ts.appendChild(o);}); ts.value='Africa/Dar_es_Salaam';
    syncInputs();
    document.getElementById('c-live').onclick=function(){ live=true; atMs=snapH1(Date.now()); VIEW='SCAN'; syncInputs(); load(); };
    document.getElementById('c-refresh').onclick=load;
    document.getElementById('c-tz').onchange=function(){ syncInputs(); load(); };
    document.getElementById('c-date').onchange=applyDT; document.getElementById('c-time').onchange=applyDT;
    document.getElementById('c-prev').onclick=function(){ live=false; atMs=snapH1(atMs)-H1; syncInputs(); load(); };
    document.getElementById('c-next').onclick=function(){ live=false; atMs=snapH1(atMs)+H1; syncInputs(); load(); };
    document.getElementById('c-qual').onchange=function(e){ onlyQual=e.target.checked; if(DATA&&DATA.mode==='scan') renderScan(DATA); };
    load();
  })();

  function applyDT(){ var dv=document.getElementById('c-date').value, tv=document.getElementById('c-time').value; if(!dv||!tv) return; var dp=dv.split('-'),tp=tv.split(':'); atMs=snapH1(zonedWallToUtcMs(+dp[0],+dp[1],+dp[2],+tp[0],+tp[1],tz())); live=false; load(); }
  function syncInputs(){ var p=partsInTz(atMs,tz()); document.getElementById('c-date').value=p.year+'-'+p.month+'-'+p.day; document.getElementById('c-time').value=p.hour+':00'; }
  function setLive(){ document.getElementById('c-live').classList.toggle('live',live); document.getElementById('c-live').textContent=live?'● Live':'○ Historical'; document.getElementById('sc-lock').style.display=live?'none':'block'; }

  async function load(){
    setLive();
    var body=document.getElementById('sc-body');
    if(VIEW==='SCAN'){
      body.innerHTML='<div class="sc-loading"><span class="sc-spin"></span> Scanning 28 pairs '+(live?'(live)':'at '+new Date(atMs).toISOString().slice(0,16).replace('T',' ')+' UTC')+'…</div>';
      var u='/api/structure-continuation-engine?mode=scan'+(live?'':'&at='+encodeURIComponent(new Date(atMs).toISOString()));
      try{ var r=await fetch(u,auth()); if(!r.ok) throw new Error(await r.text()); DATA=await r.json(); renderScan(DATA); }
      catch(e){ body.innerHTML='<div class="sc-empty" style="color:#f87171">Scan error: '+(e.message||e)+'</div>'; }
    } else {
      body.innerHTML='<div class="sc-loading"><span class="sc-spin"></span> Loading '+curPair.replace('_','/')+'…</div>';
      var u2='/api/structure-continuation-engine?pair='+encodeURIComponent(curPair)+'&at='+encodeURIComponent(new Date(atMs).toISOString())+'&timezone='+encodeURIComponent(tz());
      try{ var r2=await fetch(u2,auth()); if(!r2.ok) throw new Error(await r2.text()); DATA=await r2.json(); renderDetail(DATA); }
      catch(e){ body.innerHTML='<div class="sc-empty" style="color:#f87171">Error: '+(e.message||e)+'</div>'; }
    }
  }

  function renderScan(d){
    var meta=document.getElementById('sc-meta');
    var cards=(d.cards||[]).filter(function(c){ return !c.empty; });
    var qcount=cards.filter(function(c){return c.qualifies;}).length;
    meta.innerHTML='<b>'+(d.live?'LIVE':'HISTORY')+'</b> · '+(d.evalIso||'').slice(0,16).replace('T',' ')+' UTC · '+cards.length+' pairs · <b style="color:#22c55e">'+qcount+' qualifying</b> · click a card for the full D1/H4/H1 replay';
    var shown=onlyQual?cards.filter(function(c){return c.qualifies;}):cards;
    if(!shown.length){ document.getElementById('sc-body').innerHTML='<div class="sc-empty">'+(onlyQual?'No qualifying pairs at this time.':'No data.')+'</div>'; return; }
    var html='<div class="sc-cards">'+shown.map(cardHtml).join('')+'</div>';
    document.getElementById('sc-body').innerHTML=html;
    [].forEach.call(document.querySelectorAll('.sc-card'),function(el){ el.onclick=function(){ curPair=el.getAttribute('data-pair'); VIEW='DETAIL'; load(); }; });
  }

  function cardHtml(c){
    var st=STAGE[c.stage]||STAGE.NEUTRAL;
    var border = c.signal ? (c.signal.direction==='BUY'?'#22c55e':'#f87171') : st.c;
    var h='<div class="sc-card" data-pair="'+c.pair+'" style="border-left-color:'+border+'">';
    h+='<div class="sc-card-hd"><span class="sc-pair">'+c.pair.replace('_','/')+(c.fridayCarry?'<span class="sc-carry-tag">FRI CARRY</span>':'')+'</span><span class="sc-badge" style="color:'+st.c+';background:'+st.bg+'">'+c.stage.replace('_',' ')+'</span></div>';
    h+='<div class="sc-row"><span class="sc-k">D1</span><span class="sc-v sc-dir-'+c.d1Direction+'">'+c.d1Direction+'</span></div>';
    h+='<div class="sc-row"><span class="sc-k">H4</span><span class="sc-v">'+(c.h4State||'—').replace(/_/g,' ')+(c.h4Origin?(' · '+c.h4Origin.replace(/_/g,' ')):'')+'</span></div>';
    if(c.h4PullbackAtr!=null) h+='<div class="sc-row"><span class="sc-k">Pullback · age</span><span class="sc-v">'+c.h4PullbackAtr+' ATR · '+c.h4Age+'</span></div>';
    h+='<div class="sc-row"><span class="sc-k">H1</span><span class="sc-v">'+(c.h1State||'—').replace(/_/g,' ')+(c.h1Status&&c.h1Status!=='PENDING'?(' ('+c.h1Status+')'):'')+'</span></div>';
    if(c.signal){ var sc=c.signal.direction==='BUY'?'sc-buy':'sc-sell'; h+='<div class="sc-sig '+sc+'">'+c.signal.direction+' · '+px(c.signal.entry)+' → '+px(c.signal.target)+' <span style="color:var(--text-dim);font-weight:500">SL '+px(c.signal.stop)+' · '+(c.signal.r?(+c.signal.r).toFixed(5):'')+'R</span></div>'; }
    else { h+='<div class="sc-why">'+(c.whyNoTrade?c.whyNoTrade.text:'')+'</div>'; }
    h+='</div>';
    return h;
  }

  // ── detail (single pair D1/H4/H1 replay) ──
  function dirClass(d){ return 'sc-dir-'+(d||'NEUTRAL'); }
  function kv(k,val){ return '<div class="sc-kv"><span class="sc-k">'+k+'</span><span class="sc-v">'+(val==null?'—':val)+'</span></div>'; }
  function drawChart(cv,candles,ov){ var dpr=window.devicePixelRatio||1,W=cv.clientWidth,Hh=cv.clientHeight; cv.width=W*dpr; cv.height=Hh*dpr; var ctx=cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,Hh);
    if(!candles||!candles.length){ ctx.fillStyle='#64748b'; ctx.font='11px sans-serif'; ctx.fillText('No candles',10,20); return; }
    var pad=6, plotW=W-70, plotH=Hh-16, lo=Infinity,hi=-Infinity; candles.forEach(function(c){lo=Math.min(lo,c.low);hi=Math.max(hi,c.high);}); (ov.lines||[]).forEach(function(l){if(l.price!=null){lo=Math.min(lo,l.price);hi=Math.max(hi,l.price);}}); var rng=(hi-lo)||1,n=candles.length,cw=Math.max(1.5,plotW/n);
    function y(p){return pad+(hi-p)/rng*plotH;} function x(i){return pad+i*cw;}
    (ov.lines||[]).forEach(function(l){ if(l.price==null)return; var yy=y(l.price); ctx.strokeStyle=l.color; ctx.setLineDash(l.dash||[4,3]); ctx.beginPath(); ctx.moveTo(pad,yy); ctx.lineTo(pad+plotW,yy); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle=l.color; ctx.font='9px sans-serif'; ctx.fillText(l.label,pad+plotW+2,yy+3); });
    candles.forEach(function(c,i){ var up=c.close>=c.open; ctx.strokeStyle=up?'#22c55e':'#ef4444'; ctx.fillStyle=up?'rgba(34,197,94,0.6)':'rgba(239,68,68,0.6)'; var cx=x(i)+cw/2; ctx.beginPath(); ctx.moveTo(cx,y(c.high)); ctx.lineTo(cx,y(c.low)); ctx.stroke(); var bt=y(Math.max(c.open,c.close)),bb=y(Math.min(c.open,c.close)); ctx.fillRect(x(i)+cw*0.15,bt,Math.max(1,cw*0.7),Math.max(1,bb-bt)); });
    (ov.swings||[]).forEach(function(s){ var i=candles.findIndex(function(c){return c.openMs===s.openMs;}); if(i<0)return; ctx.fillStyle=s.type==='HIGH'?'#38bdf8':'#f59e0b'; ctx.beginPath(); ctx.arc(x(i)+cw/2,y(s.price),2.5,0,7); ctx.fill(); });
    (ov.marks||[]).forEach(function(m){ var i=candles.findIndex(function(c){return c.openMs===m.openMs;}); if(i<0)return; ctx.strokeStyle=m.color; ctx.setLineDash([2,2]); ctx.beginPath(); ctx.moveTo(x(i)+cw/2,pad); ctx.lineTo(x(i)+cw/2,pad+plotH); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle=m.color; ctx.font='8px sans-serif'; ctx.fillText(m.label,x(i)+cw/2+2,pad+10); });
  }
  function chartPanel(id,title,legend){ return '<div class="sc-panel"><h3>'+title+' <span class="sc-legend">'+legend+'</span></h3><canvas id="'+id+'" class="sc-canvas"></canvas></div>'; }

  function renderDetail(v){
    var body=document.getElementById('sc-body');
    if(v.empty){ body.innerHTML='<button class="sc-btn ghost" id="d-back">← Back to scan</button><div class="sc-empty">No candle data.</div>'; document.getElementById('d-back').onclick=back; return; }
    var h1=v.h1||{}, sig=v.signal, sp=v.statePanel||{};
    var html='<button class="sc-btn ghost" id="d-back">← Back to scan</button> <b style="margin-left:8px">'+v.pair.replace('_','/')+'</b>';
    if(v.fridayCarry) html+=' <span class="sc-carry-tag">FRIDAY IMPULSE CARRIED FORWARD</span>';
    if(v.weekend&&v.weekend.closed) html+='<div class="sc-banner sc-weekend">'+v.weekend.message+'</div>';
    html+=chartPanel('cv-d1','D1 · <span class="'+dirClass(v.d1.direction)+'">'+v.d1.direction+'</span>','swings ● · protected/BOS ——');
    html+=chartPanel('cv-h4','H4 · '+(v.h4.state||'')+(v.h4.impulse?(' · '+v.h4.impulse.origin):''),'protected/BOS/extreme');
    html+=chartPanel('cv-h1','H1 · '+(h1.state||'')+(h1.status&&h1.status!=='PENDING'?(' ('+h1.status+')'):''),'sweep/BOS ¦ · entry/stop/target ——');
    html+='<div class="sc-cols">';
    html+='<div class="sc-panel"><h3>Strategy State</h3>'+kv('Market',sp.marketState)+kv('D1','<span class="'+dirClass(sp.d1Direction)+'">'+sp.d1Direction+'</span>')+kv('H4',sp.h4State)+kv('H4 origin',v.h4.impulse?v.h4.impulse.origin:'—')+kv('H4 pullback',v.h4.impulse?((v.h4.impulse.pullbackDepthAtr||0).toFixed(2)+' ATR · age '+v.h4.impulse.ageCandles):'—')+kv('H1',sp.h1State)+kv('Orders','<span style="color:#fca5a5">DISABLED</span>')+'</div>';
    if(sig){ html+='<div class="sc-panel"><h3>Simulated Trade (paper)</h3>'+kv('Direction','<span class="'+(sig.direction==='BUY'?'sc-buy':'sc-sell')+'">'+sig.direction+'</span>')+kv('Status',sig.status)+kv('Entry',px(sig.entry))+kv('Stop',px(sig.stop))+kv('Target (2R)',px(sig.target))+kv('R',(sig.r||0).toFixed(5))+'</div>'; }
    else { var w=v.whyNoTrade||{}; html+='<div class="sc-panel"><h3>Why No Trade</h3><div style="font-size:13px;font-weight:700;color:#fca5a5">'+(w.code||'—')+'<div style="color:var(--text-dim);font-weight:500;font-size:11px;margin-top:3px">'+(w.text||'')+'</div></div></div>'; }
    html+='</div>';
    html+='<div class="sc-panel"><h3>Event Timeline</h3><div class="sc-tl">'+((v.timeline&&v.timeline.length)?v.timeline.map(function(e){return '<div class="sc-tl-row"><span class="sc-tl-tf">'+e.tf+'</span><span style="color:var(--text-dim);width:110px">'+e.tsIso.slice(5,16).replace('T',' ')+'</span><span>'+e.label+'</span></div>';}).join(''):'<div class="sc-empty">No structural events yet.</div>')+'</div></div>';
    body.innerHTML=html;
    document.getElementById('d-back').onclick=back;
    drawChart(document.getElementById('cv-d1'), v.d1.candles, { swings:v.d1.swings, lines:[{price:v.d1.protectedLevel,color:'#f59e0b',label:'D1 protected'},{price:v.d1.bosLevel,color:'#38bdf8',label:'D1 BOS',dash:[6,3]}] });
    var h4o={swings:v.h4.swings,lines:[]}; if(v.h4.impulse){ h4o.lines=[{price:v.h4.impulse.protectedLevel,color:'#f59e0b',label:'H4 protected'},{price:v.h4.impulse.bosLevel,color:'#38bdf8',label:'H4 BOS',dash:[6,3]},{price:v.h4.impulse.extreme,color:'#a78bfa',label:'extreme'}]; }
    drawChart(document.getElementById('cv-h4'), v.h4.candles, h4o);
    var h1o={swings:h1.swings,lines:[],marks:[]}, ev=h1.evidence||{};
    if(sig){ h1o.lines=[{price:sig.entry,color:'#22d3ee',label:'entry'},{price:sig.stop,color:'#ef4444',label:'stop'},{price:sig.target,color:'#22c55e',label:'target 2R'}]; }
    if(ev.sweepTime!=null) h1o.marks.push({openMs:ev.sweepTime,color:'#f59e0b',label:'sweep'});
    if(ev.bosTime!=null) h1o.marks.push({openMs:ev.bosTime,color:'#38bdf8',label:'BOS'});
    drawChart(document.getElementById('cv-h1'), h1.candles, h1o);
  }
  function back(){ VIEW='SCAN'; load(); }
</script>
