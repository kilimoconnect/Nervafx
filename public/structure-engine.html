<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>NervaFX — Top-Down Analysis</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css" />

  <style>
    .grid { display: block !important; }

    .sx-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px;
      background: rgba(8,11,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .sx-topbar-left { display: flex; align-items: center; gap: 12px; }
    .sx-logo img { height: 24px; display: block; }
    .sx-sep { color: rgba(255,255,255,0.1); font-size: 20px; font-weight: 200; }
    .sx-title-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .sx-back-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-size: 11px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.15s;
    }
    .sx-back-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }

    .sx-main { max-width: 1000px; margin: 0 auto; padding: 20px 20px 80px; }

    .sx-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; margin-bottom: 18px; overflow: hidden;
    }
    .sx-card-hd {
      padding: 12px 16px; font-size: 12px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .sx-card-hd i { width: 15px; height: 15px; }
    .sx-card-bd { padding: 14px 16px; }

    .sx-ctrls { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: wrap; }
    .sx-btn {
      padding: 4px 12px; border-radius: 7px; font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .sx-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .sx-btn.active { background: rgba(96,165,250,0.15); border-color: rgba(96,165,250,0.5); color: #60a5fa; }
    .sx-ctrl-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.1); }
    .sx-note { font-size: 10.5px; color: var(--text-dim); text-transform: none; letter-spacing: 0; font-weight: 500; }
    .sx-date-input {
      padding: 4px 8px; border-radius: 7px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-family: inherit; outline: none;
      transition: all 0.15s; cursor: pointer;
    }
    .sx-date-input:focus { border-color: rgba(96,165,250,0.5); color: var(--text); }
    .sx-date-input::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }

    .sx-loading { display: flex; align-items: center; gap: 8px; padding: 40px; color: var(--text-muted); font-size: 12px; justify-content: center; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #60a5fa; border-radius: 50%; animation: sxspin 0.7s linear infinite;
    }
    @keyframes sxspin { to { transform: rotate(360deg); } }

    /* ── Break cards ── */
    .br-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; margin-bottom: 10px; overflow: hidden;
    }
    .br-card-hd {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .br-time { font-size: 12px; font-weight: 700; color: var(--text); }
    .br-date { font-size: 11px; color: var(--text-muted); }
    .br-count {
      margin-left: auto; font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 4px;
      background: rgba(96,165,250,0.12); color: #60a5fa;
    }

    .br-pairs { padding: 8px 14px; }
    .br-pair {
      display: flex; align-items: center; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .br-pair:last-child { border-bottom: none; }
    .br-rank {
      font-size: 10px; font-weight: 800; color: var(--text-dim);
      min-width: 18px; text-align: center;
    }
    .br-pair-name { font-size: 12px; font-weight: 800; color: var(--text); min-width: 75px; }
    .br-tag {
      font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 4px;
      letter-spacing: 0.2px;
    }
    .br-buy { background: rgba(34,197,94,0.12); color: #4ade80; }
    .br-sell { background: rgba(239,68,68,0.12); color: #f87171; }

    .br-score-bar {
      flex: 1; height: 8px; background: rgba(255,255,255,0.04);
      border-radius: 4px; overflow: hidden; min-width: 60px;
    }
    .br-score-fill {
      height: 100%; border-radius: 4px;
      transition: width 0.3s;
    }
    .br-score-fill.high { background: linear-gradient(90deg, #4ade80, #22c55e); }
    .br-score-fill.mid { background: linear-gradient(90deg, #facc15, #f59e0b); }
    .br-score-fill.low { background: linear-gradient(90deg, #f87171, #ef4444); }

    .br-score-val {
      font-size: 11px; font-weight: 800; min-width: 30px; text-align: right;
      font-family: var(--font-data);
    }
    .br-score-val.high { color: #4ade80; }
    .br-score-val.mid { color: #facc15; }
    .br-score-val.low { color: #f87171; }

    .br-meta {
      display: flex; gap: 8px; font-size: 9.5px; font-weight: 600;
      color: var(--text-dim); margin-top: 3px;
    }
    .br-meta span { white-space: nowrap; }

    .br-empty { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 13px; }

    /* ── TF badges (W / D / H1) ── */
    .tf-badges { display: flex; gap: 4px; align-items: center; }
    .tf-badge {
      font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 3px;
      letter-spacing: 0.3px;
    }
    .tf-aligned { background: rgba(34,197,94,0.15); color: #4ade80; }
    .tf-bonus { background: rgba(250,204,21,0.15); color: #facc15; }

    @media (max-width: 640px) {
      .sx-main { padding: 14px 12px 60px; }
      .sx-ctrls { width: 100%; margin-left: 0; }
      .br-pair { flex-wrap: wrap; gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="sx-topbar">
    <div class="sx-topbar-left">
      <a class="sx-logo" href="/app"><img src="/nervafx-logo.png" alt="NervaFX" onerror="this.style.display='none'"></a>
      <span class="sx-sep">/</span>
      <span class="sx-title-text">Top-Down Analysis</span>
    </div>
    <a class="sx-back-btn" href="/app" onclick="window.close(); setTimeout(function(){ location.href='/app'; }, 150); return false;">&times; Close</a>
  </div>

  <main class="sx-main">
    <div class="sx-card">
      <div class="sx-card-hd">
        <i data-lucide="layers"></i> Top-Down Analysis — Weekly &amp; Daily alignment + H1 break bonus
        <span class="sx-note">W + D must agree · H1 break = previous day high/low · Top 5 ranked by alignment strength</span>
        <span class="sx-ctrls" id="sx-ctrls">
          <button class="sx-btn sx-days active" data-days="1">1D</button>
          <button class="sx-btn sx-days" data-days="2">2D</button>
          <button class="sx-btn sx-days" data-days="5">5D</button>
          <button class="sx-btn sx-days" data-days="10">10D</button>
          <button class="sx-btn sx-days" data-days="30">30D</button>
          <span class="sx-ctrl-sep"></span>
          <button class="sx-btn sx-session active" data-session="all">All</button>
          <button class="sx-btn sx-session" data-session="asia">Asia</button>
          <button class="sx-btn sx-session" data-session="london">London</button>
          <button class="sx-btn sx-session" data-session="newyork">New York</button>
          <span class="sx-ctrl-sep"></span>
          <input type="date" class="sx-date-input" id="sx-date-from" title="From date">
          <input type="date" class="sx-date-input" id="sx-date-to" title="To date">
          <button class="sx-btn" id="sx-date-go">Go</button>
        </span>
      </div>
    </div>

    <div id="br-cards">
      <div class="sx-loading"><span class="spinner"></span> Loading…</div>
    </div>
  </main>

  <script>
  (function () {
    'use strict';

    var TOKEN = localStorage.getItem('nfx_token');
    if (!TOKEN) { location.href = '/login'; return; }

    var currentDays = 1;
    var currentSession = 'all';
    var cachedRows = [];

    var SESSIONS = {
      all:     { start: 0, end: 24 },
      asia:    { start: 0, end: 8 },
      london:  { start: 7, end: 16 },
      newyork: { start: 12, end: 21 },
    };

    function inSession(iso) {
      if (currentSession === 'all') return true;
      var h = new Date(iso).getUTCHours();
      var s = SESSIONS[currentSession];
      return h >= s.start && h < s.end;
    }

    function hrLabel(iso) {
      return new Date(iso).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Africa/Nairobi' });
    }
    function dayLabel(iso) {
      return new Date(iso).toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', timeZone: 'Africa/Nairobi' });
    }
    function isWeekend(iso) {
      var d = new Date(iso).getUTCDay();
      return d === 0 || d === 6;
    }

    function scoreClass(score) {
      if (score >= 70) return 'high';
      if (score >= 45) return 'mid';
      return 'low';
    }

    function fmtPrice(p) {
      return p > 10 ? p.toFixed(3) : p.toFixed(5);
    }

    function renderCards(rows) {
      var el = document.getElementById('br-cards');
      if (!rows.length) {
        el.innerHTML = '<div class="br-empty">No aligned pairs found for this period.</div>';
        return;
      }

      var html = '';
      var reversed = rows.slice().reverse();
      for (var r = 0; r < reversed.length; r++) {
        var row = reversed[r];
        if (isWeekend(row.time)) continue;
        if (!inSession(row.time)) continue;

        var pairs = row.pairs;
        if (!pairs.length) continue;

        html += '<div class="br-card">';
        html += '<div class="br-card-hd">';
        html += '<span class="br-time">' + hrLabel(row.time) + '</span>';
        html += '<span class="br-date">' + dayLabel(row.time) + '</span>';
        html += '<span class="br-count">' + row.totalAligned + ' aligned</span>';
        html += '</div>';
        html += '<div class="br-pairs">';

        for (var i = 0; i < pairs.length; i++) {
          var p = pairs[i];
          var sc = scoreClass(p.score);
          var dirCls = p.direction === 'BUY' ? 'br-buy' : 'br-sell';
          var barPct = Math.max(5, p.score);

          html += '<div class="br-pair">';
          html += '<span class="br-rank">#' + (i + 1) + '</span>';
          html += '<span class="br-pair-name">' + p.pair + '</span>';
          html += '<span class="br-tag ' + dirCls + '">' + p.direction + '</span>';

          html += '<div class="tf-badges">';
          html += '<span class="tf-badge tf-aligned">W</span>';
          html += '<span class="tf-badge tf-aligned">D</span>';
          if (p.h1Break) html += '<span class="tf-badge tf-bonus">H1</span>';
          html += '</div>';

          html += '<div class="br-score-bar"><div class="br-score-fill ' + sc + '" style="width:' + barPct + '%"></div></div>';
          html += '<span class="br-score-val ' + sc + '">' + p.score + '</span>';
          html += '</div>';

          html += '<div class="br-meta">';
          html += '<span>Week ' + fmtPrice(p.weekOpen) + '</span>';
          html += '<span>Day ' + fmtPrice(p.dayOpen) + '</span>';
          html += '<span>Close ' + fmtPrice(p.close) + '</span>';
          if (p.h1Break) {
            html += '<span style="color:#facc15">Broke ' + (p.direction === 'BUY' ? 'High' : 'Low') + ' ' + fmtPrice(p.breakLevel) + '</span>';
            html += '<span>Break ' + p.breakScore + '</span>';
          }
          html += '<span>Wick ' + p.wickPct + '%</span>';
          html += '</div>';
        }
        html += '</div></div>';
      }
      el.innerHTML = html || '<div class="br-empty">No aligned pairs found.</div>';
    }

    async function load() {
      document.getElementById('br-cards').innerHTML = '<div class="sx-loading"><span class="spinner"></span> Loading…</div>';

      var fromEl = document.getElementById('sx-date-from');
      var toEl = document.getElementById('sx-date-to');
      var qs;
      if (fromEl.value && toEl.value) {
        qs = 'from=' + fromEl.value + '&to=' + toEl.value;
      } else {
        qs = 'days=' + currentDays;
      }

      try {
        var res = await fetch('/api/top-down-analysis?' + qs, {
          headers: { Authorization: 'Bearer ' + TOKEN },
        });
        if (!res.ok) throw new Error(await res.text());
        var json = await res.json();
        cachedRows = json.rows || [];
        renderCards(cachedRows);
      } catch (e) {
        document.getElementById('br-cards').innerHTML =
          '<div class="br-empty" style="color:#f87171">Error: ' + e.message + '</div>';
      }
    }

    document.querySelectorAll('.sx-days').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.sx-days').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentDays = parseInt(btn.dataset.days, 10);
        document.getElementById('sx-date-from').value = '';
        document.getElementById('sx-date-to').value = '';
        load();
      });
    });

    document.querySelectorAll('.sx-session').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.sx-session').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentSession = btn.dataset.session;
        renderCards(cachedRows);
      });
    });

    document.getElementById('sx-date-go').addEventListener('click', function() {
      document.querySelectorAll('.sx-days').forEach(function(b) { b.classList.remove('active'); });
      load();
    });

    lucide.createIcons();
    load();
  })();
  </script>
</body>
</html>
