<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>NervaFX — Acceleration Intelligence Engine</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .grid { display: block !important; }
    .sx-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px;
      background: rgba(8,11,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .sx-topbar-left { display: flex; align-items: center; gap: 12px; }
    .sx-logo img { height: 24px; display: block; }
    .sx-sep { color: rgba(255,255,255,0.1); font-size: 20px; font-weight: 200; }
    .sx-title-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .sx-back-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-size: 11px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.15s;
    }
    .sx-back-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }
    .sx-main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

    .sx-card {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; margin-bottom: 20px; overflow: hidden;
    }
    .sx-card-hd {
      padding: 14px 18px; font-size: 12px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .sx-card-hd i { width: 15px; height: 15px; }
    .sx-ctrls { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: wrap; }
    .sx-btn {
      padding: 5px 14px; border-radius: 7px; font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .sx-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .sx-btn.active { background: rgba(20,184,166,0.15); border-color: rgba(20,184,166,0.5); color: #2dd4bf; }
    .sx-ctrl-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.1); }
    .sx-note { font-size: 10.5px; color: var(--text-dim); text-transform: none; letter-spacing: 0; font-weight: 500; }
    .sx-date-input {
      padding: 5px 10px; border-radius: 7px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-family: inherit; outline: none;
      transition: all 0.15s; cursor: pointer;
    }
    .sx-date-input:focus { border-color: rgba(20,184,166,0.5); color: var(--text); }
    .sx-date-input::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
    .sx-loading { display: flex; align-items: center; gap: 8px; padding: 50px; color: var(--text-muted); font-size: 12px; justify-content: center; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.15); border-top-color: #2dd4bf; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .br-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 13px; }

    /* ══════════ Engine Card ══════════ */
    .eng-card {
      background: rgba(255,255,255,0.015);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; margin-bottom: 16px; overflow: hidden;
      transition: border-color 0.2s;
    }
    .eng-card:hover { border-color: rgba(255,255,255,0.1); }
    .eng-card.has-candidates { border-color: rgba(20,184,166,0.2); }
    .eng-card.has-candidates:hover { border-color: rgba(20,184,166,0.35); }

    .eng-hd {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .eng-time-block { display: flex; flex-direction: column; }
    .eng-time { font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; line-height: 1; }
    .eng-date { font-size: 10px; color: var(--text-dim); font-weight: 600; margin-top: 3px; }
    .eng-cand-count {
      margin-left: auto; font-size: 10px; font-weight: 800;
      padding: 3px 10px; border-radius: 20px;
      background: rgba(20,184,166,0.1); color: #2dd4bf;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .eng-cand-count.none { background: rgba(255,255,255,0.04); color: var(--text-dim); }

    /* Rotation banner */
    .eng-rotation-banner {
      padding: 8px 18px; font-size: 11px; font-weight: 700;
      background: rgba(251,191,36,0.06); border-bottom: 1px solid rgba(251,191,36,0.1);
      color: #fbbf24; display: flex; align-items: center; gap: 6px;
    }
    .eng-rotation-banner i { width: 13px; height: 13px; }

    /* ── Trade Quality Scores ── */
    .eng-scores-bar {
      display: flex; align-items: center; gap: 12px; padding: 12px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.01); flex-wrap: wrap;
    }
    .eng-score-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 70px;
    }
    .eng-score-label {
      font-size: 8px; font-weight: 800; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .eng-score-ring {
      position: relative; width: 44px; height: 44px;
    }
    .eng-score-ring svg { width: 44px; height: 44px; transform: rotate(-90deg); }
    .eng-score-ring-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 4; }
    .eng-score-ring-fill { fill: none; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
    .eng-score-ring-val {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800;
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    }

    .eng-quality-block {
      margin-left: auto; display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
    }
    .eng-quality-score {
      font-size: 28px; font-weight: 800; line-height: 1;
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    }
    .eng-quality-meta { display: flex; flex-direction: column; }
    .eng-quality-label-top {
      font-size: 8px; font-weight: 800; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .eng-quality-label {
      font-size: 13px; font-weight: 800; letter-spacing: -0.3px;
    }

    /* ── Two-column layout ── */
    .eng-body {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    }
    .eng-body.no-cands { grid-template-columns: 1fr; }

    .eng-ranking-wrap { padding: 14px 18px; }
    .eng-cands-wrap {
      padding: 14px 18px;
      border-left: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.01);
    }

    .eng-section-label {
      font-size: 9px; font-weight: 800; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 10px;
    }

    /* ── Ranking table ── */
    .eng-ranking { width: 100%; border-collapse: separate; border-spacing: 0; }
    .eng-ranking th {
      text-align: left; font-size: 9px; font-weight: 800; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.8px; padding: 0 6px 8px;
    }
    .eng-ranking td { padding: 5px 6px; font-size: 12px; font-weight: 600; }
    .eng-ranking tr { transition: background 0.1s; }
    .eng-ranking tbody tr:hover { background: rgba(255,255,255,0.03); }
    .eng-ranking tr:first-child td { border-top: 1px solid rgba(34,197,94,0.15); }
    .eng-ranking tr:last-child td { border-bottom: 1px solid rgba(239,68,68,0.15); }

    .eng-rank-num { color: var(--text-dim); font-size: 10px; width: 18px; font-weight: 700; }
    .eng-ccy { font-weight: 800; font-size: 12px; letter-spacing: 0.3px; }
    .eng-ccy.pos { color: #4ade80; }
    .eng-ccy.neg { color: #f87171; }
    .eng-ccy.zero { color: var(--text-muted); }
    .eng-accel { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-weight: 700; font-size: 11px; }
    .eng-accel.pos { color: #4ade80; }
    .eng-accel.neg { color: #f87171; }
    .eng-accel.zero { color: var(--text-muted); }

    /* Phase badge */
    .phase-badge {
      font-size: 8px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
    }
    .phase-badge.birth { background: rgba(96,165,250,0.12); color: #60a5fa; }
    .phase-badge.growth { background: rgba(34,197,94,0.12); color: #4ade80; }
    .phase-badge.exhaustion { background: rgba(251,191,36,0.12); color: #fbbf24; }
    .phase-badge.idle { background: rgba(255,255,255,0.04); color: var(--text-dim); }

    /* Leader star */
    .leader-star {
      color: #fbbf24; font-size: 10px; margin-left: 2px; vertical-align: top;
    }

    /* Consecutive dot bar */
    .consec-dots { display: inline-flex; gap: 2px; margin-left: 4px; }
    .consec-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
    }
    .consec-dot.active { background: #2dd4bf; }

    /* Score bar */
    .eng-score-cell { width: 80px; }
    .eng-score-bar {
      position: relative; height: 14px; border-radius: 3px;
      background: rgba(255,255,255,0.03); overflow: hidden;
    }
    .eng-score-fill {
      position: absolute; top: 0; height: 100%; border-radius: 3px;
      transition: width 0.4s ease;
    }
    .eng-score-fill.pos { background: linear-gradient(90deg, rgba(34,197,94,0.15), rgba(34,197,94,0.45)); right: 50%; }
    .eng-score-fill.neg { background: linear-gradient(270deg, rgba(239,68,68,0.15), rgba(239,68,68,0.45)); left: 50%; }
    .eng-score-mid {
      position: absolute; top: 0; left: 50%; width: 1px; height: 100%;
      background: rgba(255,255,255,0.12);
    }
    .eng-score-val {
      position: absolute; top: 0; left: 0; right: 0; text-align: center;
      font-size: 8px; font-weight: 800; line-height: 14px; color: rgba(255,255,255,0.7);
      letter-spacing: 0.3px;
    }

    /* ── Candidate cards ── */
    .eng-cand {
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; padding: 12px 14px;
      background: rgba(255,255,255,0.02);
      margin-bottom: 8px;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }
    .eng-cand:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.1); }
    .eng-cand:last-child { margin-bottom: 0; }

    /* Forward candle table */
    .eng-fwd { display: none; margin-top: 10px; }
    .eng-cand.open .eng-fwd { display: block; }
    .eng-fwd-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .eng-fwd-table th {
      text-align: left; font-size: 8px; font-weight: 800; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.8px; padding: 4px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .eng-fwd-table td {
      padding: 4px 6px; font-size: 11px; font-weight: 600;
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .eng-fwd-table tr:first-child td {
      background: rgba(20,184,166,0.06);
    }
    .eng-fwd-table tr:hover td { background: rgba(255,255,255,0.03); }
    .eng-fwd-time { color: var(--text-muted); font-size: 10px; }
    .eng-fwd-bull { color: #4ade80; }
    .eng-fwd-bear { color: #f87171; }
    .eng-fwd-pips { font-weight: 800; }
    .eng-fwd-entry { font-size: 9px; color: var(--text-dim); margin-bottom: 6px; }
    .eng-fwd-label {
      font-size: 8px; font-weight: 800; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .eng-fwd-label i { width: 11px; height: 11px; }

    .eng-cand-top {
      display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .eng-cand-pair { font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; }
    .eng-cand-dir {
      font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .eng-cand-dir.BUY { background: rgba(34,197,94,0.12); color: #4ade80; }
    .eng-cand-dir.SELL { background: rgba(239,68,68,0.12); color: #f87171; }

    /* Confidence meter */
    .conf-meter {
      margin-left: auto; display: flex; align-items: center; gap: 6px;
    }
    .conf-bar-bg {
      width: 50px; height: 8px; border-radius: 4px;
      background: rgba(255,255,255,0.06); overflow: hidden;
    }
    .conf-bar-fill {
      height: 100%; border-radius: 4px;
      transition: width 0.4s ease;
    }
    .conf-val {
      font-size: 11px; font-weight: 800;
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    }

    /* Break indicators */
    .brk-row { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
    .brk-tag {
      font-size: 8px; padding: 2px 7px; border-radius: 4px;
      font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase;
    }
    .brk-tag.h1-on { background: rgba(96,165,250,0.12); color: #60a5fa; }
    .brk-tag.m15-on { background: rgba(168,85,247,0.12); color: #a855f7; }
    .brk-tag.h1-off { background: rgba(255,255,255,0.04); color: var(--text-dim); }
    .brk-tag.m15-off { background: rgba(255,255,255,0.04); color: var(--text-dim); }
    .brk-tag.both { background: rgba(20,184,166,0.12); color: #2dd4bf; }
    .brk-tag.momentum { background: rgba(251,146,60,0.12); color: #fb923c; }

    .eng-cand-detail {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }
    .eng-cand-side {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 700;
    }
    .eng-cand-side.strong {
      background: rgba(34,197,94,0.06); border: 1px solid rgba(34,197,94,0.1);
    }
    .eng-cand-side.weak {
      background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.1);
    }
    .eng-cand-side-ccy { font-weight: 800; font-size: 12px; }
    .eng-cand-side.strong .eng-cand-side-ccy { color: #4ade80; }
    .eng-cand-side.weak .eng-cand-side-ccy { color: #f87171; }
    .eng-cand-side-val {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      font-size: 10px; font-weight: 700; color: var(--text-muted);
    }
    .eng-cand-side-label {
      font-size: 8px; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.5px; margin-left: auto;
    }

    @media (max-width: 720px) {
      .eng-body { grid-template-columns: 1fr; }
      .eng-cands-wrap { border-left: none; border-top: 1px solid rgba(255,255,255,0.04); }
      .sx-main { padding: 14px 12px 60px; }
      .sx-ctrls { width: 100%; margin-left: 0; }
      .eng-score-cell { width: 60px; }
      .eng-time { font-size: 15px; }
      .eng-cand-detail { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="sx-topbar">
    <div class="sx-topbar-left">
      <a class="sx-logo" href="/app"><img src="/nervafx-logo.png" alt="NervaFX" onerror="this.style.display='none'"></a>
      <span class="sx-sep">/</span>
      <span class="sx-title-text">Acceleration Intelligence Engine</span>
    </div>
    <a class="sx-back-btn" href="/app" onclick="window.close(); setTimeout(function(){ location.href='/app'; }, 150); return false;">&times; Close</a>
  </div>

  <main class="sx-main">
    <div class="sx-card">
      <div class="sx-card-hd">
        <i data-lucide="brain"></i> Intelligence Engine
        <span class="sx-note">M15 momentum lifecycle — Birth &rarr; Growth &rarr; Exhaustion &rarr; Rotation</span>
        <span class="sx-ctrls">
          <button class="sx-btn sx-days active" data-days="1">1D</button>
          <button class="sx-btn sx-days" data-days="2">2D</button>
          <button class="sx-btn sx-days" data-days="5">5D</button>
          <button class="sx-btn sx-days" data-days="10">10D</button>
          <span class="sx-ctrl-sep"></span>
          <button class="sx-btn sx-session active" data-session="all">All</button>
          <button class="sx-btn sx-session" data-session="asia">Asia</button>
          <button class="sx-btn sx-session" data-session="london">London</button>
          <button class="sx-btn sx-session" data-session="newyork">New York</button>
          <span class="sx-ctrl-sep"></span>
          <input type="date" class="sx-date-input" id="sx-date-from" title="From date">
          <input type="date" class="sx-date-input" id="sx-date-to" title="To date">
          <button class="sx-btn" id="sx-date-go">Go</button>
        </span>
      </div>
    </div>
    <div id="eng-cards">
      <div class="sx-loading"><span class="spinner"></span> Loading…</div>
    </div>
  </main>

  <script>
  (function () {
    'use strict';

    var TOKEN = localStorage.getItem('nfx_token');
    if (!TOKEN) { location.href = '/login'; return; }

    var currentDays = 1;
    var currentSession = 'all';
    var cachedRows = [];

    var SESSIONS = {
      all:     { start: 0, end: 24 },
      asia:    { start: 0, end: 8 },
      london:  { start: 7, end: 16 },
      newyork: { start: 12, end: 21 },
    };

    function inSession(iso) {
      if (currentSession === 'all') return true;
      var h = new Date(iso).getUTCHours();
      var s = SESSIONS[currentSession];
      return h >= s.start && h < s.end;
    }

    function hrLabel(iso) {
      return new Date(iso).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Africa/Nairobi' });
    }
    function dayLabel(iso) {
      return new Date(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit', timeZone: 'Africa/Nairobi' });
    }
    function isWeekend(iso) {
      var d = new Date(iso).getUTCDay();
      return d === 0 || d === 6;
    }
    function vcls(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero'; }
    function vfmt(v) { return (v >= 0 ? '+' : '') + v.toFixed(1); }

    function confColor(c) {
      if (c >= 70) return '#4ade80';
      if (c >= 50) return '#2dd4bf';
      if (c >= 30) return '#fbbf24';
      return '#f87171';
    }

    function scoreBar(score) {
      var cls = score >= 0 ? 'pos' : 'neg';
      var w = Math.abs(score) / 2;
      var style = cls === 'pos'
        ? 'right:50%;width:' + w + '%;transform-origin:right'
        : 'left:50%;width:' + w + '%;transform-origin:left';
      return '<div class="eng-score-bar">' +
        '<div class="eng-score-mid"></div>' +
        '<div class="eng-score-fill ' + cls + '" style="' + style + '"></div>' +
        '<div class="eng-score-val">' + (score >= 0 ? '+' : '') + score + '</div>' +
        '</div>';
    }

    function consecDots(count, max) {
      max = max || 5;
      var n = Math.min(count, max);
      var h = '<span class="consec-dots">';
      for (var i = 0; i < max; i++) {
        h += '<span class="consec-dot' + (i < n ? ' active' : '') + '"></span>';
      }
      h += '</span>';
      return h;
    }

    function renderCards(rows) {
      var el = document.getElementById('eng-cards');
      if (!rows.length) {
        el.innerHTML = '<div class="br-empty">No engine data found for this period.</div>';
        return;
      }

      var html = '';
      var reversed = rows.slice().reverse();
      for (var r = 0; r < reversed.length; r++) {
        var row = reversed[r];
        if (isWeekend(row.time)) continue;
        if (!inSession(row.time)) continue;

        var hasCands = row.candidates && row.candidates.length > 0;
        var hasRotation = row.rotations && row.rotations.length > 0;
        html += '<div class="eng-card' + (hasCands ? ' has-candidates' : '') + '">';

        // Header
        html += '<div class="eng-hd">';
        html += '<div class="eng-time-block">';
        html += '<span class="eng-time">' + hrLabel(row.time) + '</span>';
        html += '<span class="eng-date">' + dayLabel(row.time) + '</span>';
        html += '</div>';
        if (hasCands) {
          html += '<span class="eng-cand-count">' + row.candidates.length + ' signal' + (row.candidates.length > 1 ? 's' : '') + '</span>';
        } else {
          html += '<span class="eng-cand-count none">No signals</span>';
        }
        html += '</div>';

        // Rotation banner
        if (hasRotation) {
          html += '<div class="eng-rotation-banner">';
          html += '<i data-lucide="refresh-cw"></i> ROTATION: ';
          for (var ri = 0; ri < row.rotations.length; ri++) {
            var rot = row.rotations[ri];
            if (ri > 0) html += ' &middot; ';
            html += rot.from + ' (' + rot.fromDir + ' exhaust) &rarr; ' + rot.to + ' (' + rot.toDir + ' emerging)';
          }
          html += '</div>';
        }

        // Scores bar
        if (row.scores) {
          var sc = row.scores;
          html += '<div class="eng-scores-bar">';
          var scoreItems = [
            { label: 'ACCEL', val: sc.acceleration },
            { label: 'PERSIST', val: sc.persistence },
            { label: 'CONSENS', val: sc.consensus },
            { label: 'EXPANS', val: sc.expansion }
          ];
          for (var si = 0; si < scoreItems.length; si++) {
            var s = scoreItems[si];
            var pct = Math.max(0, Math.min(100, s.val));
            var circ = 2 * Math.PI * 18;
            var offset = circ - (pct / 100) * circ;
            var sColor = pct >= 70 ? '#14b8a6' : pct >= 40 ? '#f59e0b' : '#ef4444';
            html += '<div class="eng-score-item">';
            html += '<div class="eng-score-ring">';
            html += '<svg viewBox="0 0 44 44"><circle class="eng-score-ring-bg" cx="22" cy="22" r="18"/>';
            html += '<circle class="eng-score-ring-fill" cx="22" cy="22" r="18" stroke="' + sColor + '" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"/></svg>';
            html += '<span class="eng-score-ring-val" style="color:' + sColor + '">' + Math.round(pct) + '</span>';
            html += '</div>';
            html += '<span class="eng-score-label">' + s.label + '</span>';
            html += '</div>';
          }
          var qColor = sc.tradeQuality >= 80 ? '#14b8a6' : sc.tradeQuality >= 60 ? '#22c55e' : sc.tradeQuality >= 40 ? '#f59e0b' : '#ef4444';
          html += '<div class="eng-quality-block">';
          html += '<span class="eng-quality-score" style="color:' + qColor + '">' + Math.round(sc.tradeQuality) + '</span>';
          html += '<div class="eng-quality-meta">';
          html += '<span class="eng-quality-label-top">Trade Quality</span>';
          html += '<span class="eng-quality-label" style="color:' + qColor + '">' + sc.qualityLabel + '</span>';
          html += '</div></div></div>';
        }

        // Body
        html += '<div class="eng-body' + (hasCands ? '' : ' no-cands') + '">';

        // Left: Ranking table with phases
        html += '<div class="eng-ranking-wrap">';
        html += '<div class="eng-section-label">Momentum Lifecycle</div>';
        html += '<table class="eng-ranking">';
        html += '<thead><tr><th>#</th><th>CCY</th><th>Accel</th><th>Phase</th><th class="eng-score-cell">Score</th></tr></thead>';
        html += '<tbody>';
        for (var i = 0; i < row.ranking.length; i++) {
          var a = row.ranking[i];
          html += '<tr>';
          html += '<td class="eng-rank-num">' + (i + 1) + '</td>';
          html += '<td class="eng-ccy ' + vcls(a.acceleration) + '">' + a.currency;
          if (a.isLeader) html += '<span class="leader-star" title="Leading momentum">★</span>';
          html += '</td>';
          html += '<td class="eng-accel ' + vcls(a.acceleration) + '">' + vfmt(a.acceleration) + '</td>';
          html += '<td>';
          html += '<span class="phase-badge ' + a.phase + '">' + a.phase + '</span>';
          if (a.consecutive > 1) html += consecDots(a.consecutive);
          html += '</td>';
          html += '<td class="eng-score-cell">' + scoreBar(a.score) + '</td>';
          html += '</tr>';
        }
        html += '</tbody></table>';
        html += '</div>';

        // Right: Confirmed pairs with confidence
        if (hasCands) {
          html += '<div class="eng-cands-wrap">';
          html += '<div class="eng-section-label">High-Confidence Signals</div>';
          for (var c = 0; c < row.candidates.length; c++) {
            var cd = row.candidates[c];
            html += '<div class="eng-cand">';

            // Top: pair, direction, confidence
            html += '<div class="eng-cand-top">';
            html += '<span class="eng-cand-pair">' + cd.pair + '</span>';
            html += '<span class="eng-cand-dir ' + cd.direction + '">' + cd.direction + '</span>';
            html += '<div class="conf-meter">';
            html += '<div class="conf-bar-bg"><div class="conf-bar-fill" style="width:' + cd.confidence + '%;background:' + confColor(cd.confidence) + '"></div></div>';
            html += '<span class="conf-val" style="color:' + confColor(cd.confidence) + '">' + cd.confidence + '</span>';
            html += '</div>';
            html += '</div>';

            // Break tags
            html += '<div class="brk-row">';
            if (cd.h1Break && cd.m15Break) {
              html += '<span class="brk-tag both">H1+M15 ALIGNED</span>';
            } else {
              html += '<span class="brk-tag ' + (cd.h1Break ? 'h1-on' : 'h1-off') + '">H1 ' + (cd.h1Break ? '✓' : '—') + '</span>';
              html += '<span class="brk-tag ' + (cd.m15Break ? 'm15-on' : 'm15-off') + '">M15 ' + (cd.m15Break ? '✓' : '—') + '</span>';
            }
            html += '<span class="phase-badge ' + cd.strongPhase + '">' + cd.strongCcy + ' ' + cd.strongPhase + '</span>';
            html += '<span class="phase-badge ' + cd.weakPhase + '">' + cd.weakCcy + ' ' + cd.weakPhase + '</span>';
            if (cd.bodyPct > 0) {
              html += '<span class="brk-tag" style="background:rgba(96,165,250,0.12);color:#60a5fa">' + cd.bodyPct + '% body</span>';
            }
            if (cd.h1Consec >= 2) {
              html += '<span class="brk-tag momentum">' + cd.h1Consec + 'x H1</span>';
            }
            html += '</div>';

            // Detail: strong vs weak
            html += '<div class="eng-cand-detail">';
            html += '<div class="eng-cand-side strong">';
            html += '<span class="eng-cand-side-ccy">' + cd.strongCcy + '</span>';
            html += '<span class="eng-cand-side-val">45M ' + vfmt(cd.strongS45) + '</span>';
            html += '<span class="eng-cand-side-val" style="color:var(--text-dim)">3H ' + vfmt(cd.strongH3) + '</span>';
            if (cd.strongIsLeader) html += '<span class="leader-star">★</span>';
            html += '<span class="eng-cand-side-label">Strong</span>';
            html += '</div>';
            html += '<div class="eng-cand-side weak">';
            html += '<span class="eng-cand-side-ccy">' + cd.weakCcy + '</span>';
            html += '<span class="eng-cand-side-val">45M ' + vfmt(cd.weakS45) + '</span>';
            html += '<span class="eng-cand-side-val" style="color:var(--text-dim)">3H ' + vfmt(cd.weakH3) + '</span>';
            if (cd.weakIsLeader) html += '<span class="leader-star">★</span>';
            html += '<span class="eng-cand-side-label">Weak</span>';
            html += '</div>';
            html += '</div>';

            // Forward candle table (hidden by default)
            if (cd.h1Forward && cd.h1Forward.length) {
              html += '<div class="eng-fwd">';
              html += '<div class="eng-fwd-label"><i data-lucide="candlestick-chart"></i> H1 Candles from signal (' + cd.h1Forward.length + ' available)</div>';
              if (cd.entryPrice) html += '<div class="eng-fwd-entry">Entry: ' + cd.entryPrice.toFixed(cd.pair.includes('JPY') ? 3 : 5) + '</div>';
              html += '<table class="eng-fwd-table">';
              html += '<thead><tr><th>Time</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Pips</th></tr></thead>';
              html += '<tbody>';
              var prec = cd.pair.includes('JPY') ? 3 : 5;
              for (var f = 0; f < cd.h1Forward.length; f++) {
                var fc = cd.h1Forward[f];
                var bull = fc.close > fc.open;
                var cls = bull ? 'eng-fwd-bull' : 'eng-fwd-bear';
                var pipCls = fc.pips >= 0 ? 'eng-fwd-bull' : 'eng-fwd-bear';
                html += '<tr>';
                html += '<td class="eng-fwd-time">' + hrLabel(fc.time) + '</td>';
                html += '<td class="' + cls + '">' + fc.open.toFixed(prec) + '</td>';
                html += '<td class="' + cls + '">' + fc.high.toFixed(prec) + '</td>';
                html += '<td class="' + cls + '">' + fc.low.toFixed(prec) + '</td>';
                html += '<td class="' + cls + '">' + fc.close.toFixed(prec) + '</td>';
                html += '<td class="eng-fwd-pips ' + pipCls + '">' + (fc.pips >= 0 ? '+' : '') + fc.pips + '</td>';
                html += '</tr>';
              }
              html += '</tbody></table>';
              html += '</div>';
            }

            html += '</div>';
          }
          html += '</div>';
        }

        html += '</div></div>';
      }
      el.innerHTML = html || '<div class="br-empty">No data found.</div>';
      el.querySelectorAll('.eng-cand').forEach(function(card) {
        card.addEventListener('click', function() { card.classList.toggle('open'); });
      });
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function load() {
      document.getElementById('eng-cards').innerHTML = '<div class="sx-loading"><span class="spinner"></span> Loading…</div>';

      var fromEl = document.getElementById('sx-date-from');
      var toEl = document.getElementById('sx-date-to');
      var qs;
      if (fromEl.value && toEl.value) {
        qs = 'from=' + fromEl.value + '&to=' + toEl.value;
      } else {
        qs = 'days=' + currentDays;
      }

      try {
        var res = await fetch('/api/acceleration-engine?' + qs, {
          headers: { Authorization: 'Bearer ' + TOKEN },
        });
        if (!res.ok) throw new Error(await res.text());
        var json = await res.json();
        cachedRows = json.rows || [];
        renderCards(cachedRows);
      } catch (e) {
        document.getElementById('eng-cards').innerHTML =
          '<div class="br-empty" style="color:#f87171">Error: ' + e.message + '</div>';
      }
    }

    document.querySelectorAll('.sx-days').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.sx-days').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentDays = parseInt(btn.dataset.days, 10);
        document.getElementById('sx-date-from').value = '';
        document.getElementById('sx-date-to').value = '';
        load();
      });
    });

    document.querySelectorAll('.sx-session').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.sx-session').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentSession = btn.dataset.session;
        renderCards(cachedRows);
      });
    });

    document.getElementById('sx-date-go').addEventListener('click', function() {
      document.querySelectorAll('.sx-days').forEach(function(b) { b.classList.remove('active'); });
      load();
    });

    lucide.createIcons();
    load();
    setInterval(load, 15 * 60 * 1000);
  })();
  </script>
</body>
</html>
