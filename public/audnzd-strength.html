<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>NervaFX — AUD/NZD Strength</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .grid { display: block !important; }
    .sx-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px;
      background: rgba(8,11,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .sx-topbar-left { display: flex; align-items: center; gap: 12px; }
    .sx-logo img { height: 24px; display: block; }
    .sx-sep { color: rgba(255,255,255,0.1); font-size: 20px; font-weight: 200; }
    .sx-title-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .sx-back-btn {
      display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.15s;
    }
    .sx-back-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }

    .an-main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 80px; }
    .an-intro { font-size: 12px; color: var(--text-muted); margin: 0 0 16px; }

    /* Controls */
    .an-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .an-date-input {
      padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text); font-family: inherit; outline: none;
    }
    .an-date-input::-webkit-calendar-picker-indicator { filter: invert(0.7); }
    .an-btn {
      padding: 5px 14px; border-radius: 6px; font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .an-btn:hover { background: rgba(255,255,255,0.08); }
    .an-btn.active { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); color: #3b82f6; }
    .an-btn.go { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); color: #3b82f6; }
    .an-btn.go:hover { background: rgba(59,130,246,0.25); }

    /* Summary cards */
    .an-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .an-stat {
      border-radius: 10px; padding: 14px 16px; text-align: center;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
    }
    .an-stat-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .an-stat-val { font-size: 22px; font-weight: 800; }

    /* Signal events */
    .an-signals-hd { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 20px 0 10px; }
    .an-signal-row {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px; margin-bottom: 6px; flex-wrap: wrap;
    }
    .an-signal-time { font-size: 11px; font-weight: 600; color: var(--text-muted); min-width: 130px; }
    .an-signal-badge {
      font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .badge-strongest { background: rgba(34,197,94,0.15); color: #22c55e; }
    .badge-weakest { background: rgba(239,68,68,0.15); color: #ef4444; }
    .an-signal-rank { font-size: 11px; color: var(--text-muted); }
    .an-signal-val { font-size: 11px; font-weight: 700; }
    .an-signal-trades { display: flex; gap: 6px; margin-left: auto; }
    .an-trade {
      font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
      letter-spacing: 0.2px;
    }
    .an-trade-buy { background: rgba(34,197,94,0.12); color: #4ade80; }
    .an-trade-sell { background: rgba(239,68,68,0.12); color: #f87171; }

    .an-score-toggle {
      font-size: 10px; font-weight: 600; color: #60a5fa; cursor: pointer;
      background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.25);
      padding: 2px 8px; border-radius: 4px; white-space: nowrap;
    }
    .an-score-toggle:hover { background: rgba(59,130,246,0.2); }
    .an-scoreboard {
      display: none; width: 100%; margin-top: 6px;
      background: rgba(0,0,0,0.2); border-radius: 6px; padding: 8px 10px;
    }
    .an-scoreboard.open { display: block; }
    .an-score-bar {
      display: flex; align-items: center; gap: 8px; padding: 3px 0;
    }
    .an-score-ccy { font-size: 11px; font-weight: 800; min-width: 30px; }
    .an-score-meter { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; position: relative; }
    .an-score-fill { height: 100%; border-radius: 3px; position: absolute; }
    .an-score-fill-pos { background: #22c55e; right: 50%; }
    .an-score-fill-neg { background: #ef4444; left: 50%; }
    .an-score-num { font-size: 10px; font-weight: 600; min-width: 55px; text-align: right; }
    .an-score-rank-num { font-size: 9px; color: var(--text-muted); min-width: 18px; }
    .ccy-aud { color: #60a5fa; }
    .ccy-nzd { color: #a78bfa; }

    .val-pos { color: #4ade80; }
    .val-neg { color: #f87171; }
    .val-zero { color: #64748b; }

    .an-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 13px; }
    .an-loading { text-align: center; padding: 60px; color: var(--text-muted); font-size: 13px; }

  </style>
</head>
<body>
  <div class="sx-topbar">
    <div class="sx-topbar-left">
      <a class="sx-logo" href="/app"><img src="/nervafx-logo.png" alt="NervaFX"></a>
      <span class="sx-sep">|</span>
      <span class="sx-title-text">AUD / NZD Strength Engine</span>
    </div>
    <a class="sx-back-btn" href="/app">← Dashboard</a>
  </div>

  <div class="an-main">
    <p class="an-intro">12-hour raw (unsmoothed) currency strength — identifies when AUD or NZD ranks #1 (strongest) or #8 (weakest) across all currencies.</p>

    <div class="an-controls">
      <button class="an-btn active" id="btn7d" onclick="setRange(7)">7 Days</button>
      <button class="an-btn" id="btn14d" onclick="setRange(14)">14 Days</button>
      <button class="an-btn" id="btn30d" onclick="setRange(30)">30 Days</button>
      <button class="an-btn" id="btn90d" onclick="setRange(90)">90 Days</button>
      <button class="an-btn" id="btn180d" onclick="setRange(180)">180 Days</button>
      <span style="color:rgba(255,255,255,0.15);margin:0 4px">|</span>
      <input type="date" class="an-date-input" id="dateInput" />
      <button class="an-btn go" onclick="goDate()">Go</button>
      <button class="an-btn" id="btnLive" onclick="goLive()" style="display:none">← Live</button>
    </div>

    <div id="content"><div class="an-loading">Loading…</div></div>
  </div>

  <script>
    const TOKEN = localStorage.getItem('nfx_token');
    let _mode = 'range'; // 'range' or 'date'
    let _days = 7;
    let _date = null;

    function setRange(d) {
      _mode = 'range'; _days = d; _date = null;
      document.getElementById('btnLive').style.display = 'none';
      document.querySelectorAll('.an-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn' + d + 'd').classList.add('active');
      load();
    }

    function goDate() {
      const v = document.getElementById('dateInput').value;
      if (!v) return;
      _mode = 'date'; _date = v;
      document.querySelectorAll('.an-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btnLive').style.display = '';
      load();
    }

    function goLive() {
      setRange(_days);
    }

    function fmtTime(iso) {
      try {
        const d = new Date(iso);
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        return d.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz });
      } catch (_) { return iso; }
    }

    function fmtVal(v) {
      if (v == null) return '—';
      return (v >= 0 ? '+' : '') + (v * 100).toFixed(3) + '%';
    }

    function valClass(v) {
      if (v > 0.0001) return 'val-pos';
      if (v < -0.0001) return 'val-neg';
      return 'val-zero';
    }

    async function load() {
      const el = document.getElementById('content');
      el.innerHTML = '<div class="an-loading">Loading…</div>';

      let url = '/api/audnzd-strength?';
      if (_mode === 'date') url += 'date=' + _date;
      else url += 'days=' + _days;

      try {
        const r = await fetch(url, { headers: { Authorization: 'Bearer ' + TOKEN } });
        const d = await r.json();
        if (d.error) { el.innerHTML = `<div class="an-empty">${d.error}</div>`; return; }
        render(d);
      } catch (e) {
        el.innerHTML = `<div class="an-empty">Error: ${e.message}</div>`;
      }
    }

    function render(d) {
      const el = document.getElementById('content');
      if (!d.totalHours) {
        el.innerHTML = '<div class="an-empty">No data for this period. Historical data starts May 2025.</div>';
        return;
      }

      let html = '';

      // Summary
      const s = d.summary;
      html += '<div class="an-summary">';
      html += `<div class="an-stat">
        <div class="an-stat-label">AUD Strongest</div>
        <div class="an-stat-val" style="color:#22c55e">${s.aud.strongest}</div>
      </div>`;
      html += `<div class="an-stat">
        <div class="an-stat-label">AUD Weakest</div>
        <div class="an-stat-val" style="color:#ef4444">${s.aud.weakest}</div>
      </div>`;
      html += `<div class="an-stat">
        <div class="an-stat-label">NZD Strongest</div>
        <div class="an-stat-val" style="color:#22c55e">${s.nzd.strongest}</div>
      </div>`;
      html += `<div class="an-stat">
        <div class="an-stat-label">NZD Weakest</div>
        <div class="an-stat-val" style="color:#ef4444">${s.nzd.weakest}</div>
      </div>`;
      html += `<div class="an-stat">
        <div class="an-stat-label">Total Hours</div>
        <div class="an-stat-val" style="color:#60a5fa">${d.totalHours}</div>
      </div>`;
      html += '</div>';

      // Signal events
      if (d.signals.length) {
        html += '<div class="an-signals-hd">Signal Events (Rank #1 or #8)</div>';
        for (const sig of d.signals.slice().reverse()) {
          html += '<div class="an-signal-row">';
          html += `<span class="an-signal-time">${fmtTime(sig.time)}</span>`;
          if (sig.aud.signal) {
            const cls = sig.aud.signal === 'STRONGEST' ? 'badge-strongest' : 'badge-weakest';
            html += `<span class="an-signal-badge ${cls}">AUD ${sig.aud.signal}</span>`;
            html += `<span class="an-signal-rank">#${sig.aud.rank}</span>`;
            html += `<span class="an-signal-val ${valClass(sig.aud.value)}">${fmtVal(sig.aud.value)}</span>`;
          }
          if (sig.nzd.signal) {
            const cls = sig.nzd.signal === 'STRONGEST' ? 'badge-strongest' : 'badge-weakest';
            html += `<span class="an-signal-badge ${cls}">NZD ${sig.nzd.signal}</span>`;
            html += `<span class="an-signal-rank">#${sig.nzd.rank}</span>`;
            html += `<span class="an-signal-val ${valClass(sig.nzd.value)}">${fmtVal(sig.nzd.value)}</span>`;
          }
          const trades = (sig.aud.trades || []).concat(sig.nzd.trades || []);
          if (trades.length) {
            html += '<span class="an-signal-trades">';
            for (const t of trades) {
              const cls = t.direction === 'BUY' ? 'an-trade-buy' : 'an-trade-sell';
              html += `<span class="an-trade ${cls}">${t.direction} ${t.pair}</span>`;
            }
            html += '</span>';
          }
          // Currency scoreboard toggle
          const sid = 'sb_' + sig.time.replace(/[^a-z0-9]/gi, '');
          html += `<span class="an-score-toggle" onclick="document.getElementById('${sid}').classList.toggle('open')">▸ Scores</span>`;
          // Scoreboard
          const maxAbs = Math.max(...sig.ranking.map(r => Math.abs(r.value)), 0.001);
          html += `<div class="an-scoreboard" id="${sid}">`;
          for (let i = 0; i < sig.ranking.length; i++) {
            const r = sig.ranking[i];
            const pct = Math.abs(r.value) / maxAbs * 50;
            const isAud = r.currency === 'AUD';
            const isNzd = r.currency === 'NZD';
            const ccyCls = isAud ? 'ccy-aud' : isNzd ? 'ccy-nzd' : '';
            const fillCls = r.value >= 0 ? 'an-score-fill-pos' : 'an-score-fill-neg';
            const fillStyle = r.value >= 0
              ? `right:50%;width:${pct}%`
              : `left:50%;width:${pct}%`;
            html += `<div class="an-score-bar">
              <span class="an-score-rank-num">#${i + 1}</span>
              <span class="an-score-ccy ${ccyCls}">${r.currency}</span>
              <div class="an-score-meter"><div class="an-score-fill ${fillCls}" style="${fillStyle}"></div></div>
              <span class="an-score-num ${valClass(r.value)}">${fmtVal(r.value)}</span>
            </div>`;
          }
          html += '</div>';
          html += '</div>';
        }
      }

      el.innerHTML = html;
    }

    load();
  </script>
</body>
</html>
