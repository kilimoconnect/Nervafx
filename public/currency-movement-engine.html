<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>NervaFX — Currency Movement Engine</title>
<link rel="icon" type="image/png" href="/nervafx-icon.png">
<script src="/auth-guard.js"></script>
<link rel="stylesheet" href="style.css" />
<style>
  .grid { display:block !important; }
  .cm-topbar { position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 20px; height:56px; background:rgba(8,11,18,0.92); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
  .cm-left { display:flex; align-items:center; gap:12px; }
  .cm-logo img { height:24px; display:block; }
  .cm-sep { color:rgba(255,255,255,0.1); font-size:20px; }
  .cm-title { font-size:13px; font-weight:600; color:var(--text-muted); }
  .cm-back { padding:6px 12px; border-radius:8px; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-muted); font-size:12px; text-decoration:none; }
  .cm-sub { text-align:center; padding:12px 20px 4px; font-size:11px; color:var(--text-dim); }
  .cm-sub b { color:#94a3b8; }
  .cm-tabs { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:8px 16px 2px; }
  .cm-tab { padding:6px 12px; border-radius:8px; font-size:11px; font-weight:700; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-muted); cursor:pointer; }
  .cm-tab.active { background:rgba(56,189,248,0.18); border-color:rgba(56,189,248,0.45); color:#38bdf8; }
  .cm-views { display:flex; gap:6px; justify-content:center; padding:4px 16px 6px; }
  .cm-view { padding:5px 12px; border-radius:8px; font-size:11px; font-weight:700; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-muted); cursor:pointer; }
  .cm-view.active { background:rgba(167,139,250,0.2); border-color:rgba(167,139,250,0.45); color:#a78bfa; }
  .cm-histbar { display:flex; align-items:center; justify-content:center; gap:6px; padding:6px 16px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
  .cm-input { padding:5px 10px; border-radius:7px; font-size:11px; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-muted); color-scheme:dark; }
  .cm-btn { padding:5px 12px; border-radius:7px; font-size:11px; font-weight:700; background:rgba(56,189,248,0.2); border:1px solid rgba(56,189,248,0.4); color:#38bdf8; cursor:pointer; }
  .cm-btn.ghost { background:rgba(255,255,255,0.04); border-color:var(--border); color:var(--text-muted); }
  .cm-btn.live { background:rgba(34,197,94,0.18); border-color:rgba(34,197,94,0.45); color:#4ade80; }
  .cm-meta { text-align:center; padding:8px 20px 2px; font-size:10px; color:var(--text-dim); }
  .cm-banner { display:none; max-width:1000px; margin:8px auto 0; padding:8px 14px; border-radius:10px; background:rgba(251,191,36,0.10); border:1px solid rgba(251,191,36,0.35); font-size:12px; color:#e2e8f0; }
  .cm-banner.show { display:block; }
  .cm-banner b { color:#fbbf24; }
  .cm-wrap { max-width:1000px; margin:0 auto; padding:10px 14px 60px; }
  .cm-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .cm-card { background:#0b0f18; border:1px solid var(--border); border-left-width:5px; border-radius:10px; padding:12px 14px; }
  .cm-card-hd { display:flex; align-items:center; justify-content:space-between; }
  .cm-cur { font-size:20px; font-weight:900; color:#fff; letter-spacing:1px; }
  .cm-rank { font-size:10px; color:var(--text-dim); font-weight:700; }
  .cm-score { font-family:monospace; font-weight:900; font-size:22px; }
  .cm-state { font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase; margin-top:2px; }
  .cm-micro { font-size:9px; font-weight:700; color:#c084fc; margin-top:1px; }
  .cm-bar { height:6px; border-radius:3px; background:rgba(255,255,255,0.06); margin-top:8px; overflow:hidden; position:relative; }
  .cm-bar > i { position:absolute; top:0; bottom:0; left:50%; }
  .cm-rows { margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:1px 12px; }
  .cm-kv { display:flex; justify-content:space-between; font-size:10px; padding:1px 0; gap:8px; }
  .cm-k { color:var(--text-dim); } .cm-v { color:#e2e8f0; font-weight:600; }
  .cm-struct { margin-top:8px; padding-top:6px; border-top:1px solid var(--border); display:grid; grid-template-columns:1fr; gap:1px; }
  .cm-edges { max-width:1000px; margin:18px auto 0; }
  .cm-edges h3 { font-size:12px; font-weight:800; color:#e2e8f0; margin:0 0 6px; }
  .cm-efilter { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .cm-etab { padding:4px 10px; border-radius:7px; font-size:10px; font-weight:700; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-muted); cursor:pointer; }
  .cm-etab.active { background:rgba(56,189,248,0.18); border-color:rgba(56,189,248,0.45); color:#38bdf8; }
  .cm-etable { width:100%; border-collapse:collapse; font-size:11px; }
  .cm-etable th { text-align:left; padding:5px 8px; color:var(--text-dim); border-bottom:1px solid var(--border); white-space:nowrap; }
  .cm-etable td { padding:5px 8px; border-bottom:1px solid rgba(255,255,255,0.04); color:#cbd5e1; white-space:nowrap; }
  .cm-tablewrap { overflow-x:auto; }
  .cm-empty, .cm-loading { text-align:center; color:var(--text-muted); padding:36px; }
  .cm-spin { display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:#38bdf8;border-radius:50%;animation:cmspin 0.7s linear infinite;vertical-align:middle; }
  @keyframes cmspin { to { transform:rotate(360deg); } }
  @media (max-width:640px){ .cm-cards{grid-template-columns:1fr 1fr;} .cm-rows{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="cm-topbar">
  <div class="cm-left"><a href="/app" class="cm-logo"><img src="/nervafx-logo.png" alt="NervaFX" /></a><span class="cm-sep">|</span><span class="cm-title">Currency Movement Engine</span></div>
  <a href="/app" class="cm-back">← Back</a>
</div>
<div class="cm-sub"><b>Eight-currency movement</b> decomposed from all 28 pairs via <b>pair log returns</b> (constrained least squares), refined by 15M micro-structure. Analytical only.</div>

<div class="cm-tabs" id="cm-tabs"></div>
<div class="cm-views">
  <button class="cm-view active" data-view="H1">H1 View</button>
  <button class="cm-view" data-view="M15">15M Structure View</button>
  <button class="cm-view" data-view="COMBINED">Combined View</button>
</div>

<div class="cm-histbar">
  <input type="date" id="h-date" class="cm-input" />
  <select id="h-time" class="cm-input"></select>
  <select id="h-tz" class="cm-input"></select>
  <button id="h-prev" class="cm-btn ghost">‹ Prev H1</button>
  <button id="h-next" class="cm-btn ghost">Next H1 ›</button>
  <button id="h-apply" class="cm-btn">Snapshot</button>
  <button id="h-live" class="cm-btn live">● Go Live</button>
</div>

<div class="cm-meta" id="cm-meta"></div>
<div class="cm-banner" id="cm-banner"></div>
<div class="cm-wrap" id="cm-body"><div class="cm-loading"><span class="cm-spin"></span> Loading…</div></div>

<script>
  var TOKEN = localStorage.getItem('nfx_token') || '';
  var H1 = 3600000, DEFAULT_TZ = 'Africa/Dar_es_Salaam';
  var HIST = { active:false, atMs:null };
  var WINDOW = 'H1', VIEW = 'H1', DATA = null;
  var WINDOWS = ['H1','M15','REFERENCE_SESSION','ASIA_TO_DATE','LONDON_TO_DATE','DAY_TO_DATE'];
  var WLABEL = { H1:'H1', M15:'15M', REFERENCE_SESSION:'Reference Session', ASIA_TO_DATE:'Asia → Date', LONDON_TO_DATE:'London → Date', DAY_TO_DATE:'Day → Date' };
  var STATE_COLOR = { STRONG_UP:'#22c55e', UP:'#4ade80', NEUTRAL:'#64748b', DOWN:'#f87171', STRONG_DOWN:'#ef4444' };

  function tz(){ var e=document.getElementById('h-tz'); return (e&&e.value)||DEFAULT_TZ; }
  function auth(){ return { headers:{Authorization:'Bearer '+TOKEN}, cache:'no-store' }; }
  function fmtLocal(ms){ if(ms==null) return '—'; return new Date(ms).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:tz()}); }
  function px(v){ return v==null?'—':(+v).toFixed(5); }
  function zonedWallToUtcMs(y,mo,d,h,mi,zone){ var a=Date.UTC(y,mo-1,d,h,mi,0); var dtf=new Intl.DateTimeFormat('en-US',{timeZone:zone,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}); var p={}; dtf.formatToParts(new Date(a)).forEach(function(x){if(x.type!=='literal')p[x.type]=x.value;}); var hh=(+p.hour)%24; var seen=Date.UTC(+p.year,+p.month-1,+p.day,hh,+p.minute,+p.second); return a+(a-seen); }
  function snapH1(ms){ return Math.floor(ms/H1)*H1; }
  function partsInTz(ms,zone){ var dtf=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); var o={}; dtf.formatToParts(new Date(ms)).forEach(function(x){if(x.type!=='literal')o[x.type]=x.value;}); return o; }

  (function init(){
    var t=document.getElementById('h-time'); for(var h=0;h<24;h++){var v=('0'+h).slice(-2)+':00';var o=document.createElement('option');o.value=v;o.textContent=v;t.appendChild(o);}
    var tzs=['Africa/Dar_es_Salaam','UTC','Europe/London','America/New_York','Asia/Tokyo']; var ts=document.getElementById('h-tz'); tzs.forEach(function(z){var o=document.createElement('option');o.value=z;o.textContent=z;ts.appendChild(o);}); ts.value=DEFAULT_TZ;
    var tabs=document.getElementById('cm-tabs'); WINDOWS.forEach(function(w){ var b=document.createElement('button'); b.className='cm-tab'+(w===WINDOW?' active':''); b.textContent=WLABEL[w]; b.onclick=function(){ WINDOW=w; [].forEach.call(tabs.children,function(x){x.classList.remove('active');}); b.classList.add('active'); render(); }; tabs.appendChild(b); });
    [].forEach.call(document.querySelectorAll('.cm-view'),function(v){ v.onclick=function(){ VIEW=v.getAttribute('data-view'); [].forEach.call(document.querySelectorAll('.cm-view'),function(x){x.classList.remove('active');}); v.classList.add('active'); render(); }; });
  })();

  function apiUrl(){ if(HIST.active&&HIST.atMs!=null) return '/api/currency-movement-engine?at='+encodeURIComponent(new Date(HIST.atMs).toISOString())+'&timezone='+encodeURIComponent(tz()); return '/api/currency-movement-engine'; }
  function syncUrl(){ var u=new URL(window.location.href); if(HIST.active&&HIST.atMs!=null){u.searchParams.set('at',new Date(HIST.atMs).toISOString());u.searchParams.set('timezone',tz());} else {u.searchParams.delete('at');u.searchParams.delete('timezone');} history.replaceState(null,'',u.toString()); }

  async function load(){
    var body=document.getElementById('cm-body'); body.innerHTML='<div class="cm-loading"><span class="cm-spin"></span> Loading…</div>'; syncUrl();
    try{ var res=await fetch(apiUrl(),auth()); if(!res.ok) throw new Error(await res.text()); DATA=await res.json(); render(); }
    catch(e){ body.innerHTML='<div class="cm-empty" style="color:#f87171">Error: '+(e.message||e)+'</div>'; }
  }

  function kv(k,v){ return '<div class="cm-kv"><span class="cm-k">'+k+'</span><span class="cm-v">'+v+'</span></div>'; }
  function pct(v){ return v==null?'—':Math.round(v*100)+'%'; }

  function card(cur, m){
    var col=STATE_COLOR[m.state]||'#64748b';
    var h='<div class="cm-card" style="border-left-color:'+col+'">';
    h+='<div class="cm-card-hd"><div><span class="cm-cur">'+cur+'</span> <span class="cm-rank">#'+m.rank+'</span><div class="cm-state" style="color:'+col+'">'+m.state.replace(/_/g,' ')+'</div>'+(m.microState?'<div class="cm-micro">'+m.microState.replace(/_/g,' ')+'</div>':'')+'</div>'
      +'<span class="cm-score" style="color:'+col+'">'+(m.movementScore>0?'+':'')+m.movementScore+'</span></div>';
    // signed bar
    var w=Math.min(50,Math.abs(m.movementScore)/2);
    h+='<div class="cm-bar"><i style="'+(m.movementScore>=0?'left:50%':'right:50%;left:auto')+';width:'+w+'%;background:'+col+'"></i></div>';
    h+='<div class="cm-rows">';
    if(VIEW==='M15'){
      h+=kv('Micro breadth',pct(m.breadth15M));
      h+=kv('Micro accel',(m.microAcceleration>0?'+':'')+(m.microAcceleration!=null?m.microAcceleration.toExponential(1):'—'));
      h+=kv('Persistence',pct(m.persistence));
      h+=kv('Efficiency',pct(m.efficiency));
    } else if(VIEW==='COMBINED'){
      h+=kv('Breadth',pct(m.breadthCombined));
      h+=kv('Efficiency',pct(m.efficiency));
      h+=kv('Persistence',pct(m.persistence));
      h+=kv('Acceleration',pct(m.acceleration));
    } else {
      h+=kv('Breadth H1',pct(m.breadthH1));
      h+=kv('Magnitude',pct(m.magnitude));
      h+=kv('Efficiency',pct(m.efficiency));
      h+=kv('Persistence',pct(m.persistence));
    }
    h+='</div>';
    if(m.structure){
      var sc=m.structure;
      h+='<div class="cm-struct">';
      h+=kv('Structure', (m.structureScore!=null?m.structureScore:'—')+' · '+(sc.structureDirection||'—')+' · '+(sc.structureClassification||'').replace(/_/g,' '));
      h+=kv('Confirmed score',(m.confirmedMovementScore!=null?(m.confirmedMovementScore>0?'+':'')+m.confirmedMovementScore:'—'));
      h+=kv('Decisive BOS',(sc.decisiveBreakCount!=null?sc.decisiveBreakCount:0)+' · breadth '+Math.round((sc.structureBreadth||0)*100)+'%');
      h+=kv('Agreement',(sc.agreement||'').replace(/_/g,' '));
      if(m.microStructure) h+=kv('H1/15M',(m.microStructure.confirmationState||'').replace(/_/g,' '));
      h+='</div>';
    }
    h+='</div>';
    return h;
  }

  var EFILTER='All';
  var EDGE_FILTERS=['All','Structure Confirmed','Movement Watch','Structure Conflict','Strong BOS','Very Strong BOS','Explosive BOS'];
  function edgePasses(e){
    switch(EFILTER){
      case 'Structure Confirmed': return e.opportunity==='STRUCTURE_CONFIRMED_MOVEMENT';
      case 'Movement Watch': return e.opportunity==='MOVEMENT_WATCH';
      case 'Structure Conflict': return e.opportunity==='STRUCTURE_CONFLICT';
      case 'Strong BOS': return ['STRONG','VERY_STRONG','EXPLOSIVE'].indexOf(e.bosGrade)!==-1;
      case 'Very Strong BOS': return ['VERY_STRONG','EXPLOSIVE'].indexOf(e.bosGrade)!==-1;
      case 'Explosive BOS': return e.bosGrade==='EXPLOSIVE';
      default: return true;
    }
  }
  // Only surface fully-qualified structure-confirmed movements (same rule the CME email alert fires on).
  var MIN_MOVE_EDGE=100, MIN_CONFIRMED=100, MIN_CLOSE_Q=0.80;
  function edgeQualifies(e){
    return e.opportunity==='STRUCTURE_CONFIRMED_MOVEMENT'
      && Math.abs(e.pairMovementEdge||0)>=MIN_MOVE_EDGE
      && Math.abs(e.pairConfirmedEdge||0)>=MIN_CONFIRMED
      && (e.closeQuality||0)>=MIN_CLOSE_Q;
  }
  function renderEdgesHtml(){
    var edges=(DATA.pairEdges||[]).filter(edgeQualifies).filter(edgePasses);
    var fb='<div class="cm-efilter">'+EDGE_FILTERS.map(function(f){return '<button class="cm-etab'+(f===EFILTER?' active':'')+'" data-f="'+f+'">'+f+'</button>';}).join('')+'</div>';
    var rows=edges.map(function(e){
      var col=e.bosDirection==='BULLISH'?'#4ade80':e.bosDirection==='BEARISH'?'#f87171':'#64748b';
      var bos=e.h1BreakOfStructure||{};
      return '<tr title="5-bar H '+px(bos.previousHigh)+' / L '+px(bos.previousLow)+' · ATR20 '+(bos.atr20!=null?bos.atr20.toExponential(1):'—')+' · body '+(bos.bodyATR!=null?bos.bodyATR:'—')+' ATR">'
        +'<td style="font-weight:700;color:#fff">'+e.pair.replace('_','/')+'</td>'
        +'<td>'+(e.pairMovementEdge>0?'+':'')+e.pairMovementEdge+'</td>'
        +'<td>'+(e.pairConfirmedEdge>0?'+':'')+e.pairConfirmedEdge+'</td>'
        +'<td style="color:'+col+'">'+e.bosDirection+'</td>'
        +'<td>'+e.bosGrade.replace(/_/g,' ')+'</td>'
        +'<td>'+(e.breakDistanceATR!=null?e.breakDistanceATR:'—')+'</td>'
        +'<td>'+Math.round((e.closeQuality||0)*100)+'%</td>'
        +'<td>'+e.structureAgreement+'</td>'
        +'<td style="color:#38bdf8">'+(e.opportunity||'').replace(/_/g,' ')+'</td></tr>';
    }).join('');
    return '<div class="cm-edges"><h3>Pair edges &amp; Break of Structure <span style="font-size:10px;color:var(--text-dim)">(Structure-Confirmed only · |move edge| &ge; 100 · |confirmed| &ge; 100 · close Q &ge; 80% · BOS = close beyond prior 5-candle high/low)</span></h3>'+fb
      +'<div class="cm-tablewrap"><table class="cm-etable"><thead><tr><th>Pair</th><th>Move edge</th><th>Confirmed</th><th>BOS</th><th>Grade</th><th>Dist ATR</th><th>Close Q</th><th>Agree</th><th>Opportunity</th></tr></thead><tbody>'
      +(rows||'<tr><td colspan="9" style="color:var(--text-dim)">No pairs match this filter.</td></tr>')+'</tbody></table></div></div>';
  }

  function render(){
    var body=document.getElementById('cm-body'), meta=document.getElementById('cm-meta'), banner=document.getElementById('cm-banner');
    if(!DATA){ return; }
    meta.innerHTML='<b>'+(DATA.engineKey||'')+'</b> '+(DATA.engineVersion||'')+'/'+(DATA.configurationVersion||'')+' · '+(DATA.pairsEvaluated||0)+'/'+(DATA.pairsRequested||28)+' pairs · '+(DATA.pairErrors?DATA.pairErrors.length:0)+' pair errors · '+(HIST.active?'historical':'generated '+fmtLocal(new Date(DATA.generatedAt).getTime()));
    if(HIST.active&&DATA.historicalMode){ banner.classList.add('show'); banner.innerHTML='<b>HISTORICAL MODE — read-only</b> · Snapshot: <b>'+(DATA.evaluatedAtLocal||fmtLocal(new Date(DATA.evaluatedAtUtc).getTime()))+' '+(DATA.timezone||tz())+'</b> · Market time: <b>'+(DATA.evaluatedAtUtc?new Date(DATA.evaluatedAtUtc).toISOString().slice(11,16)+' UTC':'—')+'</b>'; } else banner.classList.remove('show');

    var w=(DATA.windows||{})[WINDOW];
    if(!w || w.status!=='OK'){ body.innerHTML='<div class="cm-empty">'+WLABEL[WINDOW]+': '+((w&&w.status)||'NOT_ACTIVE').replace(/_/g,' ')+'</div>'; return; }
    var curs=Object.keys(w.currencies).map(function(c){return {c:c,m:w.currencies[c]};}).sort(function(a,b){return a.m.rank-b.m.rank;});
    var bs=w.bosStats;
    var info='<div class="cm-sub" style="padding-top:0">Window: <b>'+WLABEL[WINDOW]+'</b> · '+(w.startOpenUtc?w.startOpenUtc.slice(11,16):'')+'→'+(w.endCloseUtc?w.endCloseUtc.slice(11,16):'')+' UTC · '+(w.hours||0)+'h · '+(w.pairsUsed||0)+' pairs · residual '+(w.ssr!=null?w.ssr.toExponential(1):'—')
      +(bs?(' · BOS: '+bs.bullishBreakCount+'▲ '+bs.bearishBreakCount+'▼ · '+bs.decisiveBreakCount+' decisive'):'')+'</div>';
    body.innerHTML=renderEdgesHtml()+info+'<div class="cm-cards">'+curs.map(function(x){return card(x.c,x.m);}).join('')+'</div>';
    [].forEach.call(document.querySelectorAll('.cm-etab'),function(b){ b.onclick=function(){ EFILTER=b.getAttribute('data-f'); render(); }; });
  }

  document.getElementById('h-apply').onclick=function(){ var dv=document.getElementById('h-date').value, tv=document.getElementById('h-time').value; if(!dv||!tv) return; var dp=dv.split('-'),tp=tv.split(':'); var ms=snapH1(zonedWallToUtcMs(+dp[0],+dp[1],+dp[2],+tp[0],+tp[1],tz())); HIST.active=true; HIST.atMs=ms; load(); };
  document.getElementById('h-prev').onclick=function(){ if(!HIST.active){HIST.active=true;HIST.atMs=snapH1(Date.now())-H1;} else HIST.atMs=snapH1(HIST.atMs)-H1; syncInputs(); load(); };
  document.getElementById('h-next').onclick=function(){ if(!HIST.active) return; HIST.atMs=snapH1(HIST.atMs)+H1; syncInputs(); load(); };
  document.getElementById('h-live').onclick=function(){ HIST.active=false; HIST.atMs=null; load(); };
  document.getElementById('h-tz').onchange=function(){ if(HIST.active){syncInputs();} load(); };
  function syncInputs(){ if(HIST.atMs==null) return; var p=partsInTz(HIST.atMs,tz()); document.getElementById('h-date').value=p.year+'-'+p.month+'-'+p.day; document.getElementById('h-time').value=p.hour+':00'; }

  (async function(){
    try{ if(TOKEN){ var r=await fetch('/api/profile',auth()); if(r.ok){ var p=await r.json(); if(p.timezone){ var ts=document.getElementById('h-tz'); if([].slice.call(ts.options).some(function(o){return o.value===p.timezone;})) ts.value=p.timezone; } } } }catch(_){}
    var np=partsInTz(Date.now(),DEFAULT_TZ); document.getElementById('h-date').value=np.year+'-'+np.month+'-'+np.day; document.getElementById('h-time').value=np.hour+':00';
    var at=new URL(window.location.href).searchParams.get('at');
    if(at){ var ms=new Date(at).getTime(); if(!isNaN(ms)){ HIST.active=true; HIST.atMs=snapH1(ms); syncInputs(); } }
    load();
  })();
</script>
</body>
</html>
