<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>NervaFX — Currency Strength Analysis</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css" />

  <style>
    .grid { display: block !important; }

    .sx-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px;
      background: rgba(8,11,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .sx-topbar-left { display: flex; align-items: center; gap: 12px; }
    .sx-logo img { height: 24px; display: block; }
    .sx-sep { color: rgba(255,255,255,0.1); font-size: 20px; font-weight: 200; }
    .sx-title-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .sx-back-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-size: 11px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.15s;
    }
    .sx-back-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }

    .sx-main { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }

    .sx-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; margin-bottom: 18px; overflow: hidden;
    }
    .sx-card-hd {
      padding: 12px 16px; font-size: 12px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .sx-card-hd i { width: 15px; height: 15px; }
    .sx-card-bd { padding: 14px 16px; }

    .sx-ctrls { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: wrap; }
    .sx-btn {
      padding: 4px 12px; border-radius: 7px; font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .sx-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .sx-btn.active { background: rgba(96,165,250,0.15); border-color: rgba(96,165,250,0.5); color: #60a5fa; }
    .sx-date {
      padding: 4px 8px; border-radius: 7px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); cursor: pointer; font-family: inherit; color-scheme: dark;
      min-width: 110px;
    }
    .sx-date.active { background: rgba(96,165,250,0.15); border-color: rgba(96,165,250,0.5); color: #60a5fa; }

    /* ── Tab bar ── */
    .cs-tabs {
      display: flex; gap: 0; margin-bottom: 18px;
      border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .cs-tab {
      flex: 1; padding: 12px 16px; text-align: center;
      font-size: 13px; font-weight: 700; cursor: pointer;
      background: rgba(255,255,255,0.02); color: var(--text-muted);
      border: none; transition: all 0.15s;
    }
    .cs-tab:not(:last-child) { border-right: 1px solid rgba(255,255,255,0.08); }
    .cs-tab:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .cs-tab.active { background: rgba(96,165,250,0.12); color: #60a5fa; }

    /* ── Row styles ── */
    .cs-rows { display: flex; flex-direction: column; gap: 6px; }
    .cs-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      flex-wrap: wrap;
    }
    .cs-row.highlight {
      background: rgba(34,197,94,0.08);
      border-color: rgba(34,197,94,0.2);
    }
    .cs-row-time {
      font-size: 12px; font-weight: 700; color: #e2e8f0;
      min-width: 55px; white-space: nowrap;
    }
    .cs-row-date {
      display: block; font-size: 9px; color: var(--text-dim); font-weight: 400;
    }
    .cs-row-ccys { display: flex; gap: 10px; flex: 1; min-width: 0; }
    .cs-strong { font-size: 12px; font-weight: 700; color: #22c55e; }
    .cs-weak { font-size: 12px; font-weight: 700; color: #ef4444; }
    .cs-val { font-size: 10px; font-weight: 500; opacity: 0.7; }
    .cs-row-bar-wrap {
      flex: 0 0 80px; height: 8px; background: rgba(255,255,255,0.06);
      border-radius: 4px; overflow: hidden;
    }
    .cs-row-bar { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .cs-row-sum { font-size: 14px; font-weight: 800; min-width: 44px; text-align: right; }
    .cs-streak-count { font-size: 10px; font-weight: 500; opacity: 0.6; margin-left: 2px; }

    /* ── Pairs inline ── */
    .cs-pairs-row {
      width: 100%; display: flex; gap: 8px; margin-top: 8px;
      padding-top: 8px; border-top: 1px solid rgba(34,197,94,0.12);
    }
    .cs-pair-card {
      flex: 1; min-width: 80px; padding: 8px 10px; border-radius: 6px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      text-align: left; display: flex; align-items: center; gap: 8px;
    }
    .cs-pair-info { flex: 1; min-width: 0; }
    .cs-pair-name { font-size: 14px; font-weight: 800; color: #e2e8f0; }
    .cs-pair-dir { font-size: 10px; font-weight: 700; margin-top: 2px; }
    .cs-pair-ccys { font-size: 9px; color: var(--text-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Best pairs hero ── */
    .cs-hero {
      padding: 16px 18px; border-radius: 10px; margin-bottom: 16px;
      background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2);
    }
    .cs-hero-title {
      font-size: 11px; font-weight: 700; color: #a5b4fc;
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px;
    }
    .cs-hero-pairs { display: flex; gap: 10px; flex-wrap: wrap; }
    .cs-hero-pair {
      flex: 1; min-width: 120px; padding: 12px 14px; border-radius: 8px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      text-align: left; display: flex; align-items: center; gap: 8px;
    }
    .cs-hero-pair-name { font-size: 18px; font-weight: 800; color: #e2e8f0; }
    .cs-hero-pair-dir { font-size: 12px; font-weight: 700; margin-top: 3px; }
    .cs-hero-pair-ccys { font-size: 10px; color: var(--text-dim); margin-top: 3px; }

    /* ── Clickable rows ── */
    .cs-row { cursor: pointer; transition: background 0.15s; }
    .cs-row:hover { background: rgba(255,255,255,0.04); }

    /* ── Pair detail modal ── */
    .cs-modal-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .cs-modal {
      background: var(--card-bg, #1e293b); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; width: 100%; max-width: 520px; max-height: 85vh;
      overflow-y: auto; padding: 20px;
    }
    .cs-modal-hd {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .cs-modal-title { font-size: 14px; font-weight: 700; color: #e2e8f0; }
    .cs-modal-close {
      background: none; border: none; color: var(--text-dim); font-size: 20px;
      cursor: pointer; padding: 4px 8px; border-radius: 4px;
    }
    .cs-modal-close:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
    .cs-modal-pair {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 8px; margin-bottom: 6px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .cs-modal-pair-rank {
      font-size: 11px; font-weight: 700; color: var(--text-dim);
      min-width: 22px; text-align: center;
    }
    .cs-modal-pair-name { font-size: 14px; font-weight: 800; color: #e2e8f0; flex: 1; }
    .cs-modal-pair-dir { font-size: 11px; font-weight: 700; }
    .cs-modal-pair-spread { font-size: 11px; color: var(--text-dim); min-width: 45px; text-align: right; }

    /* ── Loading ── */
    .cs-loading {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; padding: 60px 20px; color: var(--text-dim); font-size: 13px;
    }

    @media (max-width: 600px) {
      .sx-topbar { padding: 0 12px; height: 48px; }
      .sx-main { padding: 12px 10px 60px; }
      .sx-card-bd { padding: 10px 10px; }
      .cs-row { gap: 6px; padding: 8px 10px; }
      .cs-row-time { font-size: 11px; min-width: 48px; }
      .cs-row-bar-wrap { flex: 0 0 50px; }
      .cs-pair-card { padding: 6px 6px; gap: 4px; position: relative; }
      .cs-pair-name { font-size: 11px; }
      .cs-pair-ccys { font-size: 8px; }
      .cs-hero-pair { min-width: 90px; padding: 8px 6px; gap: 4px; position: relative; }
      .cs-hero-pair-name { font-size: 14px; }
      .cs-prev-badge { font-size: 10.5px !important; padding: 2px 5px !important; position: absolute !important; top: 3px; right: 3px; }
      .cs-tabs { border-radius: 8px; }
      .cs-tab { padding: 10px 8px; font-size: 12px; }
      .cs-modal { padding: 14px 12px; max-height: 90vh; }
      .cs-modal-hd { margin-bottom: 10px; padding-bottom: 8px; }
      .cs-modal-title { font-size: 12px; }
      .cs-modal-pair { gap: 6px; padding: 8px 8px; margin-bottom: 4px; }
      .cs-modal-pair-rank { font-size: 10px; min-width: 18px; }
      .cs-modal-pair-name { font-size: 12px; }
      .cs-modal-pair-dir { font-size: 10px; }
      .cs-modal-pair-spread { font-size: 10px; min-width: 36px; }
      .cs-modal-badge { font-size: 10px !important; padding: 2px 5px !important; }
    }
  </style>
</head>
<body>
  <div class="sx-topbar">
    <div class="sx-topbar-left">
      <a class="sx-logo" href="/app"><img src="/nervafx-icon.png" alt="NervaFX" onerror="this.style.display='none'"></a>
      <span class="sx-sep">|</span>
      <span class="sx-title-text">Currency Strength Analysis</span>
    </div>
    <a class="sx-back-btn" href="/app"><i data-lucide="arrow-left" style="width:13px;height:13px"></i> Dashboard</a>
  </div>

  <div class="sx-main">
    <!-- Tab switcher -->
    <div class="cs-tabs">
      <button class="cs-tab active" data-tab="6h" onclick="switchTab('6h')">6H Strength Sum</button>
      <button class="cs-tab" data-tab="m15" onclick="switchTab('m15')">15M Persistence</button>
    </div>

    <!-- Content area -->
    <div id="cs-content">
      <div class="cs-loading"><span class="spinner"></span> Loading...</div>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    const CS_PAIRS = [
      'EUR_USD','GBP_USD','AUD_USD','NZD_USD','USD_JPY','USD_CHF','USD_CAD',
      'EUR_GBP','EUR_JPY','EUR_CHF','EUR_CAD','EUR_AUD','EUR_NZD',
      'GBP_JPY','GBP_CHF','GBP_CAD','GBP_AUD','GBP_NZD',
      'AUD_JPY','AUD_CHF','AUD_CAD','AUD_NZD',
      'NZD_JPY','NZD_CHF','NZD_CAD',
      'CHF_JPY','CAD_JPY','CAD_CHF',
    ];

    const _tzStored = localStorage.getItem('nfx_tz');
    function _tz() {
      if (_tzStored && _tzStored !== 'auto') return _tzStored;
      return Intl.DateTimeFormat().resolvedOptions().timeZone;
    }

    async function api(path) {
      const token = localStorage.getItem('nfx_token');
      const r = await fetch(path, { headers: { Authorization: `Bearer ${token}` } });
      if (r.status === 401) { location.replace('/login.html'); throw new Error('Unauthorized'); }
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || `${r.status}`);
      return j;
    }

    const pips = v => (v * 10000).toFixed(1);
    const fmtTime = t => new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: _tz() });
    const fmtDay  = t => new Date(t).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', timeZone: _tz() });
    const fmtFull = t => new Date(t).toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', timeZone: _tz() });

    let _tab = '6h';
    let _6hDays = 7;
    let _m15Days = 7;
    let _6hDate = '';
    let _m15Date = '';
    let _6hRowCache = [];
    let _m15RowCache = [];
    const _cache = {};
    const DATA_START = '2025-05-20';
    function allDays() { return Math.min(730, Math.ceil((Date.now() - new Date(DATA_START).getTime()) / 86400000) + 1); }
    const RANGE_OPTS = [7,14,30,90,365,'all'];

    async function fetchCandleDirs(days) {
      const key = `cdirs:${days}`;
      if (_cache[key]) return _cache[key];
      try {
        const data = await api(`/api/candle-dirs?days=${days}`);
        _cache[key] = data.dirs || {};
      } catch (_) { _cache[key] = {}; }
      return _cache[key];
    }

    function buildPairs(top3, bot3) {
      const candidates = [];
      for (const s of top3) {
        for (const w of bot3) {
          if (s.cur === w.cur) continue;
          const pn = `${s.cur}_${w.cur}`, rn = `${w.cur}_${s.cur}`;
          if (CS_PAIRS.includes(pn)) candidates.push({ pair: pn, dir: 'BUY', strong: s.cur, weak: w.cur, spread: Math.abs(s.val) + Math.abs(w.val) });
          else if (CS_PAIRS.includes(rn)) candidates.push({ pair: rn, dir: 'SELL', strong: s.cur, weak: w.cur, spread: Math.abs(s.val) + Math.abs(w.val) });
        }
      }
      candidates.sort((a, b) => b.spread - a.spread);
      return candidates.slice(0, 6);
    }

    function countPrevCandles(pair, dir, hourKey, candleDirs) {
      const pairDirs = candleDirs[pair];
      if (!pairDirs) return null;
      const dt = new Date(hourKey + ':00:00Z');
      let matching = 0, checked = 0;
      for (let i = 1; i <= 5; i++) {
        const prev = new Date(dt.getTime() - i * 3600000);
        const pk = prev.toISOString().slice(0, 13);
        const d = pairDirs[pk];
        if (d == null) continue;
        checked++;
        if ((dir === 'BUY' && d === 1) || (dir === 'SELL' && d === -1)) matching++;
      }
      return checked > 0 ? matching : null;
    }

    async function fetchM15CandleDirs(days) {
      const key = `cdirs_m15:${days}`;
      if (_cache[key]) return _cache[key];
      try {
        const data = await api(`/api/candle-dirs?days=${days}&tf=M15`);
        _cache[key] = data.dirs || {};
      } catch (_) { _cache[key] = {}; }
      return _cache[key];
    }

    function countPrevM15Candles(pair, dir, timeKey, candleDirs) {
      const pairDirs = candleDirs[pair];
      if (!pairDirs) return null;
      const dt = new Date(timeKey);
      let matching = 0, checked = 0;
      for (let i = 1; i <= 5; i++) {
        const prev = new Date(dt.getTime() - i * 15 * 60000);
        const pk = prev.toISOString().slice(0, 16);
        const d = pairDirs[pk];
        if (d == null) continue;
        checked++;
        if ((dir === 'BUY' && d === 1) || (dir === 'SELL' && d === -1)) matching++;
      }
      return checked > 0 ? matching : null;
    }

    function buildAllPairs(sorted) {
      const top3 = sorted.slice(0, 3).map(c => c.cur);
      const bot3 = sorted.slice(-3).map(c => c.cur);
      const valMap = Object.fromEntries(sorted.map(c => [c.cur, c.val]));
      const pairs = [];
      for (const strong of top3) {
        for (const weak of bot3) {
          const pair = CS_PAIRS.find(p => {
            const [b, q] = p.split('_');
            return (b === strong && q === weak) || (b === weak && q === strong);
          });
          if (!pair) continue;
          const [base] = pair.split('_');
          const dir = base === strong ? 'BUY' : 'SELL';
          const spread = Math.abs((valMap[strong] || 0) - (valMap[weak] || 0));
          pairs.push({ pair, dir, strong, weak, spread });
        }
      }
      return pairs;
    }

    // type: '6h' or 'm15'
    async function showPairDetail(sorted, time, type) {
      const allPairs = buildAllPairs(sorted);
      const isM15 = type === 'm15';
      const dirs = isM15
        ? await fetchM15CandleDirs(_m15Days)
        : await fetchCandleDirs(_6hDays);

      for (const p of allPairs) {
        p.prevCount = isM15
          ? countPrevM15Candles(p.pair, p.dir, time, dirs)
          : countPrevCandles(p.pair, p.dir, time.slice(0, 13), dirs);
      }
      allPairs.sort((a, b) => (b.prevCount ?? -1) - (a.prevCount ?? -1) || b.spread - a.spread);

      const label = isM15 ? fmtTime(time) : fmtTime(time);
      const dateLabel = fmtFull(time);
      let html = `<div class="cs-modal-hd">
        <div class="cs-modal-title">${dateLabel} · ${label} — All Pairs</div>
        <button class="cs-modal-close" onclick="this.closest('.cs-modal-overlay').remove()">✕</button>
      </div>`;

      allPairs.forEach((p, i) => {
        const dc = p.dir === 'BUY' ? '#22c55e' : '#ef4444';
        const bc = p.prevCount >= 4 ? 'rgba(34,197,94,0.18);color:#22c55e;border:1px solid rgba(34,197,94,0.3)'
                 : p.prevCount >= 3 ? 'rgba(245,158,11,0.18);color:#f59e0b;border:1px solid rgba(245,158,11,0.3)'
                 : 'rgba(100,116,139,0.18);color:#94a3b8;border:1px solid rgba(100,116,139,0.2)';
        const badge = p.prevCount != null
          ? `<span class="cs-modal-badge" style="font-size:12px;font-weight:800;padding:2px 7px;border-radius:4px;line-height:1.2;white-space:nowrap;background:${bc}">${p.prevCount}/5</span>`
          : '';
        html += `<div class="cs-modal-pair">
          <div class="cs-modal-pair-rank">${i + 1}</div>
          <div class="cs-modal-pair-name">${p.pair.replace('_','/')}</div>
          <div class="cs-modal-pair-dir" style="color:${dc}">${p.dir}</div>
          <div class="cs-modal-pair-spread">${pips(p.spread)}p</div>
          ${badge}
        </div>`;
      });

      const overlay = document.createElement('div');
      overlay.className = 'cs-modal-overlay';
      overlay.innerHTML = `<div class="cs-modal">${html}</div>`;
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
    }

    function pairCardHTML(p, size) {
      const dc = p.dir === 'BUY' ? '#22c55e' : '#ef4444';
      const cls = size === 'hero' ? 'cs-hero-pair' : 'cs-pair-card';
      const nCls = size === 'hero' ? 'cs-hero-pair-name' : 'cs-pair-name';
      const dCls = size === 'hero' ? 'cs-hero-pair-dir' : 'cs-pair-dir';
      const cCls = size === 'hero' ? 'cs-hero-pair-ccys' : 'cs-pair-ccys';
      const prevBadge = p.prevCount != null
        ? `<span class="cs-prev-badge" style="font-size:12px;font-weight:800;padding:2px 7px;border-radius:4px;line-height:1.2;white-space:nowrap;background:${p.prevCount >= 4 ? 'rgba(34,197,94,0.18);color:#22c55e;border:1px solid rgba(34,197,94,0.3)' : p.prevCount >= 3 ? 'rgba(245,158,11,0.18);color:#f59e0b;border:1px solid rgba(245,158,11,0.3)' : 'rgba(100,116,139,0.18);color:#94a3b8;border:1px solid rgba(100,116,139,0.2)'}">${p.prevCount}/5</span>`
        : '';
      return `<div class="${cls}">
        <div class="cs-pair-info">
          <div class="${nCls}">${p.pair.replace('_','/')}</div>
          <div class="${dCls}" style="color:${dc}">${p.dir}</div>
          <div class="${cCls}"><span style="color:#22c55e">${p.strong}↑</span> vs <span style="color:#ef4444">${p.weak}↓</span>${p.spread ? `<span style="margin-left:4px;color:var(--text-dim)">${pips(p.spread)}p</span>` : ''}</div>
        </div>
        ${prevBadge}
      </div>`;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // 6H TAB
    // ═══════════════════════════════════════════════════════════════════════════
    async function render6H() {
      _6hRowCache = [];
      const el = document.getElementById('cs-content');
      el.innerHTML = `<div class="sx-card"><div class="sx-card-hd"><i data-lucide="bar-chart-3"></i> 6H Strength Sum
        <div class="sx-ctrls">
          ${RANGE_OPTS.map(d => { const v = d === 'all' ? allDays() : d; const lbl = d === 'all' ? 'All' : d === 365 ? '1Y' : d+'D'; return `<button class="sx-btn ${_6hDays===v&&!_6hDate?'active':''}" onclick="set6HDays(${v})">${lbl}</button>`; }).join('')}
          <span class="sx-ctrl-sep"></span>
          <input type="date" class="sx-date${_6hDate?' active':''}" value="${_6hDate}" min="${DATA_START}" max="${new Date().toISOString().slice(0,10)}" onchange="set6HDate(this.value)">
        </div>
      </div><div class="sx-card-bd" id="cs-6h-body"><div class="cs-loading"><span class="spinner"></span> Loading 6H data...</div></div></div>`;
      lucide.createIcons();

      const key = `6h:${_6hDays}`;
      if (!_cache[key]) {
        const data = await api(`/api/strength-history?days=${_6hDays}&multi=1`);
        _cache[key] = data.rows || [];
      }
      const rows = _cache[key];
      const body = document.getElementById('cs-6h-body');
      if (!rows.length) { body.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:40px">No strength data</p>'; return; }

      const byHour = {};
      for (const r of rows) {
        const hk = r.time.slice(0, 13);
        (byHour[hk] = byHour[hk] || []).push(r);
      }

      const hourKeys = Object.keys(byHour).sort();
      const hourResults = [];
      for (const hk of hourKeys) {
        const currencies = byHour[hk];
        const sorted = currencies
          .map(c => ({ cur: c.currency, val: parseFloat(c.smooth_6h) || 0 }))
          .sort((a, b) => b.val - a.val);
        if (sorted.length < 2) continue;
        const strongest = sorted[0];
        const weakest = sorted[sorted.length - 1];
        const sum = Math.abs(strongest.val) + Math.abs(weakest.val);
        const time = hk + ':00:00Z';
        let pairs = null;
        if (sum >= 0.003) {
          pairs = buildPairs(sorted.slice(0, 3), sorted.slice(-3).reverse());
        }
        hourResults.push({ time, strongest, weakest, sum, sorted, pairs });
      }

      const candleDirs = await fetchCandleDirs(_6hDays);
      for (const h of hourResults) {
        const hk = h.time.slice(0, 13);
        if (h.pairs) {
          for (const p of h.pairs) {
            p.prevCount = countPrevCandles(p.pair, p.dir, hk, candleDirs);
          }
          h.pairs.sort((a, b) => (b.prevCount ?? -1) - (a.prevCount ?? -1) || b.spread - a.spread);
          h.pairs = h.pairs.slice(0, 3);
        }
      }

      let all = hourResults.reverse();
      if (_6hDate) {
        all = all.filter(h => {
          const ld = new Date(h.time).toLocaleDateString('en-CA', { timeZone: _tz() });
          return ld === _6hDate;
        });
      }
      const CS_THRESHOLD = 0.003;

      // Group by local date
      const byDate = {};
      for (const h of all) {
        const d = fmtFull(h.time);
        (byDate[d] = byDate[d] || []).push(h);
      }

      let html = `<div style="font-size:11px;color:var(--text-dim);margin-bottom:14px">
        Strongest + Weakest currency by 6H strength each hour. Both values converted to positive and summed.
        Rows at <span style="color:#22c55e;font-weight:700">≥30 pips</span> show the best 3 tradeable pairs.
      </div>`;

      for (const [dateLabel, hours] of Object.entries(byDate)) {
        const thresholdCount = hours.filter(h => h.sum >= CS_THRESHOLD).length;
        html += `<div style="margin-bottom:16px">`;
        html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06)">
          <span style="font-size:12px;font-weight:700;color:#e2e8f0">${dateLabel}</span>
          ${thresholdCount ? `<span style="font-size:10px;font-weight:600;color:#22c55e;background:rgba(34,197,94,0.1);padding:2px 8px;border-radius:4px">${thresholdCount} hour${thresholdCount>1?'s':''} ≥30</span>` : ''}
        </div>`;
        html += '<div class="cs-rows">';

        for (const h of hours) {
          const t = fmtTime(h.time);
          const barWidth = Math.min(100, (h.sum / 0.006) * 100);
          const meetsThreshold = h.sum >= CS_THRESHOLD;
          const sumColor = meetsThreshold ? '#22c55e' : h.sum >= 0.0015 ? '#f59e0b' : '#64748b';

          html += `<div class="cs-row${meetsThreshold ? ' highlight' : ''}" data-6h-idx="${_6hRowCache.length}">
            <div class="cs-row-time">${t}</div>
            <div class="cs-row-ccys">
              <span class="cs-strong">${h.strongest.cur} <span class="cs-val">+${pips(Math.abs(h.strongest.val))}</span></span>
              <span class="cs-weak">${h.weakest.cur} <span class="cs-val">-${pips(Math.abs(h.weakest.val))}</span></span>
            </div>
            <div class="cs-row-bar-wrap">
              <div class="cs-row-bar" style="width:${barWidth}%;background:${sumColor}"></div>
            </div>
            <div class="cs-row-sum" style="color:${sumColor}">${pips(h.sum)}${meetsThreshold ? '<span style="font-size:8px;display:block;color:#22c55e">≥30</span>' : ''}</div>`;

          if (meetsThreshold && h.pairs?.length) {
            html += `<div class="cs-pairs-row">${h.pairs.map(p => pairCardHTML(p, 'row')).join('')}</div>`;
          }
          html += `</div>`;
          _6hRowCache.push(h);
        }
        html += '</div></div>';
      }

      body.innerHTML = html;
      body.querySelectorAll('.cs-row[data-6h-idx]').forEach(el => {
        el.addEventListener('click', () => {
          const h = _6hRowCache[parseInt(el.dataset['6hIdx'])];
          if (h) showPairDetail(h.sorted, h.time, '6h');
        });
      });
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // 15M TAB
    // ═══════════════════════════════════════════════════════════════════════════
    async function render15M() {
      _m15RowCache = [];
      const el = document.getElementById('cs-content');
      el.innerHTML = `<div class="sx-card"><div class="sx-card-hd"><i data-lucide="timer"></i> 15M Persistence Streaks
        <div class="sx-ctrls">
          ${RANGE_OPTS.map(d => { const v = d === 'all' ? allDays() : d; const lbl = d === 'all' ? 'All' : d === 365 ? '1Y' : d+'D'; return `<button class="sx-btn ${_m15Days===v&&!_m15Date?'active':''}" onclick="setM15Days(${v})">${lbl}</button>`; }).join('')}
          <span class="sx-ctrl-sep"></span>
          <input type="date" class="sx-date${_m15Date?' active':''}" value="${_m15Date}" min="${DATA_START}" max="${new Date().toISOString().slice(0,10)}" onchange="setM15Date(this.value)">
        </div>
      </div><div class="sx-card-bd" id="cs-m15-body"><div class="cs-loading"><span class="spinner"></span> Loading M15 data...</div></div></div>`;
      lucide.createIcons();

      const key = `m15:${_m15Days}`;
      if (!_cache[key]) {
        const data = await api(`/api/m15-strength-history?days=${_m15Days}`);
        _cache[key] = data.rows || [];
      }
      const rows = _cache[key];
      const body = document.getElementById('cs-m15-body');
      if (!rows.length) { body.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:40px">No M15 data</p>'; return; }

      rows.sort((a, b) => a.time.localeCompare(b.time));

      const slots = rows.map(r => {
        const vals = Object.entries(r.values || {}).map(([cur, v]) => ({ cur, val: parseFloat(v) || 0 }));
        vals.sort((a, b) => b.val - a.val);
        return { time: r.time, strongest: vals[0]?.cur, weakest: vals[vals.length - 1]?.cur, vals };
      });

      // Build merged rows — every M15 interval with strongest + weakest
      const mergedMap = {};
      for (const s of slots) {
        mergedMap[s.time] = {
          time: s.time, vals: s.vals,
          strongCcy: s.strongest, weakCcy: s.weakest,
        };
      }

      // Build pairs + compute sum per merged row
      const M15_THRESHOLD = 0.0015;
      const merged = Object.values(mergedMap);
      for (const m of merged) {
        const sVal = Math.abs((m.vals.find(v => v.cur === (m.strongCcy || m.vals[0]?.cur)) || {}).val || 0);
        const wVal = Math.abs((m.vals.find(v => v.cur === (m.weakCcy || m.vals[m.vals.length - 1]?.cur)) || {}).val || 0);
        m.sum = sVal + wVal;
        m.meetsThreshold = m.sum >= M15_THRESHOLD;

        if (m.meetsThreshold) {
          const top3 = m.vals.slice(0, 3);
          const bot3 = m.vals.slice(-3).reverse();
          m.pairs = buildPairs(top3, bot3);
        }
      }

      // Fetch M15 candle dirs and compute prev candle counts
      const m15CandleDirs = await fetchM15CandleDirs(_m15Days);
      for (const m of merged) {
        if (m.pairs) {
          for (const p of m.pairs) {
            p.prevCount = countPrevM15Candles(p.pair, p.dir, m.time, m15CandleDirs);
          }
          m.pairs.sort((a, b) => (b.prevCount ?? -1) - (a.prevCount ?? -1) || b.spread - a.spread);
          m.pairs = m.pairs.slice(0, 3);
        }
      }

      // Sort newest first
      merged.sort((a, b) => b.time.localeCompare(a.time));
      if (_m15Date) {
        const filtered = merged.filter(m => {
          const ld = new Date(m.time).toLocaleDateString('en-CA', { timeZone: _tz() });
          return ld === _m15Date;
        });
        merged.length = 0;
        merged.push(...filtered);
      }

      let html = '';

      html += `<div style="font-size:11px;color:var(--text-dim);margin-bottom:14px">
        Strongest + Weakest currency by M15 strength each interval. Both values converted to positive and summed.
        Rows at <span style="color:#22c55e;font-weight:700">≥15 pips</span> show the best 3 tradeable pairs.
      </div>`;

      // Group by local date
      const byDate = {};
      for (const m of merged) {
        const d = fmtFull(m.time);
        (byDate[d] = byDate[d] || []).push(m);
      }

      for (const [dateLabel, items] of Object.entries(byDate)) {
        const thresholdCount = items.filter(m => m.meetsThreshold).length;
        const maxCount = Math.max(...items.map(m => Math.max(m.strongCount || 0, m.weakCount || 0)));
        html += `<div style="margin-bottom:16px">`;
        html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06)">
          <span style="font-size:12px;font-weight:700;color:#e2e8f0">${dateLabel}</span>
          <span style="font-size:10px;font-weight:600;color:var(--text-dim)">${items.length} intervals</span>
          ${thresholdCount ? `<span style="font-size:10px;font-weight:600;color:#22c55e;background:rgba(34,197,94,0.1);padding:2px 8px;border-radius:4px">${thresholdCount} interval${thresholdCount>1?'s':''} ≥15</span>` : ''}
        </div>`;
        html += '<div class="cs-rows">';

        for (const m of items) {
          const t = fmtTime(m.time);
          const barWidth = Math.min(100, (m.sum / 0.003) * 100);
          const sumColor = m.meetsThreshold ? '#22c55e' : m.sum >= 0.0008 ? '#f59e0b' : '#64748b';

          html += `<div class="cs-row${m.meetsThreshold ? ' highlight' : ''}" data-m15-idx="${_m15RowCache.length}">
            <div class="cs-row-time">${t}</div>
            <div class="cs-row-ccys">
              <span class="cs-strong">${m.strongCcy} <span class="cs-val">+${pips(Math.abs((m.vals.find(v=>v.cur===m.strongCcy)||{}).val||0))}</span></span>
              <span class="cs-weak">${m.weakCcy} <span class="cs-val">-${pips(Math.abs((m.vals.find(v=>v.cur===m.weakCcy)||{}).val||0))}</span></span>
            </div>
            <div class="cs-row-bar-wrap">
              <div class="cs-row-bar" style="width:${barWidth}%;background:${sumColor}"></div>
            </div>
            <div class="cs-row-sum" style="color:${sumColor}">${pips(m.sum)}${m.meetsThreshold ? '<span style="font-size:8px;display:block;color:#22c55e">≥15</span>' : ''}</div>`;

          if (m.meetsThreshold && m.pairs?.length) {
            html += `<div class="cs-pairs-row">${m.pairs.map(p => pairCardHTML(p, 'row')).join('')}</div>`;
          }
          html += `</div>`;
          _m15RowCache.push(m);
        }
        html += '</div></div>';
      }

      if (!merged.length) {
        html += '<p style="color:var(--text-dim);text-align:center;padding:40px">No M15 strength data</p>';
      }

      body.innerHTML = html;
      body.querySelectorAll('.cs-row[data-m15-idx]').forEach(el => {
        el.addEventListener('click', () => {
          const m = _m15RowCache[parseInt(el.dataset.m15Idx)];
          if (m) showPairDetail(m.vals, m.time, 'm15');
        });
      });
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // Tab switching + range controls
    // ═══════════════════════════════════════════════════════════════════════════
    window.switchTab = function(tab) {
      _tab = tab;
      document.querySelectorAll('.cs-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      if (tab === '6h') render6H(); else render15M();
    };

    window.set6HDays = function(d) {
      _6hDays = d; _6hDate = '';
      render6H();
    };
    window.set6HDate = function(v) {
      _6hDate = v;
      if (v) {
        const diff = Math.ceil((Date.now() - new Date(v).getTime()) / 86400000) + 1;
        _6hDays = Math.max(diff, _6hDays);
      }
      render6H();
    };

    window.setM15Days = function(d) {
      _m15Days = d; _m15Date = '';
      render15M();
    };
    window.setM15Date = function(v) {
      _m15Date = v;
      if (v) {
        const diff = Math.ceil((Date.now() - new Date(v).getTime()) / 86400000) + 1;
        _m15Days = Math.max(diff, _m15Days);
      }
      render15M();
    };

    // Init
    const params = new URLSearchParams(location.search);
    _tab = params.get('tab') || '6h';
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      document.querySelectorAll('.cs-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === _tab));
      if (_tab === '6h') render6H(); else render15M();
    });
  })();
  </script>
</body>
</html>
