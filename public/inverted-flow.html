<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NervaFX — Inverted Flow Chart (research)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/nervafx-icon.png">
<link rel="stylesheet" href="/shared/styles.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  /* ---- Dark theme (base tokens come from /shared/styles.css) + dark chart palette ---- */
  :root{
    /* chart palette: deep paper, muted bodies with bright borders, light trace */
    --flow-bg:#0d1526; --flow-up:#16573d; --flow-up-bd:#19c984; --flow-dn:#6b2730; --flow-dn-bd:#f6465d;
    --flow-trace:#e8eefc; --flow-grid:#1b2740; --flow-axis:#5f6f8c; --flow-signal:#ff6b7d; --flow-peak:#9db7e4;
  }
  body{font-family:Inter,system-ui,-apple-system,sans-serif}
  .wrap{max-width:1320px;margin:0 auto;padding:16px}
  header.app{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 12px;border-bottom:1px solid var(--border);margin-bottom:12px}
  header.app .logo{font-weight:800;font-size:18px;color:var(--text);letter-spacing:-.01em}
  .spacer{flex:1}.mut{color:var(--text-muted)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 8px}
  .seg{display:inline-flex;gap:3px;background:var(--bg-card);border:1px solid var(--border);border-radius:9px;padding:3px}
  .seg button{font-size:12px;font-weight:700;color:var(--text-muted);border:0;background:transparent;border-radius:7px;padding:6px 12px;cursor:pointer}
  .seg button.on{color:var(--text);background:rgba(59,130,246,.22)}
  .ctl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
  .ctl select,.ctl input{font-size:12px;background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 8px}
  .ctl input[type=number]{width:92px}
  .ctl input[type=search]{width:120px}
  .btn.tiny{font-size:11px;padding:5px 9px}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text);cursor:pointer;user-select:none}
  .charthdr{display:flex;flex-direction:column;gap:3px;margin:10px 0 2px}
  .chrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .chTitle{font-weight:800;font-size:24px;letter-spacing:-.02em;color:var(--text);line-height:1.1}
  .chSub{font-size:13px;color:var(--text-muted)}
  .chSub b{color:var(--text);font-weight:700}
  .coverage{font-size:11.5px;color:var(--text-muted);margin:3px 0 8px}
  .coverage .warn{color:var(--yellow)}
  .chartwrap{position:relative;width:100%;height:78vh;min-height:560px;max-height:1000px;background:var(--flow-bg);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .chartscroll{overflow-x:auto;overflow-y:hidden;width:100%}
  #flowchartbox{width:100%;height:100%}
  svg.flow{display:block;background:var(--flow-bg)}
  .lwlegend{position:absolute;left:12px;top:10px;z-index:4;font-size:12px;color:var(--text-muted);background:rgba(10,14,23,.66);border:1px solid var(--border);border-radius:8px;padding:6px 10px;line-height:1.5;pointer-events:none;max-width:72%}
  .lwlegend b{color:var(--text)}.lwlegend .up{color:var(--up)}.lwlegend .dn{color:var(--dn)}
  @media(max-width:620px){.chTitle{font-size:20px}.chartwrap{height:64vh;min-height:380px}}
  .flowcap{font-size:12px;color:var(--text-muted);margin:8px 2px 0;font-style:italic}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);margin:10px 2px 2px}
  .legend .k{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:16px;height:11px;border-radius:2px;display:inline-block}
  .sw.up{background:var(--flow-up);border:1px solid var(--flow-up-bd)}.sw.dn{background:var(--flow-dn);border:1px solid var(--flow-dn-bd)}
  .sw.form{background:repeating-linear-gradient(90deg,var(--flow-axis) 0 4px,transparent 4px 8px);border:1px dashed var(--flow-axis)}
  .sw.line{width:18px;height:2.5px;border-radius:0;background:var(--flow-trace)}
  .replaybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 2px;font-size:12px;color:var(--text-muted)}
  .replaybar .pos{font-variant-numeric:tabular-nums}
  .flowtip{position:absolute;pointer-events:none;z-index:6;background:#0b1220;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:11.5px;color:var(--text);box-shadow:0 10px 28px rgba(0,0,0,.55);max-width:300px;line-height:1.55;display:none}
  .flowtip b{color:var(--text)}
  .flowtip .muted{color:var(--text-muted)}
  .flowtip .up{color:var(--up)}.flowtip .dn{color:var(--dn)}
  .cmpgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:1040px){.cmpgrid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.cmpgrid{grid-template-columns:1fr}}
  .cmpcard svg{height:96px}
  .cmpHead{margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--border)}
  .cmpHead .cmpTitle{font-size:18px;font-weight:800;margin:0 0 4px;color:var(--text)}
  .cmpHead .cmpMeta{font-size:11.5px;color:var(--text-muted);line-height:1.5}
  /* pairs ranked by currency strength (strong vs weak), from the Renko index */
  .pairrank{margin:16px 0 2px}
  .pairrank h3{font-size:14px;font-weight:800;margin:0 0 8px;color:var(--text);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pairrank h3 .flt{font-size:11.5px;font-weight:600;color:var(--text-muted);display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .pairrank h3 .flt input{accent-color:var(--accent);cursor:pointer}
  .ptbl td.noalign{text-align:center;color:var(--text-muted);font-style:italic;padding:14px 8px;cursor:default}
  .pairrank .sub{font-size:11.5px;color:var(--text-muted);margin:-4px 0 8px}
  .pairrank .sub .hid{color:var(--yellow);font-weight:700}
  .ptbl{width:100%;border-collapse:collapse;font-size:12px}
  .ptbl th,.ptbl td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
  .ptbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:700}
  .ptbl td.num{text-align:right;font-variant-numeric:tabular-nums}
  .ptbl tr{cursor:pointer}.ptbl tbody tr:hover{background:rgba(59,130,246,.08)}
  .ptbl .pair{font-weight:700;color:var(--text)}
  .ptbl .s{color:var(--up);font-weight:700}.ptbl .w{color:var(--dn);font-weight:700}
  .ptbl .lean.up{color:var(--up)}.ptbl .lean.dn{color:var(--dn)}
  .ptbl td.al{font-weight:700}.ptbl td.al.ok{color:var(--up)}.ptbl td.al.no{color:var(--yellow)}.ptbl td.al.mix{color:var(--text-muted)}.ptbl td.al.none{color:var(--text-muted);font-weight:400}
  .sub b.al.ok{color:var(--up)}
  .ptbl .bar{display:inline-block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--up),rgba(59,130,246,.7));vertical-align:middle}
  .cmpcard{background:var(--flow-bg);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer}
  .cmpcard:hover{border-color:var(--accent)}
  .cmpcard .top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-bottom:6px}
  .cmpcard.stale{opacity:.5}
  .cmpcard.stale:hover{opacity:.85}
  .cmpcard .xflag{flex-basis:100%;font-size:10px;font-weight:700;color:var(--yellow)}
  .bos{display:inline-flex;align-items:center;gap:2px;font-size:9.5px;font-weight:800;letter-spacing:.02em;padding:1px 6px;border-radius:5px;border:1px solid;white-space:nowrap;vertical-align:middle}
  .bos.up{color:var(--up);border-color:rgba(22,199,132,.5);background:rgba(22,199,132,.1)}
  .bos.dn{color:var(--dn);border-color:rgba(246,70,93,.5);background:rgba(246,70,93,.1)}
  .ptbl .pair .bos{margin-left:6px}
  .cmpcard .ccy{font-size:16px;font-weight:800}
  .cmpcard .rk{font-size:11px;color:var(--text-muted)}
  .cmpcard .pp{margin-left:auto;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
  .cmpcard .pp.up{color:var(--up)}.cmpcard .pp.dn{color:var(--dn)}
  .cmpcard svg{width:100%;height:120px;display:block}
  .cmpcard .dir{font-size:10.5px;padding:1px 7px;border-radius:5px;border:1px solid var(--border);color:var(--text-muted)}
  .cmpcard .dir.up{color:var(--up);border-color:rgba(22,199,132,.45)}
  .cmpcard .dir.dn{color:var(--dn);border-color:rgba(246,70,93,.45)}
  .foot{font-size:11.5px;color:var(--text-muted);line-height:1.7;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
  .foot b{color:var(--text)}
  .banner{font-size:12px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:6px 0;color:var(--text-muted);background:var(--bg-card)}
  .banner.warn{border-color:#6b5e1a;color:var(--yellow)}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <img src="/nervafx-logo.png" alt="NervaFX" style="height:26px;display:block" onerror="this.style.display='none'">
    <span class="logo">Inverted Flow</span>
    <span class="pill" id="ver">—</span>
    <span class="pill warn">RESEARCH · UNVALIDATED</span>
    <span class="spacer"></span>
    <span class="mut" style="font-size:11px">Replay (EAT):</span>
    <input type="datetime-local" id="histDt" class="btn" step="900">
    <button class="btn sm" id="histGo">Go</button>
    <button class="btn sm" id="histLive">● Live</button>
  </header>

  <div class="toolbar">
    <span class="seg" id="kindSeg">
      <button data-kind="pair">Pairs</button>
      <button data-kind="index">Currency Indices</button>
    </span>
    <span class="ctl"><span>Instrument</span>
      <select id="instSel"></select>
      <input type="search" id="instSearch" placeholder="search…" autocomplete="off">
    </span>
    <span class="ctl" id="resCtl"><span>Resolution</span>
      <span class="seg" id="resSeg">
        <button data-res="M5">M5</button><button data-res="M15">M15</button><button data-res="H1">H1</button>
      </span>
    </span>
    <span class="ctl"><span id="stepLbl">Step</span>
      <input type="number" id="stepIn" step="0.00001" min="0"><span id="stepUnit" class="mut"></span>
    </span>
    <span class="seg" id="viewSeg">
      <button data-view="single">Single</button>
      <button data-view="compare">8-Index Compare</button>
    </span>
    <label class="chk"><input type="checkbox" id="revChk"> Reversal markers</label>
    <span class="seg">
      <button id="zoomOut" title="zoom out">−</button>
      <button id="zoomReset" title="reset view">reset</button>
      <button id="zoomIn" title="zoom in">+</button>
    </span>
  </div>

  <div id="banners" aria-live="polite"></div>

  <div class="charthdr" id="charthdr"></div>
  <div class="coverage" id="coverage"></div>

  <main id="host"><div class="banner">Loading Inverted Flow…</div></main>

  <div class="legend" id="legend"></div>

  <div class="replaybar" id="replaybar" style="display:none">
    <button class="btn tiny" id="rpPlay">▶ Play</button>
    <button class="btn tiny" id="rpStepObs" title="step one observation">▸ obs</button>
    <button class="btn tiny" id="rpStepEvt" title="step one confirmed event">▸▸ event</button>
    <button class="btn tiny" id="rpLive" title="jump to latest">⤒ latest</button>
    <span class="ctl">Speed <select id="rpSpeed"><option value="1">1×</option><option value="2">2×</option><option value="4" selected>4×</option><option value="8">8×</option><option value="16">16×</option></select></span>
    <span class="pos" id="rpPos"></span>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="/inverted-flow/flow.js"></script>
</body></html>
