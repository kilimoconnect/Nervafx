<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H1 EMA Strength — History</title>
  <style>
    :root {
      --bg: #0b0d10;
      --card: #12151a;
      --card2: #171a20;
      --border: #1e2128;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 20px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
      font-weight: 600;
      color: var(--text);
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .controls label { color: var(--muted); font-size: 12px; }
    .controls input, .controls button {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
    }
    .controls button {
      background: var(--accent);
      color: #0b0d10;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .controls button:hover { filter: brightness(1.1); }
    .status { color: var(--muted); font-size: 12px; }
    .status.error { color: #f87171; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .legend {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
    .legend .swatch {
      display: inline-block;
      width: 22px; height: 12px;
      border-radius: 3px;
      vertical-align: middle;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 12px;
    }
    th, td {
      padding: 6px 8px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: var(--card);
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.5px;
      z-index: 1;
    }
    td.time {
      text-align: left;
      color: var(--muted);
    }
    td.cell {
      color: #0b0d10;
      font-weight: 600;
      border-left: 1px solid var(--bg);
    }
    tbody tr:hover { background: rgba(96,165,250,0.04); }

    .tbl-scroll { max-height: 78vh; overflow: auto; }

    /* Setups column — top-2 vs bottom-2 pair suggestions per hour. */
    td.setups { text-align: left; padding: 4px 8px; max-width: 320px; }
    .setup-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--card2); border: 1px solid var(--border); border-radius: 6px;
      padding: 2px 6px; margin: 2px 3px 2px 0;
      font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 11px;
      color: var(--text); white-space: nowrap;
    }
    .setup-pill .d {
      font-weight: 700; font-size: 10px; padding: 1px 4px; border-radius: 3px;
    }
    .setup-pill .d.BUY  { background: rgba(22,163,74,0.20);  color: #4ade80; }
    .setup-pill .d.SELL { background: rgba(220,38,38,0.20);  color: #f87171; }
    .setup-pill .sp { color: var(--muted); font-size: 10px; }
    .setup-pill.repeat { box-shadow: inset 3px 0 0 #fbbf24; border-color: rgba(251,191,36,0.35); }
    .repeat-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fbbf24; margin-left: 3px; }
  </style>
</head>
<body>
  <h1>H1 EMA Strength — Hourly History</h1>
  <div class="sub">Per-currency alignment from H1 close vs EMA20/EMA50 on all 28 pairs. Range [-1, +1].</div>

  <div class="controls">
    <label>From <input type="date" id="from"></label>
    <label>To <input type="date" id="to"></label>
    <button id="load">Load</button>
    <span class="status" id="status"></span>
  </div>

  <div class="card">
    <div class="legend">
      <span class="swatch" style="background:#7f1d1d"></span>
      <span>-1</span>
      <span class="swatch" style="background:#374151"></span>
      <span>0</span>
      <span class="swatch" style="background:#166534"></span>
      <span>+1</span>
      <span style="margin-left:auto">Newest first · Weekends skipped</span>
    </div>
  </div>

  <div class="card">
    <div class="tbl-scroll">
      <table id="tbl">
        <thead>
          <tr>
            <th style="text-align:left">Time</th>
            <th>USD</th><th>EUR</th><th>GBP</th><th>JPY</th>
            <th>CHF</th><th>CAD</th><th>AUD</th><th>NZD</th>
            <th style="text-align:left">Setups (top-3 vs bottom-3) · ⚡ = impulse</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="10" style="text-align:center;color:var(--muted);padding:20px">Choose a range and click Load.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Green ↑ / Red ↓ colour ramp, given v in [-1, +1].
    function cellColor(v) {
      if (v > 0) {
        // green from #052e14 (v→0) to #16a34a (v→1)
        var t = Math.min(v, 1);
        var r = Math.round(5   + (22  - 5)   * t);
        var g = Math.round(46  + (163 - 46)  * t);
        var b = Math.round(20  + (74  - 20)  * t);
        return 'rgb(' + r + ',' + g + ',' + b + ')';
      }
      if (v < 0) {
        var t2 = Math.min(-v, 1);
        var r2 = Math.round(46  + (220 - 46)  * t2);
        var g2 = Math.round(15  + (38  - 15)  * t2);
        var b2 = Math.round(15  + (38  - 15)  * t2);
        return 'rgb(' + r2 + ',' + g2 + ',' + b2 + ')';
      }
      return '#1f2937';
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    var _userTz = localStorage.getItem('nfx_tz') || 'auto';
    function _tz() {
      return (_userTz === 'auto') ? Intl.DateTimeFormat().resolvedOptions().timeZone : (_userTz || 'UTC');
    }
    function fmtTime(iso) {
      try {
        return new Intl.DateTimeFormat('en-GB', {
          timeZone: _tz(),
          day: '2-digit', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit', hour12: false,
          timeZoneName: 'short',
        }).format(new Date(iso));
      } catch (_) {
        var d = new Date(iso);
        return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate())
          + ' ' + pad(d.getUTCHours()) + ':00 UTC';
      }
    }

    var CCYS = ['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];

    // The 28 tradeable major pairs. Used to convert (strong, weak) → an
    // actual instrument + direction (STRONG_WEAK → BUY, WEAK_STRONG → SELL).
    var PAIRS = [
      'EUR_USD','GBP_USD','AUD_USD','NZD_USD','USD_JPY','USD_CHF','USD_CAD',
      'EUR_GBP','EUR_JPY','EUR_CHF','EUR_CAD','EUR_AUD','EUR_NZD',
      'GBP_JPY','GBP_CHF','GBP_CAD','GBP_AUD','GBP_NZD',
      'AUD_JPY','AUD_CHF','AUD_CAD','AUD_NZD',
      'NZD_JPY','NZD_CHF','NZD_CAD','CAD_JPY','CAD_CHF','CHF_JPY'
    ];
    var PAIR_SET = {}; PAIRS.forEach(function(p) { PAIR_SET[p] = true; });

    function findPair(strong, weak) {
      if (PAIR_SET[strong + '_' + weak]) {
        return { pair: strong + '/' + weak, instrument: strong + '_' + weak, direction: 'BUY' };
      }
      if (PAIR_SET[weak + '_' + strong]) {
        return { pair: weak + '/' + strong, instrument: weak + '_' + strong, direction: 'SELL' };
      }
      return null;
    }

    // Minimum impulse to qualify. impulse = (body / ATR14) × efficiency × 100,
    // so 100 means the body equalled a full ATR with zero wicks. 60 keeps
    // genuinely decisive breaks and drops limp ones.
    var IMPULSE_MIN = 60;
    // Directional efficiency floor: net move / total path over the last 20
    // candles. Measured across a full day of breaks the median is ~0.29, so
    // 0.45 keeps roughly the cleanest quartile. Raised from 0.35 after
    // EUR/NZD 15-Jul 11:45 UTC passed at 0.38 while visibly overlapping —
    // price there travelled ~2.6x the distance it actually covered.
    var DE_MIN = 0.45;
    // Of the last 20 closes, how many must sit on the trend side of BOTH
    // EMAs. 10/20 was a coin flip — 14/20 demands real participation.
    var TREND_HITS_MIN = 14;

    // Build top-3 vs bottom-3 pair suggestions for a given hour row. Only
    // keep pairs whose current H1 broke the 6-candle high (BUY) or low
    // (SELL). Rank by ATR-normalised impulse — raw pips aren't comparable
    // across pairs of different volatility.
    function buildSetups(row) {
      var breaks = row.breaks || {};
      var scores = CCYS.map(function(c) { return { c: c, v: row.currencies[c] || 0 }; });
      scores.sort(function(a, b) { return b.v - a.v; });
      var top = scores.slice(0, 3);
      var bot = scores.slice(-3);
      var setups = [];
      top.forEach(function(t) {
        bot.forEach(function(b) {
          var m = findPair(t.c, b.c);
          if (!m) return;
          var br = breaks[m.instrument];
          if (!br || br.direction !== m.direction) return;
          // Trend-participation gate: at least 10 of the last 20 candles
          // must have closed on the aligned side of BOTH EMA20 and EMA50.
          var trendHits = m.direction === 'BUY' ? (br.above || 0) : (br.below || 0);
          if (trendHits < TREND_HITS_MIN) return;
          // Chop filter: price must actually be going somewhere, not just
          // oscillating around the EMAs.
          if ((br.de || 0) < DE_MIN) return;
          setups.push({
            pair: m.pair,
            direction: m.direction,
            spread: t.v - b.v,
            de:         br.de         || 0,
            bodyPips:   br.bodyPips   || 0,
            bodyAtr:    br.bodyAtr    || 0,
            efficiency: br.efficiency || 0,
            impulse:    br.impulse    || 0,
            breakAtr:   br.breakAtr   || 0,
            trendHits: trendHits,
          });
        });
      });
      // Momentum gates: keep the per-TF pip floor as a raw sanity check, and
      // require a real impulse — the body must be a meaningful fraction of
      // the pair's own ATR with a decisive, low-wick close.
      setups = setups.filter(function(s) { return s.bodyPips >= 10 && s.impulse >= IMPULSE_MIN; });
      setups.sort(function(a, b) { return b.impulse - a.impulse; });
      return setups;
    }

    function renderSetups(setups, prevKeys) {
      if (!setups.length) return '<span class="sp" style="color:var(--muted)">—</span>';
      return setups.map(function(s) {
        var key = s.pair + '|' + s.direction;
        var prevImp = prevKeys && prevKeys[key] !== undefined ? prevKeys[key] : null;
        // Any repeat qualifies — the previous setup already cleared the
        // impulse threshold, so simply appearing twice is the signal.
        var repeat = prevImp !== null;
        var tip = 'Impulse ' + s.impulse
          + ' — body ' + s.bodyPips.toFixed(1) + 'p (' + s.bodyAtr.toFixed(2) + '× ATR)'
          + ', efficiency ' + Math.round(s.efficiency * 100) + '%'
          + ', cleared level by ' + s.breakAtr.toFixed(2) + '× ATR'
          + ', ' + s.trendHits + '/20 closes in trend'
          + ', DE ' + s.de.toFixed(2)
          + (repeat ? ' · repeat (prev impulse ' + prevImp + ')' : '');
        return '<span class="setup-pill' + (repeat ? ' repeat' : '') + '" title="' + tip + '">'
          + s.pair + (repeat ? '<span class="repeat-dot"></span>' : '')
          + '<span class="d ' + s.direction + '">' + s.direction + '</span>'
          + '<span class="sp">⚡' + s.impulse + '</span>'
          + '</span>';
      }).join('');
    }

    // Precompute setup key → impulse per row so a row can look up whether
    // this pair + direction also appeared in the previous anchor (and at
    // what impulse, for the tooltip).
    function keyMap(setups) {
      var m = {};
      setups.forEach(function(s) { m[s.pair + '|' + s.direction] = s.impulse || 0; });
      return m;
    }

    function render(rows) {
      var tbody = document.getElementById('tbody');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:20px">No hours returned for this window.</td></tr>';
        return;
      }
      // Build setups and keyMap for every row once so repeat detection is O(1).
      var setupsByRow = rows.map(buildSetups);
      var keysByRow   = setupsByRow.map(keyMap);
      var html = '';
      // newest first
      for (var i = rows.length - 1; i >= 0; i--) {
        var r = rows[i];
        var prevKeys = i > 0 ? keysByRow[i - 1] : null; // rows are chronological, i-1 = older
        html += '<tr><td class="time">' + fmtTime(r.time) + '</td>';
        for (var j = 0; j < CCYS.length; j++) {
          var v = r.currencies[CCYS[j]] || 0;
          html += '<td class="cell" style="background:' + cellColor(v) + '">' + v.toFixed(2) + '</td>';
        }
        html += '<td class="setups">' + renderSetups(setupsByRow[i], prevKeys) + '</td>';
        html += '</tr>';
      }
      tbody.innerHTML = html;
    }

    async function load() {
      var from = document.getElementById('from').value;
      var to   = document.getElementById('to').value;
      var status = document.getElementById('status');
      status.classList.remove('error');
      status.textContent = 'Loading…';
      try {
        var r = await fetch('/api/currency-strength-h1-ema-history?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to));
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var json = await r.json();
        if (json.error) throw new Error(json.error);
        status.textContent = json.hours + ' hours · ' + (json.duration_sec || 0) + 's';
        render(json.rows || []);
      } catch (e) {
        status.classList.add('error');
        status.textContent = 'Error: ' + e.message;
      }
    }

    // Default range = last 5 working days (Mon-Fri) ending today.
    (function() {
      function ymd(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
      var to = new Date();
      var from = new Date(to);
      var count = 0;
      while (count < 5) {
        var day = from.getUTCDay();
        if (day !== 0 && day !== 6) count++;
        if (count < 5) from.setUTCDate(from.getUTCDate() - 1);
      }
      document.getElementById('from').value = ymd(from);
      document.getElementById('to').value   = ymd(to);
    })();

    document.getElementById('load').addEventListener('click', load);
    load();
  </script>
</body>
</html>
