<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NervaFX — Market Journal</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <!-- Inherits all .jrn-*, .sess-card-badge, .signal-dir, modal styles etc. -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ─── Page-level layout (journal.html only) ────────────────────────────── */

    /* Suppress the main dashboard grid — not needed here */
    .grid { display: block !important; }

    /* ── Top bar ──────────────────────────────────────────────────────────── */
    .jpage-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px;
      background: rgba(8,11,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .jpage-topbar-left  { display: flex; align-items: center; gap: 12px; }
    .jpage-topbar-right { display: flex; align-items: center; gap: 10px; }

    .jpage-logo {
      display: flex; align-items: center;
      text-decoration: none; flex-shrink: 0;
    }
    .jpage-logo img { height: 24px; display: block; }
    .jpage-sep { color: rgba(255,255,255,0.1); font-size: 20px; font-weight: 200; }
    .jpage-title-text {
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .jpage-count-badge {
      font-family: var(--font-data);
      font-size: 10px; color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 5px; padding: 3px 9px;
    }
    .jpage-back-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-size: 11px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: all 0.15s;
    }
    .jpage-back-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); border-color: rgba(255,255,255,0.14); }

    /* ── Filter bar ───────────────────────────────────────────────────────── */
    .jpage-filters {
      position: sticky; top: 56px; z-index: 90;
      background: rgba(8,11,18,0.95);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 10px 28px;
      display: flex; align-items: center; gap: 18px;
      flex-wrap: wrap;
    }
    .jpage-filter-group { display: flex; align-items: center; gap: 7px; }
    .jpage-filter-label {
      font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--text-dim); white-space: nowrap;
    }
    .jpage-pills { display: flex; gap: 3px; flex-wrap: wrap; }
    .jpage-pill {
      font-size: 10px; font-weight: 600;
      padding: 4px 10px; border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent; color: var(--text-muted);
      cursor: pointer; transition: all 0.12s; white-space: nowrap;
    }
    .jpage-pill:hover  { background: var(--bg-hover); color: var(--text); border-color: #334155; }
    .jpage-pill.active { background: rgba(59,130,246,0.14); border-color: rgba(59,130,246,0.38); color: #93c5fd; }
    /* Sentiment-specific active colours */
    .jpage-pill.active[data-val="RISK_ON"]  { background: rgba(74,222,128,0.1);  border-color: rgba(74,222,128,0.3);  color: #4ade80; }
    .jpage-pill.active[data-val="RISK_OFF"] { background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.3); color: #f87171; }
    .jpage-pill.active[data-val="NEUTRAL"]  { background: rgba(100,116,139,0.1); border-color: rgba(100,116,139,0.3); color: #b0bec5; }

    .jpage-filter-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }

    .jpage-search-wrap {
      display: flex; align-items: center; gap: 6px; margin-left: auto;
    }
    .jpage-search {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px; color: var(--text);
      font-family: var(--font-ui);
      outline: none; width: 180px;
      transition: border-color 0.15s;
    }
    .jpage-search::placeholder { color: var(--text-dim); }
    .jpage-search:focus { border-color: #334155; }
    .jpage-clear-btn {
      font-size: 10px; font-weight: 600;
      color: var(--text-dim); background: none;
      border: none; cursor: pointer; padding: 4px 6px;
      border-radius: 4px; transition: color 0.12s;
    }
    .jpage-clear-btn:hover { color: var(--text); }

    /* ── Main content ─────────────────────────────────────────────────────── */
    .jpage-main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 28px 80px;
    }

    /* ── Entry list ───────────────────────────────────────────────────────── */
    .jpage-list {
      display: flex; flex-direction: column; gap: 4px;
    }

    /* Summary visible on the dedicated page (not the dashboard compact widget) */
    .jrn-entry .jrn-summary {
      padding: 6px 14px 10px;
      font-size: 11px; line-height: 1.6;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    /* ── States ───────────────────────────────────────────────────────────── */
    .jpage-loading, .jpage-empty {
      text-align: center; padding: 60px 20px;
      color: var(--text-muted); font-size: 13px;
    }
    .jpage-spinner {
      display: inline-block; width: 22px; height: 22px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: jp-spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes jp-spin { to { transform: rotate(360deg); } }

    /* ── Stats bar ────────────────────────────────────────────────────────── */
    .jpage-stats-bar {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      flex-wrap: wrap;
    }
    .jpage-stat {
      display: flex; align-items: center; gap: 5px;
      font-size: 10px; color: var(--text-muted);
    }
    .jpage-stat-val {
      font-family: var(--font-data);
      font-size: 11px; font-weight: 700;
      color: var(--text);
    }
    .jpage-stat-sep { color: var(--border); }

    /* ── Mobile ────────────────────────────────────────────────────────────── */
    @media (max-width: 700px) {
      /* Top bar: reduce padding; hide page title (logo identifies the page) */
      .jpage-topbar  { padding: 0 14px; }
      .jpage-sep, .jpage-title-text { display: none; }
      .jpage-count-badge { font-size: 9px; padding: 2px 7px; }
      .jpage-back-btn { font-size: 10px; padding: 5px 10px; }

      /* Filter bar: single-row, horizontally scrollable; search pinned to its own row */
      .jpage-filters {
        top: 56px;
        padding: 6px 14px;
        gap: 8px;
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .jpage-filters::-webkit-scrollbar { display: none; }
      .jpage-filter-sep { display: none; }
      .jpage-filter-group { flex-shrink: 0; }
      .jpage-filter-label { font-size: 8px; letter-spacing: 0.5px; }
      .jpage-pill { font-size: 9px; padding: 3px 8px; }
      .jpage-search-wrap { flex-shrink: 0; margin-left: 0; }
      .jpage-search { width: 120px; font-size: 10px; }

      /* Main content: tighter horizontal padding */
      .jpage-main { padding: 12px 12px 60px; }

      /* Stats bar: tighten */
      .jpage-stats-bar { gap: 8px; padding: 6px 10px; font-size: 9px; }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="jpage-topbar">
    <div class="jpage-topbar-left">
      <a href="/app" class="jpage-logo">
        <img src="/nervafx-logo.png" alt="NervaFX">
      </a>
      <span class="jpage-sep">|</span>
      <span class="jpage-title-text">
        <i data-lucide="book-open" style="width:14px;height:14px;flex-shrink:0"></i>
        Market Journal
      </span>
    </div>
    <div class="jpage-topbar-right">
      <span id="jpage-count" class="jpage-count-badge">Loading…</span>
      <span class="journal-live-badge">LIVE</span>
      <a href="/app" class="jpage-back-btn">
        <i data-lucide="arrow-left" style="width:11px;height:11px"></i>
        Dashboard
      </a>
    </div>
  </header>

  <!-- Filter bar -->
  <div class="jpage-filters">
    <div class="jpage-filter-group">
      <span class="jpage-filter-label">Session</span>
      <div class="jpage-pills" id="filter-session">
        <button class="jpage-pill active" data-val="">All</button>
        <button class="jpage-pill" data-val="ASIA">Asia</button>
        <button class="jpage-pill" data-val="LONDON_OPEN">London Open</button>
        <button class="jpage-pill" data-val="LONDON">London</button>
        <button class="jpage-pill" data-val="LONDON_NY">London/NY</button>
        <button class="jpage-pill" data-val="LATE_NY">Late NY</button>
      </div>
    </div>

    <div class="jpage-filter-sep"></div>

    <div class="jpage-filter-group">
      <span class="jpage-filter-label">Period</span>
      <div class="jpage-pills" id="filter-date">
        <button class="jpage-pill active" data-val="">All</button>
        <button class="jpage-pill" data-val="today">Today</button>
        <button class="jpage-pill" data-val="7d">7 Days</button>
        <button class="jpage-pill" data-val="30d">30 Days</button>
      </div>
    </div>

    <div class="jpage-filter-sep"></div>

    <div class="jpage-filter-group">
      <span class="jpage-filter-label">Signals</span>
      <div class="jpage-pills" id="filter-csig">
        <button class="jpage-pill active" data-val="">All</button>
        <button class="jpage-pill" data-val="cs" title="Entries that had confirmed CS currencies at that time">Has CS</button>
      </div>
    </div>

    <div class="jpage-search-wrap">
      <input
        type="search"
        id="jpage-search"
        class="jpage-search"
        placeholder="Search summary…"
        oninput="onSearchInput(this.value)"
      />
      <button class="jpage-clear-btn" onclick="clearFilters()" title="Clear all filters">✕ Clear</button>
    </div>
  </div>

  <!-- Main content -->
  <main class="jpage-main">
    <div id="jpage-stats" class="jpage-stats-bar" style="display:none"></div>
    <div id="jpage-list" class="jpage-list">
      <div class="jpage-loading">
        <div class="jpage-spinner"></div>
        <p>Loading journal…</p>
      </div>
    </div>
  </main>

  <!-- Journal Detail Modal (same structure as dashboard) -->
  <div id="jrn-modal-overlay" class="jrn-modal-overlay" onclick="closeJournalModal()">
    <div class="jrn-modal" onclick="event.stopPropagation()">
      <div class="jrn-modal-header">
        <div class="jrn-modal-title">
          <span id="jrn-modal-time"  class="jrn-modal-time"></span>
          <span id="jrn-modal-badges" class="jrn-modal-badges"></span>
        </div>
        <button class="ai-modal-close" onclick="closeJournalModal()">
          <i data-lucide="x" style="width:16px;height:16px"></i>
        </button>
      </div>
      <div id="jrn-modal-body" class="jrn-modal-body"></div>
    </div>
  </div>

  <script>
  // ─── Auth guard ───────────────────────────────────────────────────────────────
  (function () {
    const token = localStorage.getItem('nfx_token');
    if (!token) return location.replace('/login.html');
    try {
      const pay = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if (pay.exp && pay.exp * 1000 < Date.now()) {
        localStorage.removeItem('nfx_token');
        return location.replace('/login.html');
      }
    } catch (_) { return location.replace('/login.html'); }
  })();

  // ─── Globals ──────────────────────────────────────────────────────────────────
  let _allEntries     = [];
  let _journalEntries = {}; // id → entry, for modal
  let _filterSession   = '';
  let _filterDate      = '';
  let _filterSearch    = '';
  let _filterCsig      = false;
  let _csigCurrencies  = new Set(); // populated from live strength data — used by modal setup filter
  const CS_THRESHOLD   = 0.00100;
  const _userTz = localStorage.getItem('nfx_tz') || 'auto';

  // ─── API helper ───────────────────────────────────────────────────────────────
  async function api(path) {
    const token = localStorage.getItem('nfx_token');
    const r = await fetch(path, { headers: { Authorization: `Bearer ${token}` } });
    if (r.status === 401) { location.replace('/login.html'); throw new Error('Unauthorized'); }
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  }

  // ─── Formatters ───────────────────────────────────────────────────────────────
  function fmtTime(iso) {
    if (!iso) return '—';
    try {
      const tz = _userTz === 'auto' ? Intl.DateTimeFormat().resolvedOptions().timeZone : (_userTz || 'UTC');
      return new Intl.DateTimeFormat('en-GB', {
        timeZone: tz, day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: false, timeZoneName: 'short',
      }).format(new Date(iso));
    } catch (_) { return new Date(iso).toUTCString().replace('GMT', 'UTC'); }
  }
  function fmtShort(iso) {
    if (!iso) return '—';
    try {
      const tz = _userTz === 'auto' ? Intl.DateTimeFormat().resolvedOptions().timeZone : (_userTz || 'UTC');
      return new Intl.DateTimeFormat('en-GB', {
        timeZone: tz, day: '2-digit', month: 'short',
        hour: '2-digit', minute: '2-digit', hour12: false, timeZoneName: 'short',
      }).format(new Date(iso));
    } catch (_) { return new Date(iso).toUTCString().slice(5,22).replace('GMT','UTC'); }
  }
  function pair(s) { return s ? s.replace('_', '/') : s; }

  // Calendar form: "14:35 GMT+3" — time + TZ only, no date
  function fmtCalTime(iso) {
    if (!iso) return '—';
    try {
      const tz = _userTz === 'auto' ? Intl.DateTimeFormat().resolvedOptions().timeZone : (_userTz || 'UTC');
      return new Intl.DateTimeFormat('en-GB', {
        timeZone: tz, hour: '2-digit', minute: '2-digit',
        hour12: false, timeZoneName: 'short',
      }).format(new Date(iso));
    } catch (_) { return new Date(iso).toUTCString().slice(17,22) + ' UTC'; }
  }
  function clean(s) { return s ? s.replace(/_/g, ' ') : s; }

  // ─── Currency Signals helpers ─────────────────────────────────────────────────

  // Compute strong/weak from an entry's OWN stored currency_strength snapshot.
  // Historically accurate — no live API needed.
  function computeEntryCsig(e) {
    const cs   = e.currency_strength;
    const list = Array.isArray(cs) ? cs : (cs?.currencies || []);
    const strong = [], weak = [];
    list.forEach(c => {
      const v3  = parseFloat(c.smooth_3h  ?? c.normalized_3h)  || 0;
      const v6  = parseFloat(c.smooth_6h  ?? c.normalized_6h)  || 0;
      const v12 = parseFloat(c.smooth_12h ?? c.normalized_12h) || 0;
      const combined = (v3 + v6 + v12) / 3;
      if (combined >  CS_THRESHOLD && v3 >  CS_THRESHOLD) strong.push(c.currency);
      else if (combined < -CS_THRESHOLD && v3 < -CS_THRESHOLD) weak.push(c.currency);
    });
    return { strong, weak };
  }

  function _csigScore(strongLen, weakLen) {
    const dominant = Math.max(strongLen, weakLen);
    if (dominant >= 2) return 2;
    if (dominant >= 1) return 1;
    return -1;
  }
  function _csigPointHtml(score) {
    const cls   = score >= 2 ? 'exp' : score === 1 ? 'pos' : 'neg';
    const label = score >= 2 ? '+2'  : score === 1 ? '+1'  : '-1';
    return `<span class="jrn-csig-point ${cls}">${label}</span>`;
  }
  function csigBadgeHtml(e) {
    const { strong, weak } = computeEntryCsig(e);
    const score = _csigScore(strong.length, weak.length);
    const pt    = _csigPointHtml(score);
    if (score === -1) return `<div class="jrn-csig-row">${pt}<span class="jrn-csig-tag no-cs">No CS</span></div>`;
    const parts = [];
    if (strong.length) parts.push(`<span class="jrn-csig-tag strong">💪 ${strong.join(' ')}</span>`);
    if (weak.length)   parts.push(`<span class="jrn-csig-tag weak">🔻 ${weak.join(' ')}</span>`);
    return `<div class="jrn-csig-row">${pt}${parts.join('')}</div>`;
  }

  // For modal pair filtering — uses live _csigCurrencies (pass-through when empty)
  function hasCsigCurrency(instrument) {
    if (!_csigCurrencies.size) return true;
    const base  = (instrument || '').slice(0, 3).toUpperCase();
    const quote = (instrument || '').slice(4, 7).toUpperCase();
    return _csigCurrencies.has(base) || _csigCurrencies.has(quote);
  }

  // ─── Filter logic ─────────────────────────────────────────────────────────────
  function getDateRange(val) {
    const now = new Date();
    if (val === 'today') {
      const s = new Date(now); s.setHours(0,0,0,0);
      const e = new Date(now); e.setHours(23,59,59,999);
      return { from: s.toISOString(), to: e.toISOString() };
    }
    if (val === '7d')  return { from: new Date(now - 7 * 864e5).toISOString(),  to: now.toISOString() };
    if (val === '30d') return { from: new Date(now - 30 * 864e5).toISOString(), to: now.toISOString() };
    return null;
  }

  function applyFilters() {
    let entries = _allEntries;
    if (_filterSession)   entries = entries.filter(e => e.session_name   === _filterSession);
    if (_filterDate) {
      const range = getDateRange(_filterDate);
      if (range) entries = entries.filter(e => e.time >= range.from && e.time <= range.to);
    }
    if (_filterSearch) {
      const q = _filterSearch.toLowerCase();
      entries = entries.filter(e =>
        (e.summary || '').toLowerCase().includes(q) ||
        (e.session_name || '').toLowerCase().includes(q) ||
        (e.session_name || '').toLowerCase().includes(q)
      );
    }
    if (_filterCsig) {
      // Historically accurate: filter entries that had confirmed CS currencies
      // at the time of the snapshot, computed from their own stored data.
      entries = entries.filter(e => {
        const { strong, weak } = computeEntryCsig(e);
        return strong.length > 0 || weak.length > 0;
      });
    }
    return entries;
  }

  // ─── Render list ──────────────────────────────────────────────────────────────
  function renderList() {
    const entries = applyFilters();
    const total   = _allEntries.length;
    const shown   = entries.length;

    // Count badge
    document.getElementById('jpage-count').textContent =
      shown === total ? `${total} entries` : `${shown} / ${total}`;

    // Stats bar
    const statsEl = document.getElementById('jpage-stats');
    if (entries.length) {
      const csExpansion = entries.filter(e => { const { strong, weak } = computeEntryCsig(e); return Math.max(strong.length, weak.length) >= 2; }).length;
      const csActive    = entries.filter(e => { const { strong, weak } = computeEntryCsig(e); return strong.length + weak.length > 0; }).length - csExpansion;
      const csNone      = entries.length - csExpansion - csActive;
      const sigs        = entries.reduce((n, e) => n + ((e.signals_summary?.entered || []).length), 0);
      statsEl.style.display = 'flex';
      statsEl.innerHTML = `
        <div class="jpage-stat"><span class="jpage-stat-val" style="color:#ffffff">${csExpansion}</span><span>CS+2 Expansion</span></div>
        <span class="jpage-stat-sep">·</span>
        <div class="jpage-stat"><span class="jpage-stat-val" style="color:#4ade80">${csActive}</span><span>CS+1 Active</span></div>
        <span class="jpage-stat-sep">·</span>
        <div class="jpage-stat"><span class="jpage-stat-val" style="color:#b0bec5">${csNone}</span><span>No CS</span></div>
        <span class="jpage-stat-sep">·</span>
        <div class="jpage-stat"><span class="jpage-stat-val" style="color:#4ade80">${sigs}</span><span>Signals entered</span></div>`;
    } else {
      statsEl.style.display = 'none';
    }

    const el = document.getElementById('jpage-list');
    if (!entries.length) {
      el.innerHTML = '<div class="jpage-empty">No entries match the current filters.</div>';
      return;
    }

    el.innerHTML = entries.map(e => {
      const sessCls = (e.session_quality || 'BLOCKED').toLowerCase().replace(/_/g, '-');
      const signals = e.signals_summary || {};
      const enteredCount = (signals.entered || []).length;

      return `
        <div class="jrn-entry" id="jrn-${e.id}" onclick="openJournalModal('${e.id}')">
          <div class="jrn-header">
            <div class="jrn-hdr-top">
              <span class="jrn-time">${fmtShort(e.time)}</span>
              <span class="sess-card-badge sq-${sessCls}">${clean(e.session_name || '—')}</span>
            </div>
            <div class="jrn-hdr-bot">
              <div class="jrn-counts">
                <span class="jrn-count trend" title="Trend">${e.trend_pairs}T</span>
                <span class="jrn-count pb"    title="Pullback">${e.pullback_pairs}PB</span>
                <span class="jrn-count ready" title="Ready">${e.ready_pairs}R</span>
                ${enteredCount ? `<span class="jrn-count sig">${enteredCount}✦</span>` : ''}
              </div>
            </div>
            <span class="jrn-chevron">›</span>
          </div>
          ${csigBadgeHtml(e)}
        </div>`;
    }).join('');
  }

  // ─── Filter pill wiring ───────────────────────────────────────────────────────
  function setupFilterPills(groupId, setter) {
    document.getElementById(groupId).addEventListener('click', ev => {
      const pill = ev.target.closest('.jpage-pill');
      if (!pill) return;
      document.querySelectorAll(`#${groupId} .jpage-pill`).forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      setter(pill.dataset.val);
      renderList();
    });
  }
  function onSearchInput(val) { _filterSearch = val.trim(); renderList(); }
  function clearFilters() {
    _filterSession = ''; _filterDate = ''; _filterSearch = ''; _filterCsig = false;
    document.querySelectorAll('.jpage-pill').forEach(p => p.classList.remove('active'));
    document.querySelectorAll(

    ).forEach(p => p.classList.add('active'));

    renderList();

  // ─── Modal helpers ────────────────────────────────────────────────────────────
  let _jrnCachedEnergy = null;

  function fmt(n, d = 5) { return n != null ? Number(n).toFixed(d) : '—'; }

  function _jrnSection(title, content) {
    return `<div class="jrn-section"><div class="jrn-section-title">${title}</div>${content}</div>`;
  }

  // ─── V2 Engine Confluence (journal) ──────────────────────────────────────────
  const V2_THRESHOLDS = [
    { key: 'market_energy',       label: 'Energy',  min: 50, optimal: 65 },
    { key: 'tradability_score',   label: 'Trad',    min: 55, optimal: 70 },
    { key: 'movement_score',      label: 'Mov',     min: 35, optimal: 70 },
    { key: 'breadth_score',       label: 'Brd',     min: 65, optimal: 80 },
    { key: 'agreement_score',     label: 'Agr',     min: 60, optimal: 75 },
    { key: 'directional_control', label: 'DirCtrl', min: 30, optimal: 45 },
    { key: 'volatility_quality',  label: 'VolQ',    min: 30, optimal: 60 },
    { key: 'volatility_score',    label: 'Vol',     min: 40, optimal: 70 },
    { key: 'momentum_score',      label: 'Mom',     min: 30, optimal: 60, signed: true },
    { key: 'chaos_score',         label: 'Chaos',   max: 35, warnAbove: 50 },
    { key: 'false_breakout_risk', label: 'FBRisk',  max: 15, warnAbove: 30 },
  ];
  const V2_FIRE_PCT = 0.60;

  function evaluateV2Thresholds(hourlyRow) {
    if (!hourlyRow) return null;
    const results = [];
    for (const t of V2_THRESHOLDS) {
      const val = parseFloat(hourlyRow[t.key]) || 0;
      let pass;
      if (t.max !== undefined) { pass = val <= t.max; }
      else { pass = val >= t.min; }
      results.push({ key: t.key, label: t.label, value: Math.round(val),
        threshold: t.min !== undefined ? t.min : t.max, optimal: t.optimal,
        pass, inverted: t.max !== undefined, signed: t.signed });
    }
    const passed = results.filter(r => r.pass).length;
    const total  = results.length;
    const pct    = total > 0 ? passed / total : 0;
    return { results, passed, total, pct, fired: pct >= V2_FIRE_PCT };
  }

  function renderJrnConfluenceSection(hourlyRow) {
    if (!hourlyRow) return _jrnSection('⚙️ Engine Confluence', '<p class="jrn-empty">No hourly engine data for this snapshot.</p>');
    const eval_ = evaluateV2Thresholds(hourlyRow);
    if (!eval_) return _jrnSection('⚙️ Engine Confluence', '<p class="jrn-empty">Unable to evaluate engine thresholds.</p>');

    const statusCls = eval_.fired ? 'jrn-conf-active' : 'jrn-conf-inactive';
    const statusLabel = eval_.fired
      ? (eval_.pct >= 0.80 ? '🟢 STRONG — All systems go' : '🟡 ACTIVE — Conditions favourable')
      : '🔴 NOT MET — Market conditions insufficient';
    const explanation = eval_.fired
      ? `${eval_.passed} of ${eval_.total} engines passing (${Math.round(eval_.pct * 100)}%). Market scanners, trade setups, and impulse detection are active for this hour.`
      : `Only ${eval_.passed} of ${eval_.total} engines passing (${Math.round(eval_.pct * 100)}%) — need ${Math.ceil(V2_FIRE_PCT * eval_.total)} (60%) for activation. Trading sections are gated until conditions improve.`;

    const passes = eval_.results.filter(r => r.pass);
    const fails  = eval_.results.filter(r => !r.pass);
    const chipHtml = (r) => {
      const cls = r.pass ? 'jrn-conf-chip pass' : 'jrn-conf-chip fail';
      const prefix = r.signed && r.value > 0 ? '+' : '';
      const icon = r.pass ? '✓' : '✗';
      const dir = r.inverted ? '≤' : '≥';
      return `<span class="${cls}" title="${r.label}: ${prefix}${r.value} (threshold: ${dir}${r.threshold})">
        <span class="jrn-conf-name">${r.label}</span>
        <span class="jrn-conf-val">${prefix}${r.value}</span>
        <span class="jrn-conf-icon">${icon}</span>
      </span>`;
    };
    const failReasons = fails.map(r => {
      const prefix = r.signed && r.value > 0 ? '+' : '';
      const dir = r.inverted ? '≤' : '≥';
      return `<div class="jrn-conf-reason">✗ <strong>${r.label}</strong>: ${prefix}${r.value} (need ${dir}${r.threshold})</div>`;
    }).join('');

    return _jrnSection('⚙️ Engine Confluence', `
      <div class="${statusCls}">
        <div class="jrn-conf-status">${statusLabel}</div>
        <div class="jrn-conf-score">${eval_.passed}/${eval_.total} engines · ${Math.round(eval_.pct * 100)}%</div>
        <div class="jrn-conf-explain">${explanation}</div>
        <div class="jrn-conf-chips">${passes.map(chipHtml).join('')}${fails.map(chipHtml).join('')}</div>
        ${fails.length ? `<div class="jrn-conf-reasons"><div class="jrn-conf-reasons-title">Failing engines:</div>${failReasons}</div>` : ''}
      </div>`);
  }

  function renderJrnCsigSection(e) {
    const cs = e.currency_strength;
    const currencies = Array.isArray(cs) ? cs : (cs?.currencies || []);
    const asOf       = Array.isArray(cs) ? null : (cs?.as_of || null);

    const scored = currencies.map(c => {
      const v3  = parseFloat(c.smooth_3h  ?? c.normalized_3h)  || 0;
      const v6  = parseFloat(c.smooth_6h  ?? c.normalized_6h)  || 0;
      const v12 = parseFloat(c.smooth_12h ?? c.normalized_12h) || 0;
      return { cur: c.currency, combined: (v3 + v6 + v12) / 3, h3: v3, h6: v6, h12: v12 };
    });

    const strong = scored.filter(c => c.combined >  CS_THRESHOLD && c.h3 >  CS_THRESHOLD).sort((a, b) => b.combined - a.combined);
    const weak   = scored.filter(c => c.combined < -CS_THRESHOLD && c.h3 < -CS_THRESHOLD).sort((a, b) => a.combined - b.combined);
    const score  = _csigScore(strong.length, weak.length);

    const expansionNote = score >= 2 ? `<span class="jrn-csig-exp-note">Expansion likely</span>` : '';

    function fv(n) { return (n >= 0 ? '+' : '') + n.toFixed(5); }

    function colHtml(list, side) {
      const isStrong = side === 'strong';
      const cls      = isStrong ? 'pos' : 'neg';
      if (!list.length) return `
        <div class="cs-sig-col ${side}">
          <div class="cs-sig-col-title">${isStrong ? '💪 Strong' : '🔻 Weak'}</div>
          <div class="cs-sig-empty">No confirmed ${isStrong ? 'bullish' : 'bearish'} signal</div>
        </div>`;
      return `
        <div class="cs-sig-col ${side}">
          <div class="cs-sig-col-title">${isStrong ? '💪 Strong' : '🔻 Weak'}</div>
          <div class="cs-sig-head"><span>CCY</span><span>Combined</span><span>3H</span><span>6H</span><span>12H</span></div>
          ${list.map(c => `
            <div class="cs-sig-row">
              <span class="cs-sig-cur">${c.cur}</span>
              <span class="cs-sig-combo ${cls}">${fv(c.combined)}</span>
              <span class="cs-sig-val ${cls}">${fv(c.h3)}</span>
              <span class="cs-sig-val ${cls}">${fv(c.h6)}</span>
              <span class="cs-sig-val ${cls}">${fv(c.h12)}</span>
            </div>`).join('')}
        </div>`;
    }

    const headerContent = `
      <div class="jrn-csig-avail-header">
        ${_csigPointHtml(score)}
        <span class="jrn-csig-criteria">combined > ±${CS_THRESHOLD.toFixed(5)} & 3H confirms</span>
        ${expansionNote}
        ${asOf ? `<span class="jrn-csig-as-of">${fmtTime(asOf)}</span>` : ''}
      </div>
      <div class="cs-sig-grid">
        ${colHtml(strong, 'strong')}
        ${colHtml(weak, 'weak')}
      </div>`;

    return _jrnSection('📶 Currency Signals', headerContent);
  }

  function renderJrnStrengthSection(cs) {
    const currencies = Array.isArray(cs) ? cs : (cs?.currencies || null);
    const asOf       = Array.isArray(cs) ? null : (cs?.as_of || null);
    const asOfLabel  = asOf ? `<span class="jrn-as-of">as of ${fmtTime(asOf)}</span>` : '';
    const header     = `💹 Currency Strength ${asOfLabel}`;
    if (!cs || !currencies?.length)
      return `<div class="jrn-cs-section"><div class="jrn-cs-header">${header}</div><p class="jrn-cs-nodata">No strength data for this entry.</p></div>`;

    function pickVal(c, keys) {
      for (const k of keys) { const v = parseFloat(c[k]); if (!isNaN(v) && v !== 0) return v; }
      for (const k of keys) { const v = parseFloat(c[k]); if (!isNaN(v)) return v; }
      return 0;
    }

    const tfs = [
      { label: '3H',  keys: ['smooth_3h',  'normalized_3h']  },
      { label: '6H',  keys: ['smooth_6h',  'normalized_6h']  },
      { label: '12H', keys: ['smooth_12h', 'normalized_12h'] },
    ];

    const combinedVals = currencies.map(c => ({
      cur: c.currency,
      val: tfs.reduce((sum, tf) => sum + pickVal(c, tf.keys), 0) / tfs.length,
    })).sort((a, b) => b.val - a.val);
    const combinedMax = Math.max(...combinedVals.map(v => Math.abs(v.val)), 0.0001);

    const comboBlock = `
      <div class="jrn-cs-tf-block combined">
        <div class="jrn-cs-tf-label">Combined ∑</div>
        ${combinedVals.map(v => {
          const pct = Math.round((Math.abs(v.val) / combinedMax) * 100);
          const cls = v.val >= 0 ? 'combo-pos' : 'combo-neg';
          return `
            <div class="jrn-cs-row">
              <span class="jrn-cs-cur">${v.cur}</span>
              <div class="jrn-cs-bar-wrap"><div class="jrn-cs-bar ${cls}" style="width:${pct}%"></div></div>
              <span class="jrn-cs-num ${cls}">${v.val >= 0 ? '+' : ''}${v.val.toFixed(5)}</span>
            </div>`;
        }).join('')}
      </div>`;

    const tfBlocks = tfs.map(tf => {
      const vals = currencies.map(c => ({ cur: c.currency, val: pickVal(c, tf.keys) }))
        .sort((a, b) => b.val - a.val);
      const maxAbs = Math.max(...vals.map(v => Math.abs(v.val)), 0.0001);
      return `
        <div class="jrn-cs-tf-block">
          <div class="jrn-cs-tf-label">${tf.label} Strength</div>
          ${vals.map(v => {
            const pct = Math.round((Math.abs(v.val) / maxAbs) * 100);
            const cls = v.val >= 0 ? 'pos' : 'neg';
            return `
              <div class="jrn-cs-row">
                <span class="jrn-cs-cur">${v.cur}</span>
                <div class="jrn-cs-bar-wrap"><div class="jrn-cs-bar ${cls}" style="width:${pct}%"></div></div>
                <span class="jrn-cs-num ${cls}">${v.val >= 0 ? '+' : ''}${v.val.toFixed(5)}</span>
              </div>`;
          }).join('')}
        </div>`;
    }).join('');

    return `
      <div class="jrn-cs-section">
        <div class="jrn-cs-header">${header}</div>
        <div class="jrn-cs-grid">
          ${comboBlock}${tfBlocks}
        </div>
      </div>`;
  }

  function renderJrnCalendarSection(events, entryTime) {
    const ts = new Date(entryTime).getTime();
    const nearby = (events || []).filter(ev => Math.abs(new Date(ev.event_time).getTime() - ts) <= 3 * 60 * 60 * 1000);
    if (!nearby.length) return _jrnSection('📅 Economic Calendar', '<p class="jrn-empty">No events in this window.</p>');
    const order = { HIGH: 0, MEDIUM: 1, LOW: 2 };
    const sorted = [...nearby].sort((a, b) =>
      (order[a.impact] ?? 2) - (order[b.impact] ?? 2) || a.event_time.localeCompare(b.event_time)
    );
    return _jrnSection('📅 Economic Calendar', `
      <div class="jrn-cal-list">
        ${sorted.map(ev => {
          const imp = (ev.impact || 'LOW').toUpperCase();
          const act = ev.actual   != null ? `<span class="jrn-cal-actual">${ev.actual}</span>` : '';
          const fct = ev.forecast != null ? `<span class="jrn-cal-fct">Est ${ev.forecast}</span>` : '';
          const prv = ev.previous != null ? `<span class="jrn-cal-prv">Prev ${ev.previous}</span>` : '';
          return `
            <div class="jrn-cal-row">
              <span class="jrn-cal-impact imp-${imp.toLowerCase()}">${imp}</span>
              <span class="jrn-cal-time">${fmtCalTime(ev.event_time)}</span>
              <span class="jrn-cal-cur">${ev.currency}</span>
              <span class="jrn-cal-name">${ev.event_name}</span>
              <span class="jrn-cal-vals">${act}${fct}${prv}</span>
            </div>`;
        }).join('')}
      </div>`);
  }

  // ─── Modal open/close ─────────────────────────────────────────────────────────
  function _renderJournalModal(e, newsEvents, sessionEntries, prevEntry, hourlyRow) {
    const sessCls = (e.session_quality || 'BLOCKED').toLowerCase().replace(/_/g, '-');
    const signals  = e.signals_summary || {};
    const enteredCount = (signals.entered || []).length;

    const { strong: _csStrong, weak: _csWeak } = computeEntryCsig(e);
    const _allEntryCsig = [..._csStrong, ..._csWeak];
    const _entryCsSet = _allEntryCsig.length >= 2 ? new Set(_allEntryCsig) : new Set();
    const entryCsigFilter = instr => {
      if (!_entryCsSet.size) return false;
      const base  = (instr || '').slice(0, 3).toUpperCase();
      const quote = (instr || '').slice(4, 7).toUpperCase();
      return _entryCsSet.has(base) || _entryCsSet.has(quote);
    };

    document.getElementById('jrn-modal-time').textContent = fmtTime(e.time);
    document.getElementById('jrn-modal-badges').innerHTML = `
      <span class="sess-card-badge sq-${sessCls}" style="font-size:9px">${clean(e.session_name||'—')}</span>
      ${enteredCount ? `<span class="jrn-count sig" style="font-size:9px">${enteredCount}✦</span>` : ''}
      ${(({ strong, weak }) => {
        const parts = [];
        if (strong.length) parts.push(`<span class="jrn-csig-tag strong">💪 ${strong.join(' ')}</span>`);
        if (weak.length)   parts.push(`<span class="jrn-csig-tag weak">🔻 ${weak.join(' ')}</span>`);
        return parts.join('');
      })(computeEntryCsig(e))}`;

    document.getElementById('jrn-modal-body').innerHTML = [
      renderJrnConfluenceSection(hourlyRow !== undefined ? hourlyRow : null),
      sessionEntries ? renderJrnSessionPerfSection(e, sessionEntries) : '',
      newsEvents !== null ? renderJrnCalendarSection(newsEvents, e.time) : _jrnSection('📅 Economic Calendar', '<p class="jrn-empty jrn-loading">Loading…</p>'),
      renderJrnCsigSection(e),
      renderJrnStrengthSection(e.currency_strength),
      e.m15_impulses != null ? renderJrnM15Section(e.m15_impulses) : '',
      renderJrnSetupsSection(e.top_setups || [], signals, entryCsigFilter),
      renderJrnOutcomesSection(e),
      prevEntry !== undefined ? renderJrnPrevSessionSection(prevEntry) : '',
    ].filter(Boolean).join('');

    document.getElementById('jrn-modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  async function openJournalModal(id) {
    const e = _journalEntries[id];
    if (!e) return;
    _renderJournalModal(e, null, null, null, null);

    const all = Object.values(_journalEntries).sort((a, b) => a.time.localeCompare(b.time));
    const sessionEntries = all.filter(x => x.session_name === e.session_name && x.time <= e.time);
    const prevEntry = [...all].reverse().find(x => x.time < e.time) || null;

    let newsEvents = [];
    let hourlyMatch = null;
    try {
      const [newsR, energyR, hourlyR] = await Promise.all([
        api(`/api/news?date=${e.time.slice(0, 10)}`).catch(() => ({})),
        api('/api/market-energy').catch(() => null),
        api('/api/session-activity?type=hourly&days=3').catch(() => ({ hourly: [] })),
      ]);
      newsEvents = newsR.events || [];
      _jrnCachedEnergy = energyR;

      const entryHour = e.time.slice(0, 13);
      const rows = hourlyR.hourly || [];
      hourlyMatch = rows.find(r => (r.time_utc || '').slice(0, 13) === entryHour) || null;
    } catch {}

    _renderJournalModal(e, newsEvents, sessionEntries, prevEntry, hourlyMatch);
  }

  function closeJournalModal() {
    document.getElementById('jrn-modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeJournalModal(); });

  // ─── Init ─────────────────────────────────────────────────────────────────────
  setupFilterPills('filter-session',   v => { _filterSession   = v; });
  setupFilterPills('filter-date',      v => { _filterDate      = v; });
  setupFilterPills('filter-csig',      v => { _filterCsig      = v === 'cs'; });

  (async function init() {
    try {
      // Fetch journal entries and live strength data in parallel
      const [data, strengthData] = await Promise.all([
        api('/api/journal?limit=200'),
        api('/api/strength').catch(() => null),
      ]);

      _allEntries = data.entries || [];
      _allEntries.forEach(e => { _journalEntries[e.id] = e; });

      // Compute Currency Signals set from live strength (same logic as dashboard)
      const CS_THRESHOLD  = 0.00100;
      const rawCurrencies = Array.isArray(strengthData)
        ? strengthData
        : (strengthData?.currencies || []);
      const tfsKeys = [
        ['smooth_3h',  'normalized_3h' ],
        ['smooth_6h',  'normalized_6h' ],
        ['smooth_12h', 'normalized_12h'],
      ];
      function _pickVal(c, keys) {
        for (const k of keys) { const v = parseFloat(c[k]); if (!isNaN(v) && v !== 0) return v; }
        for (const k of keys) { const v = parseFloat(c[k]); if (!isNaN(v)) return v; }
        return 0;
      }
      rawCurrencies.forEach(c => {
        const combined = tfsKeys.reduce((sum, keys) => sum + _pickVal(c, keys), 0) / tfsKeys.length;
        const h3       = _pickVal(c, tfsKeys[0]);
        if ((combined >  CS_THRESHOLD && h3 >  CS_THRESHOLD) ||
            (combined < -CS_THRESHOLD && h3 < -CS_THRESHOLD)) {
          _csigCurrencies.add(c.currency);
        }
      });

      renderList();
    } catch (err) {
      document.getElementById('jpage-list').innerHTML =
        `<div class="jpage-empty">Failed to load journal: ${err.message}</div>`;
      document.getElementById('jpage-count').textContent = 'Error';
    }
  })();

  if (typeof lucide !== 'undefined') lucide.createIcons();
  </script>

  <script>
    // Init icons after DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
