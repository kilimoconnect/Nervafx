<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>NervaFX — Currency Acceleration</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .grid { display: block !important; }
    .sx-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px;
      background: rgba(8,11,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .sx-topbar-left { display: flex; align-items: center; gap: 12px; }
    .sx-logo img { height: 24px; display: block; }
    .sx-sep { color: rgba(255,255,255,0.1); font-size: 20px; font-weight: 200; }
    .sx-title-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .sx-back-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-size: 11px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.15s;
    }
    .sx-back-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }
    .sx-main { max-width: 1000px; margin: 0 auto; padding: 20px 20px 80px; }
    .sx-card {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; margin-bottom: 18px; overflow: hidden;
    }
    .sx-card-hd {
      padding: 12px 16px; font-size: 12px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .sx-card-hd i { width: 15px; height: 15px; }
    .sx-ctrls { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: wrap; }
    .sx-btn {
      padding: 4px 12px; border-radius: 7px; font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .sx-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .sx-btn.active { background: rgba(96,165,250,0.15); border-color: rgba(96,165,250,0.5); color: #60a5fa; }
    .sx-ctrl-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.1); }
    .sx-note { font-size: 10.5px; color: var(--text-dim); text-transform: none; letter-spacing: 0; font-weight: 500; }
    .sx-date-input {
      padding: 4px 8px; border-radius: 7px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-family: inherit; outline: none;
      transition: all 0.15s; cursor: pointer;
    }
    .sx-date-input:focus { border-color: rgba(96,165,250,0.5); color: var(--text); }
    .sx-date-input::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
    .sx-loading { display: flex; align-items: center; gap: 8px; padding: 40px; color: var(--text-muted); font-size: 12px; justify-content: center; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.15); border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .br-empty { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 13px; }

    /* ── Acceleration Card ── */
    .acc-card {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; margin-bottom: 14px; overflow: hidden;
    }
    .acc-hd {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04); flex-wrap: wrap;
    }
    .acc-time { font-size: 12px; font-weight: 700; color: var(--text); }
    .acc-date { font-size: 11px; color: var(--text-muted); }

    .acc-body { padding: 12px 14px; }

    /* ── Ranking table ── */
    .acc-ranking { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    .acc-ranking th {
      text-align: left; font-size: 10px; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.8px; padding: 4px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .acc-ranking td {
      padding: 6px 8px; font-size: 12px; font-weight: 600;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .acc-rank-num { color: var(--text-dim); font-size: 11px; width: 24px; }
    .acc-ccy { font-weight: 800; font-size: 13px; }
    .acc-ccy.pos { color: #4ade80; }
    .acc-ccy.neg { color: #f87171; }
    .acc-accel { font-family: var(--font-data); font-weight: 700; }
    .acc-accel.pos { color: #4ade80; }
    .acc-accel.neg { color: #f87171; }
    .acc-score-cell { width: 100px; }

    /* ── Score bar ── */
    .acc-score-bar {
      position: relative; height: 16px; border-radius: 3px;
      background: rgba(255,255,255,0.04); overflow: hidden;
    }
    .acc-score-fill {
      position: absolute; top: 0; height: 100%; border-radius: 3px;
      transition: width 0.3s;
    }
    .acc-score-fill.pos { background: rgba(34,197,94,0.4); right: 50%; }
    .acc-score-fill.neg { background: rgba(239,68,68,0.4); left: 50%; }
    .acc-score-mid {
      position: absolute; top: 0; left: 50%; width: 1px; height: 100%;
      background: rgba(255,255,255,0.15);
    }
    .acc-score-val {
      position: absolute; top: 0; left: 0; right: 0; text-align: center;
      font-size: 9px; font-weight: 800; line-height: 16px; color: var(--text);
    }

    /* ── Strength values ── */
    .acc-str { font-family: var(--font-data); font-size: 10px; color: var(--text-dim); }
    .acc-str.pos { color: rgba(74,222,128,0.7); }
    .acc-str.neg { color: rgba(248,113,113,0.7); }

    /* ── Candidates ── */
    .acc-cands-label {
      font-size: 10px; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px;
    }
    .acc-cands { display: flex; gap: 8px; flex-wrap: wrap; }
    .acc-cand {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    }
    .acc-cand-pair { font-size: 13px; font-weight: 800; color: var(--text); }
    .acc-cand-dir {
      font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 4px;
    }
    .acc-cand-dir.BUY { background: rgba(34,197,94,0.12); color: #4ade80; }
    .acc-cand-dir.SELL { background: rgba(239,68,68,0.12); color: #f87171; }
    .acc-cand-spread {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      font-family: var(--font-data);
    }
    .acc-cand-ccys {
      font-size: 10px; color: var(--text-dim); font-weight: 600;
    }

    @media (max-width: 640px) {
      .sx-main { padding: 14px 12px 60px; }
      .sx-ctrls { width: 100%; margin-left: 0; }
      .acc-score-cell { width: 70px; }
    }
  </style>
</head>
<body>
  <div class="sx-topbar">
    <div class="sx-topbar-left">
      <a class="sx-logo" href="/app"><img src="/nervafx-logo.png" alt="NervaFX" onerror="this.style.display='none'"></a>
      <span class="sx-sep">/</span>
      <span class="sx-title-text">Currency Acceleration</span>
    </div>
    <a class="sx-back-btn" href="/app" onclick="window.close(); setTimeout(function(){ location.href='/app'; }, 150); return false;">&times; Close</a>
  </div>

  <main class="sx-main">
    <div class="sx-card">
      <div class="sx-card-hd">
        <i data-lucide="gauge"></i> Currency Acceleration — Hourly momentum change
        <span class="sx-note">Which currencies are accelerating fastest vs decelerating</span>
        <span class="sx-ctrls">
          <button class="sx-btn sx-days active" data-days="1">1D</button>
          <button class="sx-btn sx-days" data-days="2">2D</button>
          <button class="sx-btn sx-days" data-days="5">5D</button>
          <button class="sx-btn sx-days" data-days="10">10D</button>
          <span class="sx-ctrl-sep"></span>
          <button class="sx-btn sx-session active" data-session="all">All</button>
          <button class="sx-btn sx-session" data-session="asia">Asia</button>
          <button class="sx-btn sx-session" data-session="london">London</button>
          <button class="sx-btn sx-session" data-session="newyork">New York</button>
          <span class="sx-ctrl-sep"></span>
          <input type="date" class="sx-date-input" id="sx-date-from" title="From date">
          <input type="date" class="sx-date-input" id="sx-date-to" title="To date">
          <button class="sx-btn" id="sx-date-go">Go</button>
        </span>
      </div>
    </div>
    <div id="acc-cards">
      <div class="sx-loading"><span class="spinner"></span> Loading…</div>
    </div>
  </main>

  <script>
  (function () {
    'use strict';

    var TOKEN = localStorage.getItem('nfx_token');
    if (!TOKEN) { location.href = '/login'; return; }

    var currentDays = 1;
    var currentSession = 'all';
    var cachedRows = [];

    var SESSIONS = {
      all:     { start: 0, end: 24 },
      asia:    { start: 0, end: 8 },
      london:  { start: 7, end: 16 },
      newyork: { start: 12, end: 21 },
    };

    function inSession(iso) {
      if (currentSession === 'all') return true;
      var h = new Date(iso).getUTCHours();
      var s = SESSIONS[currentSession];
      return h >= s.start && h < s.end;
    }

    function hrLabel(iso) {
      return new Date(iso).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Africa/Nairobi' });
    }
    function dayLabel(iso) {
      return new Date(iso).toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', timeZone: 'Africa/Nairobi' });
    }
    function isWeekend(iso) {
      var d = new Date(iso).getUTCDay();
      return d === 0 || d === 6;
    }
    function vcls(v) { return v >= 0 ? 'pos' : 'neg'; }
    function vfmt(v) { return (v >= 0 ? '+' : '') + v.toFixed(1); }

    function scoreBar(score) {
      var cls = score >= 0 ? 'pos' : 'neg';
      var w = Math.abs(score) / 2; // 50% = full half
      var style = cls === 'pos'
        ? 'right:50%;width:' + w + '%;transform-origin:right'
        : 'left:50%;width:' + w + '%;transform-origin:left';
      return '<div class="acc-score-bar">' +
        '<div class="acc-score-mid"></div>' +
        '<div class="acc-score-fill ' + cls + '" style="' + style + '"></div>' +
        '<div class="acc-score-val">' + (score >= 0 ? '+' : '') + score + '</div>' +
        '</div>';
    }

    function renderCards(rows) {
      var el = document.getElementById('acc-cards');
      if (!rows.length) {
        el.innerHTML = '<div class="br-empty">No acceleration data found for this period.</div>';
        return;
      }

      var html = '';
      var reversed = rows.slice().reverse();
      for (var r = 0; r < reversed.length; r++) {
        var row = reversed[r];
        if (isWeekend(row.time)) continue;
        if (!inSession(row.time)) continue;

        html += '<div class="acc-card">';

        // Header
        html += '<div class="acc-hd">';
        html += '<span class="acc-time">' + hrLabel(row.time) + '</span>';
        html += '<span class="acc-date">' + dayLabel(row.time) + '</span>';
        if (row.candidates.length) {
          html += '<span style="margin-left:auto;font-size:11px;font-weight:700;color:var(--text-dim)">' + row.candidates.length + ' candidate' + (row.candidates.length > 1 ? 's' : '') + '</span>';
        }
        html += '</div>';

        html += '<div class="acc-body">';

        // Ranking table
        html += '<table class="acc-ranking">';
        html += '<tr><th>#</th><th>Currency</th><th>Accel</th><th>3H</th><th class="acc-score-cell">Score</th></tr>';
        for (var i = 0; i < row.ranking.length; i++) {
          var a = row.ranking[i];
          html += '<tr>';
          html += '<td class="acc-rank-num">' + (i + 1) + '</td>';
          html += '<td class="acc-ccy ' + vcls(a.acceleration) + '">' + a.currency + '</td>';
          html += '<td class="acc-accel ' + vcls(a.acceleration) + '">' + vfmt(a.acceleration) + '</td>';
          html += '<td class="acc-str ' + vcls(a.s3) + '">' + vfmt(a.s3) + '</td>';
          html += '<td class="acc-score-cell">' + scoreBar(a.score) + '</td>';
          html += '</tr>';
        }
        html += '</table>';

        // Candidate pairs
        if (row.candidates.length) {
          html += '<div class="acc-cands-label">Candidate Pairs</div>';
          html += '<div class="acc-cands">';
          for (var c = 0; c < row.candidates.length; c++) {
            var cd = row.candidates[c];
            html += '<div class="acc-cand">';
            html += '<span class="acc-cand-pair">' + cd.pair + '</span>';
            html += '<span class="acc-cand-dir ' + cd.direction + '">' + cd.direction + '</span>';
            html += '<span class="acc-cand-spread">spread ' + vfmt(cd.spread) + '</span>';
            html += '<span class="acc-cand-ccys">' + cd.strongCcy + ' ' + vfmt(cd.strongAccel) + ' vs ' + cd.weakCcy + ' ' + vfmt(cd.weakAccel) + '</span>';
            html += '</div>';
          }
          html += '</div>';
        }

        html += '</div></div>';
      }
      el.innerHTML = html || '<div class="br-empty">No data found.</div>';
    }

    async function load() {
      document.getElementById('acc-cards').innerHTML = '<div class="sx-loading"><span class="spinner"></span> Loading…</div>';

      var fromEl = document.getElementById('sx-date-from');
      var toEl = document.getElementById('sx-date-to');
      var qs;
      if (fromEl.value && toEl.value) {
        qs = 'from=' + fromEl.value + '&to=' + toEl.value;
      } else {
        qs = 'days=' + currentDays;
      }

      try {
        var res = await fetch('/api/currency-acceleration?' + qs, {
          headers: { Authorization: 'Bearer ' + TOKEN },
        });
        if (!res.ok) throw new Error(await res.text());
        var json = await res.json();
        cachedRows = json.rows || [];
        renderCards(cachedRows);
      } catch (e) {
        document.getElementById('acc-cards').innerHTML =
          '<div class="br-empty" style="color:#f87171">Error: ' + e.message + '</div>';
      }
    }

    document.querySelectorAll('.sx-days').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.sx-days').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentDays = parseInt(btn.dataset.days, 10);
        document.getElementById('sx-date-from').value = '';
        document.getElementById('sx-date-to').value = '';
        load();
      });
    });

    document.querySelectorAll('.sx-session').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.sx-session').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentSession = btn.dataset.session;
        renderCards(cachedRows);
      });
    });

    document.getElementById('sx-date-go').addEventListener('click', function() {
      document.querySelectorAll('.sx-days').forEach(function(b) { b.classList.remove('active'); });
      load();
    });

    lucide.createIcons();
    load();
  })();
  </script>
</body>
</html>
