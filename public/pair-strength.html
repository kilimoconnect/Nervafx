<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>NervaFX — Pair Strength (H1 EMA)</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">
  <script src="/auth-guard.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .grid { display: block !important; }
    .sx-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px;
      background: rgba(8,11,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .sx-topbar-left { display: flex; align-items: center; gap: 12px; }
    .sx-logo img { height: 24px; display: block; }
    .sx-sep { color: rgba(255,255,255,0.1); font-size: 20px; font-weight: 200; }
    .sx-title-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .sx-back-btn {
      display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: none;
    }
    .sx-back-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .sx-subtitle { text-align: center; padding: 18px 20px 6px; font-size: 11px; color: var(--text-dim); letter-spacing: 0.3px; }
    .sx-meta { text-align: center; padding: 0 20px 8px; font-size: 10px; color: var(--text-dim); }
    .spinner {
      display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);
      border-top-color:#f472b6;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ps-loading, .ps-empty { text-align: center; color: var(--text-muted); padding: 40px; }

    .ps-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; padding: 10px 20px 48px; max-width: 900px; margin: 0 auto; }
    .ps-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .ps-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.025); }
    .ps-pair { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    .ps-bias { font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 8px; }
    .ps-section { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .ps-section:last-child { border-bottom: none; }
    .ps-label { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }

    .ps-stack-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: 7px; margin-bottom: 5px; }
    .ps-stack-k { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
    .ps-dot { width: 8px; height: 8px; border-radius: 50%; }
    .ps-stack-v { font-family: 'SF Mono','Cascadia Code','Fira Code',monospace; font-size: 12px; color: #e2e8f0; }
    .ps-stack-desc { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

    .ps-ccy-row { display: grid; grid-template-columns: 44px 1fr 68px; align-items: center; gap: 10px; margin-bottom: 9px; }
    .ps-ccy-code { font-size: 13px; font-weight: 800; color: #fff; }
    .ps-ccy-rank { font-size: 9px; color: var(--text-dim); font-weight: 600; }
    .ps-bar-track { position: relative; height: 10px; background: rgba(255,255,255,0.05); border-radius: 5px; }
    .ps-bar-mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: rgba(255,255,255,0.18); }
    .ps-bar-fill { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
    .ps-ccy-val { font-family: monospace; font-size: 12px; font-weight: 800; text-align: right; }

    .ps-verdict { font-size: 12px; line-height: 1.5; color: var(--text-muted); }
    .ps-verdict b { color: #fff; }

    .ps-driver { max-width: 900px; margin: 4px auto 0; padding: 12px 18px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; }
    .ps-driver-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
    .ps-driver-lbl { font-size: 10px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-dim); }
    .ps-driver-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .ps-driver-item { font-size: 13px; color: #e2e8f0; }
    .ps-driver-none { margin-top: 8px; font-size: 12px; color: var(--text-dim); }
    .ps-driver-strip { padding: 8px 18px; font-size: 12px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.04); background: rgba(255,255,255,0.015); }

    .ps-tabs { display: flex; justify-content: center; gap: 8px; padding: 6px 20px 2px; }
    .ps-tab { padding: 6px 18px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-muted); }
    .ps-tab.active { background: rgba(236,72,153,0.2); border-color: rgba(236,72,153,0.4); color: #f472b6; }
    .ps-filters { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px 4px; flex-wrap: wrap; font-size: 11px; color: var(--text-dim); }
    .sx-date-input { padding: 5px 10px; border-radius: 7px; font-size: 11px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-muted); color-scheme: dark; }
    .sx-go-btn { padding: 5px 14px; border-radius: 7px; font-size: 11px; font-weight: 700; background: rgba(236,72,153,0.2); border: 1px solid rgba(236,72,153,0.4); color: #f472b6; cursor: pointer; }
    .hist-wrap { max-width: 760px; margin: 0 auto; padding: 6px 16px 48px; }
    table.hist { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.hist th, table.hist td { padding: 8px 10px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.04); white-space: nowrap; }
    table.hist thead th { position: sticky; top: 56px; background: #0b0f18; color: var(--text-dim); font-size: 10px; font-weight: 700; letter-spacing: 0.5px; z-index: 5; }
    td.hist-time { text-align: left; color: var(--text-dim); font-family: 'SF Mono','Cascadia Code',monospace; font-weight: 700; }
    .hist-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 5px; }
    .hist-delta { font-family: monospace; font-size: 10px; margin-left: 6px; }
  </style>
</head>
<body>
  <div class="sx-topbar">
    <div class="sx-topbar-left">
      <a href="/app" class="sx-logo"><img src="/nervafx-logo.png" alt="NervaFX" /></a>
      <span class="sx-sep">|</span>
      <span class="sx-title-text">Pair Strength — H1 EMA</span>
    </div>
    <a href="/app" class="sx-back-btn">← Back</a>
  </div>

  <div class="sx-subtitle">AUD/NZD and CHF/JPY from H1 <b style="color:#94a3b8">EMA20 / EMA50 / price</b> stack. A signal only applies when one of the pair's currencies is ranked <b style="color:#94a3b8">#1 (strongest)</b> or <b style="color:#94a3b8">#8 (weakest)</b> by EMA strength across all 28 pairs; the EMA stack then confirms it (✓) or not.</div>
  <div class="sx-meta" id="ps-meta"></div>

  <div class="ps-tabs">
    <button class="ps-tab active" id="ps-tab-live">Live</button>
    <button class="ps-tab" id="ps-tab-hist">History</button>
  </div>

  <div class="ps-filters" id="ps-filters" style="display:none">
    <span>From</span><input type="date" id="ps-from" class="sx-date-input" />
    <span>To</span><input type="date" id="ps-to" class="sx-date-input" />
    <button id="ps-load" class="sx-go-btn">Load</button>
  </div>

  <div id="ps-body"><div class="ps-loading"><span class="spinner"></span> Loading…</div></div>
  <div id="ps-history" style="display:none"></div>

  <script>
    var TOKEN = localStorage.getItem('nfx_token') || '';
    var _userTz = localStorage.getItem('nfx_tz') || 'auto';
    function _tz() { return (_userTz === 'auto') ? Intl.DateTimeFormat().resolvedOptions().timeZone : (_userTz || 'UTC'); }

    var TARGETS = [
      { pair: 'AUD_NZD', base: 'AUD', quote: 'NZD' },
      { pair: 'CHF_JPY', base: 'CHF', quote: 'JPY' },
    ];
    var CCYS = ['USD', 'EUR', 'GBP', 'JPY', 'CHF', 'CAD', 'AUD', 'NZD'];

    // A trade only applies when one of the pair's currencies is at a rank
    // extreme: #1 (strongest) → buy it, #8 (weakest) → sell it.
    function extremeSignal(base, quote, rankOf) {
      var rb = rankOf[base], rq = rankOf[quote];
      if (rb === 1) return { dir: 'BUY',  driver: base,  rank: 1, extreme: 'strongest', reason: base + ' strongest (#1)' };
      if (rb === 8) return { dir: 'SELL', driver: base,  rank: 8, extreme: 'weakest',   reason: base + ' weakest (#8)' };
      if (rq === 1) return { dir: 'SELL', driver: quote, rank: 1, extreme: 'strongest', reason: quote + ' strongest (#1)' };
      if (rq === 8) return { dir: 'BUY',  driver: quote, rank: 8, extreme: 'weakest',   reason: quote + ' weakest (#8)' };
      return null;
    }
    // Combine the rank-extreme gate with the H1 EMA stack confirmation.
    function coreSignal(base, quote, score, rankOf) {
      var b = biasInfo(score);
      var ext = extremeSignal(base, quote, rankOf);
      if (!ext) return { label: 'NO SIGNAL', col: '#64748b', state: 'none', b: b, ext: null };
      var col = ext.dir === 'BUY' ? '#22c55e' : '#ef4444';
      if (b.dir === ext.dir)   return { label: ext.dir + ' ✓', col: col, state: 'confirmed', dir: ext.dir, b: b, ext: ext };
      if (b.dir === 'NEUTRAL') return { label: ext.dir + ' ?', col: col, state: 'pending',   dir: ext.dir, b: b, ext: ext };
      return { label: 'CONFLICT', col: '#f59e0b', state: 'conflict', dir: ext.dir, b: b, ext: ext };
    }
    function rankMap(currencies) {
      var arr = CCYS.map(function (c) { return { c: c, v: currencies[c] || 0 }; }).sort(function (a, b) { return b.v - a.v; });
      var m = {}; arr.forEach(function (x, i) { m[x.c] = i + 1; }); return m;
    }

    // Which of AUD/NZD/CHF/JPY is at a #1/#8 extreme and thus driving a pair.
    function driverBanner(ccy) {
      var byRank = {}; Object.keys(ccy).forEach(function (c) { byRank[ccy[c].rank] = c; });
      var top = byRank[1], bot = byRank[8];
      var drivers = [];
      for (var i = 0; i < TARGETS.length; i++) {
        var t = TARGETS[i], rankOf = {}; rankOf[t.base] = ccy[t.base].rank; rankOf[t.quote] = ccy[t.quote].rank;
        var ext = extremeSignal(t.base, t.quote, rankOf);
        if (ext) drivers.push({ t: t, ext: ext });
      }
      var h = '<div class="ps-driver"><div class="ps-driver-top">'
        + '<span class="ps-driver-lbl">Market driver</span>'
        + '<span>Strongest <b style="color:#4ade80">' + top + '</b> #1 · Weakest <b style="color:#f87171">' + bot + '</b> #8</span></div>';
      if (drivers.length) {
        h += '<div class="ps-driver-list">';
        drivers.forEach(function (dv) {
          var col = dv.ext.dir === 'BUY' ? '#22c55e' : '#ef4444';
          h += '<div class="ps-driver-item"><b style="color:' + col + '">' + dv.ext.driver + '</b> is ' + dv.ext.extreme
            + ' (#' + dv.ext.rank + ') → <b style="color:' + col + '">' + dv.ext.dir + ' ' + dv.t.pair.replace('_', '/') + '</b></div>';
        });
        h += '</div>';
      } else {
        h += '<div class="ps-driver-none">None of AUD / NZD / CHF / JPY is at a #1 or #8 extreme — no pair is being driven right now.</div>';
      }
      return h + '</div>';
    }

    function fmtTime(iso) {
      return new Date(iso).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: _tz() });
    }
    function dec(pair) { return pair.slice(-3) === 'JPY' ? 3 : 5; }

    // pair EMA-stack score → bias
    function biasInfo(score) {
      if (score >= 1)    return { label: 'STRONG BUY',  dir: 'BUY',  col: '#22c55e', desc: 'Bull stack — price &gt; EMA20 &gt; EMA50' };
      if (score === 0.5) return { label: 'BUY',         dir: 'BUY',  col: '#4ade80', desc: 'Price &gt; EMA20 (stack not yet confirmed)' };
      if (score <= -1)   return { label: 'STRONG SELL', dir: 'SELL', col: '#ef4444', desc: 'Bear stack — price &lt; EMA20 &lt; EMA50' };
      if (score === -0.5) return { label: 'SELL',        dir: 'SELL', col: '#f87171', desc: 'Price &lt; EMA20 (stack not yet confirmed)' };
      return { label: 'NEUTRAL', dir: 'NEUTRAL', col: '#94a3b8', desc: 'Price pinched between EMAs' };
    }

    function stackHtml(row, d) {
      var items = [
        { k: 'Price', v: row.close, c: '#e2e8f0' },
        { k: 'EMA20', v: row.e20,   c: '#38bdf8' },
        { k: 'EMA50', v: row.e50,   c: '#a78bfa' },
      ].sort(function (a, b) { return b.v - a.v; });
      var order = items.map(function (i) { return i.k; }).join('>');
      var bg = order === 'Price>EMA20>EMA50' ? 'rgba(34,197,94,0.10)'
             : order === 'EMA50>EMA20>Price' ? 'rgba(239,68,68,0.10)'
             : 'rgba(255,255,255,0.03)';
      var h = '';
      for (var i = 0; i < items.length; i++) {
        h += '<div class="ps-stack-row" style="background:' + bg + '">'
          + '<span class="ps-stack-k"><span class="ps-dot" style="background:' + items[i].c + '"></span>' + items[i].k + '</span>'
          + '<span class="ps-stack-v">' + items[i].v.toFixed(d) + '</span></div>';
      }
      var distCol = row.dist_pct >= 0 ? '#4ade80' : '#f87171';
      h += '<div class="ps-stack-desc">Price is <b style="color:' + distCol + '">' + (row.dist_pct > 0 ? '+' : '') + row.dist_pct.toFixed(2) + '%</b> vs EMA20</div>';
      return h;
    }

    function ccyRow(code, s) {
      var pos = s.strength >= 0;
      var col = pos ? '#22c55e' : '#ef4444';
      var w = Math.min(Math.abs(s.strength), 1) * 50;   // half-width max
      var fill = pos
        ? '<div class="ps-bar-fill" style="left:50%;width:' + w + '%;background:' + col + '"></div>'
        : '<div class="ps-bar-fill" style="right:50%;width:' + w + '%;background:' + col + '"></div>';
      return '<div class="ps-ccy-row">'
        + '<div><div class="ps-ccy-code">' + code + '</div><div class="ps-ccy-rank">#' + s.rank + '/8</div></div>'
        + '<div class="ps-bar-track"><div class="ps-bar-mid"></div>' + fill + '</div>'
        + '<div class="ps-ccy-val" style="color:' + col + '">' + (s.strength > 0 ? '+' : '') + s.strength.toFixed(2) + '</div>'
        + '</div>';
    }

    function verdict(t, ccy, sig) {
      var pair = t.pair.replace('_', '/');
      var rb = ccy[t.base].rank, rq = ccy[t.quote].rank;
      var line;
      if (sig.state === 'none') {
        line = '<b>No signal.</b> A setup needs one currency at a rank extreme — neither <b>' + t.base + '</b> (#' + rb + ') nor <b>' + t.quote + '</b> (#' + rq + ') is #1 or #8. Stand aside.';
      } else if (sig.state === 'confirmed') {
        line = '<b style="color:' + sig.col + '">Confirmed ' + sig.dir + ' ' + pair + '.</b> ' + sig.ext.reason + ', and the H1 EMA stack (' + sig.b.label + ') agrees.';
      } else if (sig.state === 'pending') {
        line = '<b style="color:' + sig.col + '">' + sig.dir + ' bias.</b> ' + sig.ext.reason + ', but the EMA stack is neutral — wait for price to ' + (sig.dir === 'BUY' ? 'reclaim' : 'lose') + ' the EMAs.';
      } else {
        line = '<b style="color:#f59e0b">Conflict.</b> Rank extreme says ' + sig.dir + ' (' + sig.ext.reason + '), but the EMA stack reads ' + sig.b.label + '. Stand aside.';
      }
      return '<div class="ps-verdict">' + line + '</div>';
    }

    function cardHtml(t, row, ccy) {
      var d = dec(t.pair);
      var baseS = ccy[t.base], quoteS = ccy[t.quote];
      var rankOf = {}; rankOf[t.base] = baseS.rank; rankOf[t.quote] = quoteS.rank;
      var sig = coreSignal(t.base, t.quote, row.score, rankOf);
      var b = sig.b;
      var driverStrip = sig.ext
        ? '<div class="ps-driver-strip" style="color:' + sig.col + '">🎯 Driver: <b>' + sig.ext.driver + '</b> — ' + sig.ext.extreme + ' currency (#' + sig.ext.rank + ')</div>'
        : '<div class="ps-driver-strip" style="color:#64748b">No driver — neither ' + t.base + ' nor ' + t.quote + ' is #1 or #8</div>';
      return '<div class="ps-card">'
        + '<div class="ps-head"><span class="ps-pair">' + t.pair.replace('_', '/') + '</span>'
        + '<span class="ps-bias" style="background:' + sig.col + '22;color:' + sig.col + '">' + sig.label + '</span></div>'
        + driverStrip
        + '<div class="ps-section"><div class="ps-label">H1 EMA stack</div>' + stackHtml(row, d)
        + '<div class="ps-stack-desc" style="margin-top:8px;color:' + b.col + '">' + b.desc + '</div></div>'
        + '<div class="ps-section"><div class="ps-label">Currency strength (H1 EMA, all pairs)</div>'
        + ccyRow(t.base, baseS) + ccyRow(t.quote, quoteS) + '</div>'
        + '<div class="ps-section"><div class="ps-label">Verdict</div>' + verdict(t, ccy, sig) + '</div>'
        + '</div>';
    }

    function render(data) {
      var body = document.getElementById('ps-body');
      var pairs = data.pairs || [];
      var pairMap = {}; for (var i = 0; i < pairs.length; i++) pairMap[pairs[i].pair] = pairs[i];

      // rank currencies (data.currencies already sorted strongest→weakest)
      var ccy = {};
      (data.currencies || []).forEach(function (c, i) { ccy[c.currency] = { strength: c.strength, rank: i + 1 }; });

      var missing = TARGETS.some(function (t) { return !pairMap[t.pair] || pairMap[t.pair].error || pairMap[t.pair].close == null; });
      if (missing) { body.innerHTML = '<div class="ps-empty">Insufficient H1 data to compute EMA stacks right now.</div>'; return; }

      var html = driverBanner(ccy) + '<div class="ps-wrap">';
      for (var j = 0; j < TARGETS.length; j++) html += cardHtml(TARGETS[j], pairMap[TARGETS[j].pair], ccy);
      html += '</div>';
      body.innerHTML = html;

      var t = pairMap[TARGETS[0].pair].time;
      document.getElementById('ps-meta').textContent = t ? ('Last H1 close: ' + fmtTime(t)) : '';
    }

    async function load() {
      try {
        var res = await fetch('/api/currency-strength-h1-ema', { headers: { Authorization: 'Bearer ' + TOKEN }, cache: 'no-store' });
        if (!res.ok) throw new Error(await res.text());
        render(await res.json());
      } catch (e) {
        document.getElementById('ps-body').innerHTML = '<div class="ps-empty" style="color:#f87171">Error: ' + e.message + '</div>';
      }
    }
    // ---- History ----
    function fmtHour(iso) {
      return new Date(iso).toLocaleString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: _tz() });
    }
    function deltaSpan(v) {
      var c = v >= 0 ? '#4ade80' : '#f87171';
      return '<span class="hist-delta" style="color:' + c + '">Δ' + (v > 0 ? '+' : '') + v.toFixed(2) + '</span>';
    }
    function histPairCell(stack, base, quote, rankOf, diff) {
      if (!stack) return '<span style="color:#475569">—</span>';
      var sig = coreSignal(base, quote, stack.score, rankOf);
      var tip = sig.ext ? ' title="Driver: ' + sig.ext.reason + '"' : ' title="No ' + base + '/' + quote + ' rank extreme"';
      return '<span class="hist-badge"' + tip + ' style="background:' + sig.col + '22;color:' + sig.col + '">' + sig.label + '</span>' + deltaSpan(diff);
    }
    function renderHistory(data) {
      var el = document.getElementById('ps-history');
      var rows = (data.rows || []).slice().reverse();   // newest first
      if (!rows.length) { el.innerHTML = '<div class="ps-empty">No history for this range.</div>'; return; }
      var h = '<div class="hist-wrap"><div style="font-size:11px;color:var(--text-dim);padding:4px 0 10px;text-align:center">'
        + rows.length + ' hourly snapshots · newest first · signal needs a #1/#8 currency, ✓ = EMA stack confirms · Δ = base − quote strength</div>';
      h += '<table class="hist"><thead><tr><th style="text-align:left">Time</th><th>AUD/NZD</th><th>CHF/JPY</th></tr></thead><tbody>';
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var an = r.pairs && r.pairs.AUD_NZD, cj = r.pairs && r.pairs.CHF_JPY;
        var rk = rankMap(r.currencies);
        var anD = (r.currencies.AUD || 0) - (r.currencies.NZD || 0);
        var cjD = (r.currencies.CHF || 0) - (r.currencies.JPY || 0);
        h += '<tr><td class="hist-time">' + fmtHour(r.time) + '</td>'
          + '<td>' + histPairCell(an, 'AUD', 'NZD', rk, anD) + '</td>'
          + '<td>' + histPairCell(cj, 'CHF', 'JPY', rk, cjD) + '</td></tr>';
      }
      h += '</tbody></table></div>';
      el.innerHTML = h;
    }
    async function loadHistory() {
      var from = document.getElementById('ps-from').value, to = document.getElementById('ps-to').value;
      if (!from || !to) return;
      var el = document.getElementById('ps-history');
      el.innerHTML = '<div class="ps-loading"><span class="spinner"></span> Loading history…</div>';
      try {
        var res = await fetch('/api/currency-strength-h1-ema-history?from=' + from + '&to=' + to, { headers: { Authorization: 'Bearer ' + TOKEN }, cache: 'no-store' });
        if (!res.ok) throw new Error(await res.text());
        renderHistory(await res.json());
      } catch (e) {
        el.innerHTML = '<div class="ps-empty" style="color:#f87171">Error: ' + e.message + '</div>';
      }
    }
    function setHistDefaults() {
      var now = new Date();
      document.getElementById('ps-to').value = now.toISOString().slice(0, 10);
      document.getElementById('ps-from').value = new Date(now.getTime() - 2 * 86400000).toISOString().slice(0, 10);
    }
    function showTab(t) {
      var live = t === 'live';
      document.getElementById('ps-tab-live').classList.toggle('active', live);
      document.getElementById('ps-tab-hist').classList.toggle('active', !live);
      document.getElementById('ps-body').style.display = live ? '' : 'none';
      document.getElementById('ps-filters').style.display = live ? 'none' : '';
      document.getElementById('ps-history').style.display = live ? 'none' : '';
      var el = document.getElementById('ps-history');
      if (!live && !el.dataset.loaded) { el.dataset.loaded = '1'; loadHistory(); }
    }
    document.getElementById('ps-tab-live').addEventListener('click', function () { showTab('live'); });
    document.getElementById('ps-tab-hist').addEventListener('click', function () { showTab('hist'); });
    document.getElementById('ps-load').addEventListener('click', loadHistory);
    setHistDefaults();

    load();
    setInterval(load, 5 * 60 * 1000);   // refresh every 5 min (H1 engine)
  </script>
</body>
</html>
