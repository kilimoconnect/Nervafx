<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>NervaFX — Liquidity Failure Engine</title>
<link rel="icon" type="image/png" href="/nervafx-icon.png">
<script src="/auth-guard.js"></script>
<link rel="stylesheet" href="style.css" />
<style>
  .grid { display: block !important; }
  .lf-topbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 56px; background: rgba(8,11,18,0.92); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
  .lf-left { display: flex; align-items: center; gap: 12px; }
  .lf-logo img { height: 24px; display: block; }
  .lf-sep { color: rgba(255,255,255,0.1); font-size: 20px; }
  .lf-title { font-size: 13px; font-weight: 600; color: var(--text-muted); }
  .lf-back { padding: 6px 12px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-muted); font-size: 12px; text-decoration: none; }
  .lf-wrap { max-width: 1160px; margin: 0 auto; padding: 10px 14px 60px; }
  .lf-accent { color:#38bdf8; }
  /* Mode + selector */
  .lf-mode { display:flex; gap:8px; justify-content:center; margin:12px 0 6px; }
  .lf-modebtn { padding:7px 16px; border-radius:9px; font-size:12px; font-weight:700; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-muted); cursor:pointer; }
  .lf-modebtn.active { background:rgba(56,189,248,0.18); border-color:rgba(56,189,248,0.45); color:#38bdf8; }
  .lf-coverage { text-align:center; font-size:11px; color:var(--text-dim); padding:2px 0 8px; }
  .lf-coverage b { color:#94a3b8; }
  .lf-selector { display:none; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; padding:10px 14px; background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:12px; max-width:900px; margin:0 auto; }
  .lf-selector.show { display:flex; }
  .lf-input { padding:6px 10px; border-radius:8px; font-size:12px; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-muted); color-scheme:dark; }
  .lf-input:disabled { opacity:0.4; cursor:not-allowed; }
  .lf-btn { padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; background:rgba(56,189,248,0.2); border:1px solid rgba(56,189,248,0.4); color:#38bdf8; cursor:pointer; }
  .lf-btn.ghost { background:rgba(255,255,255,0.04); border-color:var(--border); color:var(--text-muted); }
  .lf-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .lf-nav { display:flex; gap:4px; }
  .lf-heading { text-align:center; padding:12px 20px 2px; }
  .lf-heading .h { font-size:15px; font-weight:800; color:#e2e8f0; }
  .lf-heading .local { font-size:12px; color:#94a3b8; margin-top:2px; }
  .lf-heading .utc { font-size:11px; color:var(--text-dim); }
  .lf-livebadge { display:inline-block; padding:1px 8px; border-radius:5px; font-size:10px; font-weight:700; margin-left:6px; }
  .lf-livebadge.latest { background:rgba(251,191,36,0.14); color:#fbbf24; }
  .lf-livebadge.live { background:rgba(34,197,94,0.14); color:#4ade80; }
  /* Summary */
  .lf-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin:14px 0 6px; }
  .lf-stat { background:#0b0f18; border:1px solid var(--border); border-radius:10px; padding:10px 12px; text-align:center; }
  .lf-stat .n { font-size:20px; font-weight:800; color:#e2e8f0; }
  .lf-stat .l { font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; }
  .lf-stat.buy .n { color:#4ade80; } .lf-stat.sell .n { color:#f87171; }
  /* Groups + cards */
  .lf-group { margin:20px 0 6px; }
  .lf-group-hd { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:800; letter-spacing:0.4px; text-transform:uppercase; padding:6px 2px; border-bottom:1px solid var(--border); }
  .lf-group-count { font-size:11px; color:var(--text-dim); font-weight:600; }
  .lf-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; margin-top:10px; }
  .lf-card { background:#0b0f18; border:1px solid var(--border); border-left-width:4px; border-radius:10px; padding:12px 14px; }
  .lf-card-hd { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .lf-pair { font-size:16px; font-weight:800; color:#fff; }
  .lf-dir { font-size:11px; font-weight:800; letter-spacing:0.4px; padding:2px 8px; border-radius:5px; }
  .lf-dir.BUY { background:rgba(34,197,94,0.14); color:#4ade80; }
  .lf-dir.SELL { background:rgba(239,68,68,0.14); color:#f87171; }
  .lf-score { font-family:monospace; font-weight:800; font-size:16px; }
  .lf-grade { font-size:10px; font-weight:800; padding:1px 6px; border-radius:4px; }
  .lf-grade.APLUS { background:rgba(56,189,248,0.18); color:#38bdf8; }
  .lf-grade.CONFIRMED { background:rgba(34,197,94,0.14); color:#4ade80; }
  .lf-grade.WATCH { background:rgba(251,191,36,0.14); color:#fbbf24; }
  .lf-tag { font-size:10px; font-weight:700; padding:1px 6px; border-radius:4px; background:rgba(255,255,255,0.05); color:#94a3b8; }
  .lf-tag.ct { background:rgba(168,85,247,0.16); color:#c084fc; }
  .lf-rows { margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; }
  .lf-kv { display:flex; justify-content:space-between; font-size:11px; padding:1px 0; gap:8px; }
  .lf-k { color:var(--text-dim); } .lf-v { color:#e2e8f0; font-weight:600; text-align:right; }
  .lf-foot { margin-top:8px; display:flex; align-items:center; justify-content:space-between; font-size:10px; color:var(--text-dim); }
  .lf-details { margin-top:8px; }
  .lf-details summary { cursor:pointer; font-size:10px; color:#38bdf8; }
  .lf-details pre { font-size:10px; color:#94a3b8; overflow-x:auto; background:#080b12; padding:8px; border-radius:6px; margin-top:6px; }
  .lf-warn { margin-top:6px; font-size:11px; color:#fbbf24; padding:8px 2px; }
  .lf-empty, .lf-loading { text-align:center; color:var(--text-muted); padding:36px; }
  .lf-spin { display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:#38bdf8;border-radius:50%;animation:lfspin 0.7s linear infinite;vertical-align:middle; }
  @keyframes lfspin { to { transform: rotate(360deg); } }
  .lf-loadover { opacity:0.4; pointer-events:none; }
  /* History */
  .lf-histhd { margin-top:34px; font-size:13px; font-weight:800; color:#e2e8f0; }
  .lf-histfilters { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .lf-table { width:100%; border-collapse:collapse; font-size:11px; }
  .lf-table th { text-align:left; padding:6px 8px; color:var(--text-dim); border-bottom:1px solid var(--border); cursor:pointer; user-select:none; white-space:nowrap; }
  .lf-table td { padding:6px 8px; border-bottom:1px solid rgba(255,255,255,0.04); color:#cbd5e1; }
  .lf-tablewrap { overflow-x:auto; }
  @media (max-width:640px){ .lf-cards{grid-template-columns:1fr;} .lf-rows{grid-template-columns:1fr;} .lf-selector{gap:6px;} }
</style>
</head>
<body>

<div class="lf-topbar">
  <div class="lf-left">
    <a href="/app" class="lf-logo"><img src="/nervafx-logo.png" alt="NervaFX" /></a>
    <span class="lf-sep">|</span>
    <span class="lf-title">Liquidity Failure Engine</span>
  </div>
  <a href="/app" class="lf-back">← Back</a>
</div>

<div class="lf-wrap">
  <div class="lf-mode">
    <button class="lf-modebtn active" id="mode-latest">Latest Available</button>
    <button class="lf-modebtn" id="mode-hist">Historical Replay</button>
  </div>
  <div class="lf-coverage" id="lf-coverage">Loading coverage…</div>

  <div class="lf-selector" id="lf-selector">
    <input type="date" id="sel-date" class="lf-input" aria-label="Snapshot date" />
    <select id="sel-time" class="lf-input" aria-label="Snapshot time (15-minute increments)"></select>
    <select id="sel-tz" class="lf-input" aria-label="Display timezone"></select>
    <button class="lf-btn" id="sel-apply">Apply</button>
    <div class="lf-nav">
      <button class="lf-btn ghost" id="nav-h-back" title="Previous hour">−1h</button>
      <button class="lf-btn ghost" id="nav-m-back" title="Previous 15 minutes">−15m</button>
      <button class="lf-btn ghost" id="nav-m-fwd" title="Next 15 minutes">+15m</button>
      <button class="lf-btn ghost" id="nav-h-fwd" title="Next hour">+1h</button>
    </div>
    <button class="lf-btn ghost" id="sel-latest">Latest Available →</button>
  </div>

  <div class="lf-heading" id="lf-heading"></div>
  <div id="lf-summary"></div>
  <div id="lf-body"><div class="lf-loading"><span class="lf-spin"></span> Loading…</div></div>

  <div class="lf-histhd">History</div>
  <div class="lf-histfilters">
    <input type="date" id="h-from" class="lf-input" aria-label="History from" />
    <input type="date" id="h-to" class="lf-input" aria-label="History to" />
    <input type="text" id="h-pair" class="lf-input" style="width:100px" placeholder="Pair" />
    <select id="h-dir" class="lf-input"><option value="">Dir</option><option value="BUY">BUY</option><option value="SELL">SELL</option></select>
    <select id="h-side" class="lf-input"><option value="">Failed side</option><option value="BUYERS">Buyers</option><option value="SELLERS">Sellers</option></select>
    <select id="h-setup" class="lf-input"><option value="">Setup</option><option value="IMMEDIATE">Immediate</option><option value="DELAYED">Delayed</option></select>
    <input type="text" id="h-state" class="lf-input" style="width:120px" placeholder="State" />
    <input type="number" id="h-score" class="lf-input" style="width:90px" placeholder="Min score" />
    <button class="lf-btn" id="h-apply">Filter</button>
  </div>
  <div class="lf-tablewrap"><table class="lf-table" id="lf-histtable"><thead></thead><tbody></tbody></table></div>
  <div style="font-size:10px;color:var(--text-dim);margin-top:8px">Replay history never reveals eventual outcomes — performance lives in the separately labelled Results/Journal view.</div>
</div>

<script>
  var TOKEN = localStorage.getItem('nfx_token') || '';
  var COV = null;                 // coverage descriptor
  var MODE = 'latest';            // 'latest' | 'historical'
  var SELECTED_MS = null;         // UTC ms of chosen market time (historical)
  var USER_TZ = localStorage.getItem('nfx_tz') || 'auto';
  var reqToken = 0;               // guards against stale snapshot responses
  var HIST_SORT = { key:'first_seen_at', dir:-1 };

  var M15 = 15*60*1000, HOUR = 60*60*1000;
  function tz() { return document.getElementById('sel-tz').value || (USER_TZ==='auto' ? Intl.DateTimeFormat().resolvedOptions().timeZone : (USER_TZ||'UTC')); }
  function auth() { return { headers: { Authorization: 'Bearer ' + TOKEN }, cache:'no-store' }; }
  function px(v){ return v==null?'—':(+v).toFixed(5); }

  // DST-safe wall-clock (in tz) → UTC ms, mirrors the backend helper.
  function zonedWallToUtcMs(y,mo,d,h,mi,zone){
    var asIfUtc = Date.UTC(y,mo-1,d,h,mi,0);
    var dtf = new Intl.DateTimeFormat('en-US',{timeZone:zone,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    var parts={}; dtf.formatToParts(new Date(asIfUtc)).forEach(function(p){ if(p.type!=='literal') parts[p.type]=p.value; });
    var hh=(+parts.hour)%24;
    var seen = Date.UTC(+parts.year,+parts.month-1,+parts.day,hh,+parts.minute,+parts.second);
    return asIfUtc + (asIfUtc - seen);
  }
  function partsInTz(ms, zone){
    var dtf = new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    var o={}; dtf.formatToParts(new Date(ms)).forEach(function(p){ if(p.type!=='literal') o[p.type]=p.value; });
    return o;
  }
  function fmtLocal(ms){ if(ms==null) return '—'; return new Date(ms).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:tz()}); }
  function fmtLocalT(ms){ if(ms==null) return '—'; return new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:tz()}); }
  function fmtUtc(ms){ if(ms==null) return '—'; return new Date(ms).toISOString().slice(11,16)+' UTC'; }
  function ageStr(fromMs, toMs){ if(fromMs==null||toMs==null) return '—'; var m=Math.max(0,Math.round((toMs-fromMs)/60000)); var h=Math.floor(m/60); return (h?h+'h ':'')+(m%60)+'m'; }
  function snap15(ms){ return Math.floor(ms/M15)*M15; }
  function clampMs(ms){ if(!COV) return ms; return Math.min(Math.max(ms, COV.earliestMs), COV.latestMs); }

  // ── Coverage ────────────────────────────────────────────────────────────
  async function loadCoverage(){
    var res = await fetch('/api/liquidity-failure?action=coverage', auth());
    if(!res.ok) throw new Error(await res.text());
    COV = await res.json();
    COV.earliestMs = new Date(COV.earliestSelectable).getTime();
    COV.latestMs = new Date(COV.commonLatest).getTime();
    document.getElementById('lf-coverage').innerHTML =
      'Data available: <b>'+fmtLocal(COV.earliestMs)+'</b> to <b>'+fmtLocal(COV.latestMs)+'</b> '
      +'<span style="opacity:.7">('+new Date(COV.earliestSelectable).toISOString().slice(0,10)+' → '+new Date(COV.commonLatest).toISOString().slice(0,10)+' UTC)</span>';
    // timezone select
    var tzSel = document.getElementById('sel-tz');
    (COV.displayTimezones||['UTC']).forEach(function(z){ var o=document.createElement('option'); o.value=z; o.textContent=z; tzSel.appendChild(o); });
    var pref = (USER_TZ && USER_TZ!=='auto') ? USER_TZ : Intl.DateTimeFormat().resolvedOptions().timeZone;
    if([].slice.call(tzSel.options).some(function(o){return o.value===pref;})) tzSel.value=pref; else tzSel.value='UTC';
    // time options
    var tSel = document.getElementById('sel-time');
    for(var h=0;h<24;h++) for(var m=0;m<60;m+=15){ var v=('0'+h).slice(-2)+':'+('0'+m).slice(-2); var o=document.createElement('option'); o.value=v; o.textContent=v; tSel.appendChild(o); }
    // date bounds
    var d=document.getElementById('sel-date');
    d.min = new Date(COV.earliestMs).toISOString().slice(0,10);
    d.max = new Date(COV.latestMs).toISOString().slice(0,10);
  }

  // ── Snapshot ────────────────────────────────────────────────────────────
  function buildUrl(){
    if(MODE==='latest') return '/api/liquidity-failure?action=snapshot&mode=latest_available&timezone='+encodeURIComponent(tz());
    var iso = new Date(SELECTED_MS).toISOString();
    return '/api/liquidity-failure?action=snapshot&at='+encodeURIComponent(iso)+'&timezone='+encodeURIComponent(tz());
  }
  function syncUrl(){
    var u = new URL(window.location.href);
    if(MODE==='historical' && SELECTED_MS!=null) u.searchParams.set('at', new Date(SELECTED_MS).toISOString());
    else u.searchParams.delete('at');
    history.replaceState(null,'',u.toString());
  }

  async function loadSnapshot(){
    var mine = ++reqToken;
    var body = document.getElementById('lf-body');
    body.classList.add('lf-loadover');
    body.insertAdjacentHTML('afterbegin','<div class="lf-loading" id="lf-loadmsg"><span class="lf-spin"></span> Loading snapshot…</div>');
    syncUrl();
    try {
      var res = await fetch(buildUrl(), auth());
      if(mine!==reqToken) return;              // a newer request superseded this one
      if(res.status===422){ var err=await res.json(); renderError('Outside coverage: valid '+err.validRange.earliest+' → '+err.validRange.latest); return; }
      if(!res.ok) throw new Error(await res.text());
      var data = await res.json();
      if(mine!==reqToken) return;
      renderSnapshot(data);
    } catch(e){
      if(mine!==reqToken) return;
      renderError(e.message||String(e));
    } finally {
      if(mine===reqToken) body.classList.remove('lf-loadover');
    }
  }

  function renderError(msg){
    document.getElementById('lf-heading').innerHTML='';
    document.getElementById('lf-summary').innerHTML='';
    document.getElementById('lf-body').innerHTML='<div class="lf-empty" style="color:#f87171">'+msg+'</div>';
  }

  function renderHeading(d){
    var el=document.getElementById('lf-heading');
    var normMs = new Date(d.normalizedTime).getTime();
    if(d.mode==='latest_available'){
      var cls = d.latestLabel==='Live' ? 'live':'latest';
      el.innerHTML='<div class="h">Latest available snapshot <span class="lf-livebadge '+cls+'">'+(d.latestLabel||'Latest available historical data')+'</span></div>'
        +'<div class="local">'+fmtLocal(normMs)+' '+tz()+'</div><div class="utc">Market time: '+fmtUtc(normMs)+'</div>';
    } else {
      el.innerHTML='<div class="h">Historical snapshot</div>'
        +'<div class="local">'+fmtLocal(normMs)+' '+tz()+'</div><div class="utc">Market time: '+fmtUtc(normMs)+'  ·  last usable H1 close '+fmtUtc(new Date(d.lastUsableH1Close).getTime())+'</div>';
    }
  }

  function renderSummary(d){
    var buys=d.confirmedSignals.filter(function(s){return s.direction==='BUY';}).length;
    var sells=d.confirmedSignals.filter(function(s){return s.direction==='SELL';}).length;
    var stats=[
      ['buy',buys,'Confirmed BUY'],['sell',sells,'Confirmed SELL'],
      ['',d.watchCandidates.length,'Watch'],
      ['',d.pendingDelayedFailures.length,'Delayed pending'],
      ['',d.pendingM15Confirmations.length,'M15 pending'],
      ['',d.acceptedBreakouts.length,'Accepted'],
      ['',d.recentlyExpiredOrInvalidated.length,'Expired/inval.'],
      ['',(d.partialDataWarnings.length+d.pairErrors.length),'Data warnings']
    ];
    document.getElementById('lf-summary').innerHTML='<div class="lf-summary">'+stats.map(function(s){
      return '<div class="lf-stat '+s[0]+'"><div class="n">'+s[1]+'</div><div class="l">'+s[2]+'</div></div>';
    }).join('')+'</div>';
  }

  function kv(k,v){ return '<div class="lf-kv"><span class="lf-k">'+k+'</span><span class="lf-v">'+v+'</span></div>'; }

  function signalCard(s, normMs){
    var ev=s.event||{}, cf=s.confirmation||{}, r=s.risk||{};
    var col=s.direction==='BUY'?'#4ade80':'#f87171';
    var ct = s.classification==='COUNTERTREND';
    var rot = s.pairRotation==null?'—':((s.pairRotation>0?'+':'')+(+s.pairRotation).toFixed(3));
    var h='<div class="lf-card" style="border-left-color:'+col+'">';
    h+='<div class="lf-card-hd"><div><span class="lf-pair">'+s.pair+'</span> <span class="lf-dir '+s.direction+'">'+s.direction+'</span></div>'
      +'<div style="text-align:right"><span class="lf-score" style="color:'+col+'">'+(s.score?Math.round(s.score.total):'—')+'</span> '
      +'<span class="lf-grade '+(s.grade==='A+'?'APLUS':s.grade)+'">'+(s.grade||'')+'</span></div></div>';
    h+='<div style="margin-top:4px"><span class="lf-tag">'+(ev.failedSide||'')+' failed</span> <span class="lf-tag">'+(ev.setupType||'')+'</span> <span class="lf-tag '+(ct?'ct':'')+'">'+(ct?'Countertrend':'Trend-aligned')+'</span></div>';
    h+='<div class="lf-rows">';
    h+=kv('Level',(ev.levelType||'—')+' '+px(ev.levelCentre));
    h+=kv('H1 breach',fmtLocalT(ev.breachAtMs));
    h+=kv('H1 failure',fmtLocalT(ev.failureAtMs));
    h+=kv('M15 break',px(cf.breakLevel));
    h+=kv('M15 confirm',fmtLocalT(cf.confirmAtMs));
    h+=kv('Rotation',rot);
    h+=kv('Entry',px(r.entry));
    h+=kv('Stop',px(r.stop));
    h+=kv('Target',px(r.target));
    h+=kv('R:R',r.rewardR!=null?(r.rewardR+'R'+(r.rewardOK?'':' ⚠')):'—');
    h+=kv('State',ev.state||'—');
    h+=kv('Age',ageStr(cf.confirmAtMs||ev.failureAtMs, normMs));
    h+='</div>';
    var flags=[]; if(r.late) flags.push('LATE'); if(r.entryExpired) flags.push('ENTRY EXPIRED');
    if(flags.length) h+='<div class="lf-warn">'+flags.join(' · ')+'</div>';
    h+='<details class="lf-details"><summary>Event details</summary><pre>'+detailText(s)+'</pre></details>';
    h+='</div>';
    return h;
  }

  function detailText(s){
    var ev=s.event||{};
    var out={
      whyLevel:{ type:ev.levelType, centre:ev.levelCentre, score:ev.levelScore, zone:[ev.zoneLow,ev.zoneHigh] },
      attack:{ start:ev.attackStartMs?new Date(ev.attackStartMs).toISOString():null },
      breakoutCandle:ev.breakout||null,
      failureCandle:ev.failure||null,
      m15Structure:{ breakLevel:(s.confirmation||{}).breakLevel, buffer:(s.confirmation||{}).m15Buffer, confirmedAt:(s.confirmation||{}).confirmAtMs?new Date((s.confirmation||{}).confirmAtMs).toISOString():null },
      scoreBreakdown:s.score||null,
      transitions:(ev.transitions||[]).map(function(t){return t.occurredAt+' → '+t.toState;})
    };
    return JSON.stringify(out,null,1);
  }

  function eventRow(ev, normMs, reason){
    var col=ev.direction==='BUY'?'#4ade80':'#f87171';
    var h='<div class="lf-card" style="border-left-color:'+col+'">';
    h+='<div class="lf-card-hd"><div><span class="lf-pair">'+ev.pair+'</span> <span class="lf-dir '+ev.direction+'">'+ev.direction+'</span></div>'
      +'<div class="lf-tag">'+(ev.setupType||'')+'</div></div>';
    h+='<div class="lf-rows">';
    h+=kv('Level',(ev.levelType||'—')+' '+px(ev.levelCentre));
    h+=kv('Failed side',ev.failedSide||'—');
    h+=kv(ev.breakoutAtMs?'Breakout':'Breach',fmtLocalT(ev.breakoutAtMs||ev.breachAtMs));
    h+=kv('State',ev.state||'—');
    if(reason) h+=kv('Reason',reason);
    h+=kv('Age',ageStr(ev.failureAtMs||ev.breachAtMs, normMs));
    h+='</div></div>';
    return h;
  }

  function group(title, count, inner){
    if(!count) return '';
    return '<div class="lf-group"><div class="lf-group-hd"><span>'+title+'</span><span class="lf-group-count">'+count+'</span></div><div class="lf-cards">'+inner+'</div></div>';
  }

  function renderSnapshot(d){
    renderHeading(d); renderSummary(d);
    var normMs=new Date(d.normalizedTime).getTime();
    var confirmed=d.confirmedSignals.slice().sort(function(a,b){return (b.score?b.score.total:0)-(a.score?a.score.total:0);});
    var html='';
    html+=group('Confirmed signals', confirmed.length, confirmed.map(function(s){return signalCard(s,normMs);}).join(''));
    html+=group('Watch candidates', d.watchCandidates.length, d.watchCandidates.map(function(s){return signalCard(s,normMs);}).join(''));
    html+=group('Delayed failures pending', d.pendingDelayedFailures.length, d.pendingDelayedFailures.map(function(e){return eventRow(e,normMs);}).join(''));
    html+=group('M15 confirmation pending', d.pendingM15Confirmations.length, d.pendingM15Confirmations.map(function(s){return signalCard(s,normMs);}).join(''));
    html+=group('Accepted breakouts', d.acceptedBreakouts.length, d.acceptedBreakouts.map(function(e){return eventRow(e,normMs);}).join(''));
    html+=group('Recently expired / invalidated', d.recentlyExpiredOrInvalidated.length, d.recentlyExpiredOrInvalidated.map(function(e){return eventRow(e,normMs,e.reason);}).join(''));

    var warns=[];
    if(d.partialDataWarnings.length) warns=warns.concat(d.partialDataWarnings.map(function(w){return w.pair+': '+w.warnings.join(', ');}));
    if(d.pairErrors.length) warns=warns.concat(d.pairErrors.map(function(w){return w.pair+': '+w.error;}));
    if(d.coverage && d.coverage.warnings && d.coverage.warnings.length) warns=warns.concat(d.coverage.warnings.map(function(w){return w.pair+': '+w.type;}));
    if(warns.length) html+='<div class="lf-group"><div class="lf-group-hd"><span>Missing-data warnings</span><span class="lf-group-count">'+warns.length+'</span></div><div class="lf-warn">'+warns.join(' · ')+'</div></div>';

    var totalSetups = confirmed.length+d.watchCandidates.length+d.pendingDelayedFailures.length+d.pendingM15Confirmations.length+d.acceptedBreakouts.length+d.recentlyExpiredOrInvalidated.length;
    document.getElementById('lf-body').innerHTML = totalSetups ? html : '<div class="lf-empty">No liquidity-failure setup existed at this market time.</div>';
  }

  // ── Mode + navigation ─────────────────────────────────────────────────────
  function setMode(m){
    if(m==='historical' && !COV){ document.getElementById('lf-body').innerHTML='<div class="lf-empty">Coverage still loading — one moment…</div>'; return; }
    MODE=m;
    document.getElementById('mode-latest').classList.toggle('active', m==='latest');
    document.getElementById('mode-hist').classList.toggle('active', m==='historical');
    document.getElementById('lf-selector').classList.toggle('show', m==='historical');
    if(m==='historical' && SELECTED_MS==null) SELECTED_MS = clampMs(snap15(COV.latestMs));
    if(m==='historical') syncSelectorInputs();
    updateNavDisabled();
    loadSnapshot();
  }
  function syncSelectorInputs(){
    var p=partsInTz(SELECTED_MS, tz());
    document.getElementById('sel-date').value = p.year+'-'+p.month+'-'+p.day;
    document.getElementById('sel-time').value = p.hour+':'+p.minute.slice(0,1)+ (['0','1','3','4'].indexOf(p.minute[0])>=0? '' : '');
    // ensure a valid 15-min option
    var mm = Math.floor(+p.minute/15)*15; document.getElementById('sel-time').value = p.hour+':'+('0'+mm).slice(-2);
  }
  function updateNavDisabled(){
    if(!COV) return;
    var atLatest = SELECTED_MS!=null && SELECTED_MS>=COV.latestMs;
    var atEarliest = SELECTED_MS!=null && SELECTED_MS<=COV.earliestMs;
    document.getElementById('nav-m-fwd').disabled = atLatest;
    document.getElementById('nav-h-fwd').disabled = atLatest;
    document.getElementById('nav-m-back').disabled = atEarliest;
    document.getElementById('nav-h-back').disabled = atEarliest;
  }
  function applySelector(){
    var dv=document.getElementById('sel-date').value, tv=document.getElementById('sel-time').value;
    if(!dv||!tv) return;
    var dp=dv.split('-'), tp=tv.split(':');
    var ms = snap15(zonedWallToUtcMs(+dp[0],+dp[1],+dp[2],+tp[0],+tp[1],tz()));
    if(ms<COV.earliestMs || ms>COV.latestMs){ renderError('Selected time is outside available coverage.'); return; }
    SELECTED_MS=ms; updateNavDisabled(); loadSnapshot();
  }
  function nudge(delta){
    SELECTED_MS = clampMs(snap15((SELECTED_MS==null?COV.latestMs:SELECTED_MS)+delta));
    syncSelectorInputs(); updateNavDisabled(); loadSnapshot();
  }

  // ── History table ─────────────────────────────────────────────────────────
  var HIST=[];
  var HCOLS=[['first_seen_at','Time'],['pair','Pair'],['direction','Dir'],['failedSide','Failed'],['setup_type','Setup'],['state','State'],['score','Score']];
  async function loadHistory(){
    var q=new URLSearchParams();
    var g=function(id){return document.getElementById(id).value.trim();};
    if(g('h-from')) q.set('from', g('h-from')); if(g('h-to')) q.set('to', g('h-to'));
    if(g('h-pair')) q.set('pair', g('h-pair').toUpperCase()); if(g('h-dir')) q.set('direction', g('h-dir'));
    if(g('h-side')) q.set('failedSide', g('h-side')); if(g('h-setup')) q.set('setupType', g('h-setup'));
    if(g('h-state')) q.set('state', g('h-state').toUpperCase()); if(g('h-score')) q.set('minimumScore', g('h-score'));
    q.set('limit','200');
    var tb=document.querySelector('#lf-histtable tbody');
    tb.innerHTML='<tr><td colspan="7" style="color:var(--text-dim)">Loading…</td></tr>';
    try{
      var res=await fetch('/api/liquidity-failure?action=history&'+q.toString(), auth());
      if(!res.ok) throw new Error(await res.text());
      var d=await res.json(); HIST=d.items||[]; renderHistory();
    }catch(e){ tb.innerHTML='<tr><td colspan="7" style="color:#f87171">'+(e.message||e)+'</td></tr>'; }
  }
  function renderHistory(){
    var thead=document.querySelector('#lf-histtable thead');
    thead.innerHTML='<tr>'+HCOLS.map(function(c){var arrow=HIST_SORT.key===c[0]?(HIST_SORT.dir<0?' ↓':' ↑'):''; return '<th data-k="'+c[0]+'">'+c[1]+arrow+'</th>';}).join('')+'</tr>';
    thead.querySelectorAll('th').forEach(function(th){ th.onclick=function(){ var k=th.getAttribute('data-k'); if(HIST_SORT.key===k) HIST_SORT.dir*=-1; else {HIST_SORT.key=k;HIST_SORT.dir=-1;} renderHistory(); }; });
    var rows=HIST.slice().sort(function(a,b){
      var k=HIST_SORT.key, av=k==='failedSide'?((a.payload||{}).failedSide||''):a[k], bv=k==='failedSide'?((b.payload||{}).failedSide||''):b[k];
      if(av<bv) return -1*HIST_SORT.dir; if(av>bv) return 1*HIST_SORT.dir; return 0;
    });
    var tb=document.querySelector('#lf-histtable tbody');
    if(!rows.length){ tb.innerHTML='<tr><td colspan="7" style="color:var(--text-dim)">No signals in this date range — widen the dates above.</td></tr>'; return; }
    tb.innerHTML=rows.map(function(r){
      return '<tr><td>'+fmtLocal(new Date(r.first_seen_at).getTime())+'</td><td>'+r.pair+'</td><td>'+r.direction+'</td><td>'+((r.payload||{}).failedSide||'—')+'</td><td>'+r.setup_type+'</td><td>'+r.state+'</td><td>'+(r.score!=null?r.score:'—')+'</td></tr>';
    }).join('');
  }

  // ── Wiring ────────────────────────────────────────────────────────────────
  document.getElementById('mode-latest').onclick=function(){ SELECTED_MS=null; setMode('latest'); };
  document.getElementById('mode-hist').onclick=function(){ setMode('historical'); };
  document.getElementById('sel-apply').onclick=applySelector;
  document.getElementById('sel-latest').onclick=function(){ SELECTED_MS=null; setMode('latest'); };
  document.getElementById('nav-m-back').onclick=function(){ nudge(-M15); };
  document.getElementById('nav-m-fwd').onclick=function(){ nudge(M15); };
  document.getElementById('nav-h-back').onclick=function(){ nudge(-HOUR); };
  document.getElementById('nav-h-fwd').onclick=function(){ nudge(HOUR); };
  document.getElementById('sel-tz').onchange=function(){ try{localStorage.setItem('nfx_tz',document.getElementById('sel-tz').value);}catch(_){} if(COV) loadSnapshot(); if(MODE==='historical') syncSelectorInputs(); };
  document.getElementById('h-apply').onclick=loadHistory;

  // Fast default landing: recent signals from the DB (History); the heavy live
  // 28-pair snapshot is opt-in via a button or the mode tabs.
  function defaultView(){
    MODE='latest';
    document.getElementById('mode-latest').classList.add('active');
    document.getElementById('mode-hist').classList.remove('active');
    document.getElementById('lf-selector').classList.remove('show');
    var to=new Date(); var from=new Date(to.getTime()-7*24*3600*1000);
    document.getElementById('h-from').value=from.toISOString().slice(0,10);
    document.getElementById('h-to').value=to.toISOString().slice(0,10);
    loadHistory();
    document.getElementById('lf-heading').innerHTML='';
    document.getElementById('lf-summary').innerHTML='';
    document.getElementById('lf-body').innerHTML='<div class="lf-empty">Recent signals are listed in <b>History</b> below.'
      +'<div style="margin-top:12px"><button class="lf-btn" id="run-latest">Load latest live snapshot →</button>'
      +'<div style="margin-top:6px;font-size:11px;color:var(--text-dim)">Scans all 28 pairs live — takes a few seconds. Or use <b>Historical Replay</b> to evaluate a past date/time.</div></div></div>';
    var b=document.getElementById('run-latest'); if(b) b.onclick=function(){ SELECTED_MS=null; setMode('latest'); };
  }

  (function(){
    // Render the fast default immediately — never block the page on coverage.
    defaultView();
    var atParam=new URL(window.location.href).searchParams.get('at');
    // Background: timezone profile + coverage; then honour a shared ?at= link.
    (async function(){
      try { if(TOKEN){ var r=await fetch('/api/profile', auth()); if(r.ok){ var p=await r.json(); if(p.timezone){ USER_TZ=p.timezone; try{localStorage.setItem('nfx_tz',USER_TZ);}catch(_){}}}} } catch(_){}
      try { await loadCoverage(); } catch(e){ document.getElementById('lf-coverage').innerHTML='<span style="color:#f87171">Coverage error: '+(e.message||e)+'</span>'; return; }
      if(atParam){ var ms=new Date(atParam).getTime(); if(!isNaN(ms)){ SELECTED_MS=clampMs(snap15(ms)); setMode('historical'); } }
    })();
  })();
</script>
</body>
</html>
