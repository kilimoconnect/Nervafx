<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>NervaFX — H1 Clean Break</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/auth-guard.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .grid { display: block !important; }

    .sx-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px;
      background: rgba(8,11,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .sx-topbar-left { display: flex; align-items: center; gap: 12px; }
    .sx-logo img { height: 24px; display: block; }
    .sx-sep { color: rgba(255,255,255,0.1); font-size: 20px; font-weight: 200; }
    .sx-title-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .sx-back-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: none;
    }
    .sx-back-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

    .sx-main { max-width: 1000px; margin: 0 auto; padding: 20px 20px 80px; }

    /* Filter bar */
    .sx-card {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; margin-bottom: 18px; overflow: hidden;
    }
    .sx-card-hd {
      padding: 12px 16px; font-size: 12px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .sx-card-hd i { width: 15px; height: 15px; }

    .sx-ctrls { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: wrap; }
    .sx-btn {
      padding: 4px 12px; border-radius: 7px; font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .sx-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .sx-btn.active { background: rgba(96,165,250,0.15); border-color: rgba(96,165,250,0.5); color: #60a5fa; }
    .sx-ctrl-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.1); }
    .sx-note { font-size: 10.5px; color: var(--text-dim); text-transform: none; letter-spacing: 0; font-weight: 500; }
    .sx-date-input {
      padding: 4px 8px; border-radius: 7px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-family: inherit; outline: none;
      transition: all 0.15s; cursor: pointer;
    }
    .sx-date-input:focus { border-color: rgba(96,165,250,0.5); color: var(--text); }
    .sx-date-input::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }

    .sx-loading { display: flex; align-items: center; gap: 8px; padding: 40px; color: var(--text-muted); font-size: 12px; justify-content: center; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #60a5fa; border-radius: 50%; animation: sxspin 0.7s linear infinite;
    }
    @keyframes sxspin { to { transform: rotate(360deg); } }
    .br-empty { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 13px; }

    /* Hour card */
    .cb-card {
      background: rgba(255,255,255,0.015); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; margin-bottom: 12px; overflow: hidden;
    }
    .cb-card-hd {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex-wrap: wrap;
    }
    .cb-time { font-size: 13px; font-weight: 800; color: var(--text); }
    .cb-date { font-size: 11px; color: var(--text-muted); }
    .cb-count {
      font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 5px;
    }
    .cb-count.buy { background: rgba(34,197,94,0.12); color: #4ade80; }
    .cb-count.sell { background: rgba(239,68,68,0.12); color: #f87171; }
    .cb-truncated {
      margin-left: auto;
      font-size: 10px; font-weight: 600; color: var(--text-dim);
      padding: 3px 8px; border-radius: 5px;
      background: rgba(255,255,255,0.04);
    }

    .cb-body { padding: 8px 12px 12px; display: grid; grid-template-columns: 1fr; gap: 6px; }

    .cb-sig {
      display: grid; grid-template-columns: 70px 44px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .cb-sig.BUY { border-left: 3px solid #22c55e; }
    .cb-sig.SELL { border-left: 3px solid #ef4444; }

    .cb-pair { font-size: 13px; font-weight: 800; color: var(--text); }
    .cb-dir {
      font-size: 9px; font-weight: 800; padding: 3px 6px; border-radius: 4px;
      letter-spacing: 0.4px; text-align: center;
    }
    .cb-dir.BUY { background: rgba(34,197,94,0.15); color: #4ade80; }
    .cb-dir.SELL { background: rgba(239,68,68,0.15); color: #f87171; }

    .cb-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 10px; color: var(--text-dim); }
    .cb-meta-item { white-space: nowrap; }
    .cb-meta-item b { color: var(--text-muted); font-weight: 700; }
    .cb-meta-item .pos { color: #4ade80; }
    .cb-meta-item .neg { color: #f87171; }

    .cb-m15 { display: flex; gap: 3px; align-items: end; height: 28px; }
    .cb-m15-bar { width: 8px; border-radius: 2px; }
    .cb-m15-bar.bull { background: linear-gradient(180deg, #4ade80, #22c55e); }
    .cb-m15-bar.bear { background: linear-gradient(0deg, #f87171, #ef4444); }

    .cb-outcome {
      font-size: 9.5px; font-weight: 700; padding: 3px 7px; border-radius: 5px;
      white-space: nowrap; letter-spacing: 0.3px;
    }
    .cb-outcome.win  { background: rgba(34,197,94,0.15);  color: #4ade80; }
    .cb-outcome.loss { background: rgba(239,68,68,0.15);  color: #f87171; }
    .cb-outcome.pending { background: rgba(255,255,255,0.06); color: var(--text-dim); }

    /* Ranking table */
    .rank-card {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; margin-bottom: 18px; overflow: hidden;
    }
    .rank-hd {
      padding: 10px 14px; font-size: 11px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; gap: 8px;
    }
    .rank-note { font-size: 10.5px; color: var(--text-dim); text-transform: none; letter-spacing: 0; font-weight: 500; }
    .rank-body { padding: 10px 14px; }
    .rank-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .rank-table th {
      text-align: left; font-size: 10px; font-weight: 700;
      color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px;
      padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .rank-table th.num, .rank-table td.num { text-align: right; font-family: var(--font-data); }
    .rank-table td {
      padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,0.03);
      color: var(--text-muted);
    }
    .rank-table tr:last-child td { border-bottom: none; }
    .rank-pair { font-weight: 800; color: var(--text); }
    .rank-hit.high { color: #4ade80; }
    .rank-hit.mid  { color: #facc15; }
    .rank-hit.low  { color: #f87171; }
    .rank-pips.pos { color: #4ade80; }
    .rank-pips.neg { color: #f87171; }
    .rank-pending  { color: var(--text-dim); font-size: 10px; }

    @media (max-width: 640px) {
      .sx-ctrls { width: 100%; margin-left: 0; }
      .cb-sig {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "pair dir"
          "meta meta"
          "m15  m15";
      }
      .cb-pair { grid-area: pair; }
      .cb-dir { grid-area: dir; }
      .cb-meta { grid-area: meta; }
      .cb-m15 { grid-area: m15; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="sx-topbar">
    <div class="sx-topbar-left">
      <a class="sx-logo" href="/app"><img src="/nervafx-logo.png" alt="NervaFX" onerror="this.style.display='none'"></a>
      <span class="sx-sep">/</span>
      <span class="sx-title-text">H1 Clean Break</span>
    </div>
    <a class="sx-back-btn" href="/app" onclick="window.close(); setTimeout(function(){ location.href='/app'; }, 150); return false;">&times; Close</a>
  </div>

  <main class="sx-main">
    <div class="sx-card">
      <div class="sx-card-hd">
        <i data-lucide="zap"></i> H1 Clean Break — H1 breaks structure AND all 4 M15s align
        <span class="sx-note">Max 5 pairs per hour · newest first</span>
        <span class="sx-ctrls">
          <button class="sx-btn sx-days active" data-days="1">1D</button>
          <button class="sx-btn sx-days" data-days="2">2D</button>
          <button class="sx-btn sx-days" data-days="5">5D</button>
          <button class="sx-btn sx-days" data-days="10">10D</button>
          <button class="sx-btn sx-days" data-days="30">30D</button>
          <span class="sx-ctrl-sep"></span>
          <button class="sx-btn sx-dir active" data-dir="all">All</button>
          <button class="sx-btn sx-dir" data-dir="BUY">BUY</button>
          <button class="sx-btn sx-dir" data-dir="SELL">SELL</button>
          <span class="sx-ctrl-sep"></span>
          <input type="date" class="sx-date-input" id="sx-date-from" title="From date">
          <input type="date" class="sx-date-input" id="sx-date-to" title="To date">
          <button class="sx-btn" id="sx-date-go">Go</button>
        </span>
      </div>
    </div>

    <div id="cb-cards">
      <div class="sx-loading"><span class="spinner"></span> Loading…</div>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      var TOKEN = localStorage.getItem('nfx_token');
      if (!TOKEN) { location.href = '/login'; return; }

      var _userTz = localStorage.getItem('nfx_tz') || 'auto';
      function _tz() { return (_userTz === 'auto') ? Intl.DateTimeFormat().resolvedOptions().timeZone : (_userTz || 'UTC'); }

      async function loadProfileTz() {
        try {
          var r = await fetch('/api/profile', { headers: { Authorization: 'Bearer ' + TOKEN } });
          if (!r.ok) return;
          var p = await r.json();
          if (p.timezone) {
            _userTz = (p.timezone === 'UTC') ? 'auto' : p.timezone;
            try { localStorage.setItem('nfx_tz', _userTz); } catch (_) {}
          }
        } catch (_) {}
      }

      var currentDays = 1;
      var currentDir = 'all';
      var cachedRows = [];
      var cachedRanking = [];
      var MAX_PAIRS_PER_CARD = 5;

      function hrLabel(iso) {
        return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: _tz() });
      }
      function dayLabel(iso) {
        return new Date(iso).toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', timeZone: _tz() });
      }
      function isWeekend(iso) {
        var d = new Date(iso).getUTCDay();
        return d === 0 || d === 6;
      }

      function m15Bars(m15s) {
        if (!m15s || !m15s.length) return '';
        var maxBody = 0;
        for (var i = 0; i < m15s.length; i++) {
          if (m15s[i].bodyPips > maxBody) maxBody = m15s[i].bodyPips;
        }
        if (maxBody === 0) maxBody = 1;
        var html = '';
        for (var i = 0; i < m15s.length; i++) {
          var c = m15s[i];
          var h = Math.max(4, Math.round((c.bodyPips / maxBody) * 28));
          var cls = c.bull ? 'bull' : 'bear';
          html += '<div class="cb-m15-bar ' + cls + '" style="height:' + h + 'px" title="' + hrLabel(c.time) + ' — ' + (c.bull ? 'BULL' : 'BEAR') + ' ' + c.bodyPips + ' pips"></div>';
        }
        return html;
      }

      function renderRanking(ranking) {
        var el = document.getElementById('rank-container');
        if (!ranking || !ranking.length) { el.innerHTML = ''; return; }

        var html = '<div class="rank-card">';
        html += '<div class="rank-hd">';
        html += '<i data-lucide="bar-chart-3" style="width:14px;height:14px"></i> Pair Performance';
        html += '<span class="rank-note">Follow-through 4 H1s after each signal — final close vs signal close</span>';
        html += '</div>';
        html += '<div class="rank-body">';
        html += '<table class="rank-table">';
        html += '<thead><tr>';
        html += '<th>#</th><th>Pair</th>';
        html += '<th class="num">Signals</th>';
        html += '<th class="num">Buy/Sell</th>';
        html += '<th class="num">Wins</th>';
        html += '<th class="num">Hit %</th>';
        html += '<th class="num">Avg pips</th>';
        html += '<th class="num">Total pips</th>';
        html += '</tr></thead><tbody>';
        for (var i = 0; i < ranking.length; i++) {
          var r = ranking[i];
          var hitCls = r.hitRate == null ? '' : (r.hitRate >= 65 ? 'high' : r.hitRate >= 45 ? 'mid' : 'low');
          var avgCls = r.avgPips > 0 ? 'pos' : r.avgPips < 0 ? 'neg' : '';
          var totCls = r.totalPips > 0 ? 'pos' : r.totalPips < 0 ? 'neg' : '';
          html += '<tr>';
          html += '<td class="num">' + (i + 1) + '</td>';
          html += '<td class="rank-pair">' + r.pair + '</td>';
          html += '<td class="num">' + r.total + (r.pending ? ' <span class="rank-pending">(' + r.pending + ' pending)</span>' : '') + '</td>';
          html += '<td class="num">' + r.buy + '/' + r.sell + '</td>';
          html += '<td class="num">' + r.wins + '/' + r.settled + '</td>';
          html += '<td class="num rank-hit ' + hitCls + '">' + (r.hitRate == null ? '—' : r.hitRate + '%') + '</td>';
          html += '<td class="num rank-pips ' + avgCls + '">' + (r.avgPips > 0 ? '+' : '') + r.avgPips + '</td>';
          html += '<td class="num rank-pips ' + totCls + '">' + (r.totalPips > 0 ? '+' : '') + r.totalPips + '</td>';
          html += '</tr>';
        }
        html += '</tbody></table></div></div>';
        el.innerHTML = html;
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }

      function renderCards(rows) {
        var el = document.getElementById('cb-cards');
        if (!rows.length) {
          el.innerHTML = '<div class="br-empty">No clean H1 break signals found for this period.</div>';
          return;
        }

        var html = '';
        var shownAny = false;

        for (var r = 0; r < rows.length; r++) {
          var row = rows[r];
          if (isWeekend(row.time)) continue;

          // Only show hours where at least 5 pairs qualified
          if (row.signals.length < MAX_PAIRS_PER_CARD) continue;

          var sigs = row.signals;
          if (currentDir !== 'all') {
            sigs = sigs.filter(function(s) { return s.direction === currentDir; });
          }
          if (!sigs.length) continue;

          var total = sigs.length;
          var truncated = total > MAX_PAIRS_PER_CARD;
          var shown = sigs.slice(0, MAX_PAIRS_PER_CARD);
          shownAny = true;

          var buyShown = shown.filter(function(s) { return s.direction === 'BUY'; }).length;
          var sellShown = shown.length - buyShown;

          html += '<div class="cb-card">';
          html += '<div class="cb-card-hd">';
          html += '<span class="cb-time">' + hrLabel(row.time) + '</span>';
          html += '<span class="cb-date">' + dayLabel(row.time) + '</span>';
          if (buyShown) html += '<span class="cb-count buy">' + buyShown + ' BUY</span>';
          if (sellShown) html += '<span class="cb-count sell">' + sellShown + ' SELL</span>';
          if (truncated) html += '<span class="cb-truncated">+' + (total - MAX_PAIRS_PER_CARD) + ' more</span>';
          html += '</div>';

          html += '<div class="cb-body">';
          for (var i = 0; i < shown.length; i++) {
            var s = shown[i];
            var brkLabel = s.direction === 'BUY' ? 'BRK HH' : 'BRK LL';
            var dirCls = s.direction === 'BUY' ? 'pos' : 'neg';
            var digits = s.pair.indexOf('JPY') > -1 ? 3 : 5;
            html += '<div class="cb-sig ' + s.direction + '">';
            html += '<span class="cb-pair">' + s.pair + '</span>';
            html += '<span class="cb-dir ' + s.direction + '">' + s.direction + '</span>';
            html += '<div class="cb-meta">';
            html += '<span class="cb-meta-item"><b>' + brkLabel + '</b> ' + Number(s.breakLevel).toFixed(digits) + '</span>';
            html += '<span class="cb-meta-item">Body <b class="' + dirCls + '">' + s.h1.bodyPips + '</b> pips (' + s.h1.bodyPct + '%)</span>';
            html += '<span class="cb-meta-item">Range <b>' + s.h1.rangePips + '</b> pips</span>';
            html += '</div>';
            html += '<div class="cb-m15">' + m15Bars(s.m15) + '</div>';
            html += '</div>';
          }
          html += '</div>';
          html += '</div>';
        }

        el.innerHTML = shownAny ? html : '<div class="br-empty">No clean H1 break signals found for this period.</div>';
      }

      async function load() {
        document.getElementById('cb-cards').innerHTML = '<div class="sx-loading"><span class="spinner"></span> Loading…</div>';

        var fromEl = document.getElementById('sx-date-from');
        var toEl = document.getElementById('sx-date-to');
        var qs;
        if (fromEl.value && toEl.value) {
          qs = 'from=' + fromEl.value + '&to=' + toEl.value;
        } else {
          qs = 'days=' + currentDays;
        }

        try {
          var res = await fetch('/api/h1-clean-break?' + qs, {
            headers: { Authorization: 'Bearer ' + TOKEN },
            cache: 'no-store',
          });
          if (!res.ok) throw new Error(await res.text());
          var json = await res.json();
          cachedRows = json.rows || [];
          renderCards(cachedRows);
        } catch (e) {
          document.getElementById('cb-cards').innerHTML =
            '<div class="br-empty" style="color:#f87171">Error: ' + e.message + '</div>';
        }
      }

      document.querySelectorAll('.sx-days').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.sx-days').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentDays = parseInt(btn.dataset.days, 10);
          document.getElementById('sx-date-from').value = '';
          document.getElementById('sx-date-to').value = '';
          load();
        });
      });

      document.querySelectorAll('.sx-dir').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.sx-dir').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentDir = btn.dataset.dir;
          renderCards(cachedRows);
        });
      });

      document.getElementById('sx-date-go').addEventListener('click', function() {
        document.querySelectorAll('.sx-days').forEach(function(b) { b.classList.remove('active'); });
        load();
      });

      lucide.createIcons();

      loadProfileTz().then(function() { load(); });

      // Auto-refresh aligned to the 15m data cron (fires at :04, :19, :34, :49)
      function scheduleAlignedRefresh() {
        var now = new Date();
        var cycle = now.getUTCMinutes() % 15;
        var minutesUntil = (4 - cycle + 15) % 15;
        var delay = (minutesUntil * 60 - now.getUTCSeconds()) * 1000;
        if (delay <= 0) delay += 15 * 60 * 1000;
        setTimeout(function() {
          var fromEl = document.getElementById('sx-date-from');
          if (!fromEl.value) load();
          scheduleAlignedRefresh();
        }, delay);
      }
      scheduleAlignedRefresh();
    })();
  </script>
</body>
</html>
