<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>NervaFX — H1 Quality</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .grid { display: block !important; }
    .sx-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px;
      background: rgba(8,11,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .sx-topbar-left { display: flex; align-items: center; gap: 12px; }
    .sx-logo img { height: 24px; display: block; }
    .sx-sep { color: rgba(255,255,255,0.1); font-size: 20px; font-weight: 200; }
    .sx-title-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .sx-back-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-size: 11px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.15s;
    }
    .sx-back-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }
    .sx-main { max-width: 800px; margin: 0 auto; padding: 20px 16px 80px; }

    .mq-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .mq-filter-btn {
      padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .mq-filter-btn:hover { background: rgba(255,255,255,0.08); }
    .mq-filter-btn.active { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.4); color: #f59e0b; }

    .mq-snap {
      margin-bottom: 14px; border-radius: 10px; overflow: hidden;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .mq-snap-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .mq-snap-time { font-size: 13px; font-weight: 800; }
    .mq-snap-meta { display: flex; gap: 10px; align-items: center; font-size: 10px; color: var(--text-muted); }
    .mq-snap-meta b { font-weight: 700; }

    .mq-session-tag {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
    }
    .mq-session-tag.asia { background: rgba(234,179,8,0.15); color: #eab308; }
    .mq-session-tag.london { background: rgba(59,130,246,0.15); color: #3b82f6; }
    .mq-session-tag.new_york { background: rgba(168,85,247,0.15); color: #a855f7; }

    .mq-pair-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .mq-pair-row:last-child { border-bottom: none; }
    .mq-rank { font-size: 11px; font-weight: 800; color: var(--text-muted); min-width: 18px; }
    .mq-pair-name { font-size: 13px; font-weight: 800; min-width: 76px; }
    .mq-dir-tag {
      font-size: 10px; font-weight: 800; min-width: 40px;
      padding: 2px 6px; border-radius: 4px; text-align: center;
    }
    .mq-dir-tag.buy { background: rgba(34,197,94,0.12); color: #22c55e; }
    .mq-dir-tag.sell { background: rgba(239,68,68,0.12); color: #ef4444; }
    .mq-dir-tag.neutral { background: rgba(255,255,255,0.05); color: var(--text-muted); }

    .mq-q-score { font-size: 14px; font-weight: 800; min-width: 40px; text-align: right; }
    .mq-badge {
      display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700;
    }
    .mq-badge.very_clean { background: rgba(34,197,94,0.15); color: #22c55e; }
    .mq-badge.tradeable { background: rgba(59,130,246,0.15); color: #3b82f6; }
    .mq-badge.weak { background: rgba(234,179,8,0.15); color: #eab308; }
    .mq-badge.choppy { background: rgba(239,68,68,0.15); color: #ef4444; }

    .mq-entry-badge {
      font-size: 8px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
      background: rgba(34,197,94,0.2); color: #22c55e;
    }
    .mq-trend-badge {
      font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 4px;
      background: rgba(251,191,36,0.25); color: #fbbf24;
      text-transform: uppercase; letter-spacing: 0.5px;
      animation: trendPulse 2s ease-in-out infinite;
    }
    @keyframes trendPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.3); }
      50% { box-shadow: 0 0 8px 2px rgba(251,191,36,0.4); }
    }
    .mq-pair-row.mq-trending {
      background: linear-gradient(90deg, rgba(251,191,36,0.12) 0%, rgba(251,191,36,0.04) 100%);
      border-left: 3px solid #fbbf24;
      box-shadow: inset 0 0 20px rgba(251,191,36,0.06);
    }
    .mq-pair-row.mq-trending .mq-pair-name { color: #fbbf24; }
    .mq-pair-row.mq-trending .mq-q-score { text-shadow: 0 0 6px currentColor; }

    .mq-metrics {
      display: flex; gap: 8px; flex: 1; font-size: 9px; color: var(--text-muted);
    }
    .mq-metrics b { color: rgba(255,255,255,0.7); font-weight: 700; }

    .mq-bar-bg { width: 60px; height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .mq-bar-fill { height: 100%; border-radius: 3px; }

    .mq-loading { text-align: center; padding: 60px; color: var(--text-muted); font-size: 13px; }
    .mq-loading .spin { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="sx-topbar">
  <div class="sx-topbar-left">
    <a href="/app" class="sx-logo"><img src="/nervafx-logo.png" alt="NervaFX" /></a>
    <span class="sx-sep">/</span>
    <span class="sx-title-text">H1 Quality</span>
  </div>
  <a href="/app" class="sx-back-btn">Dashboard</a>
</div>

<div class="sx-main" id="mq-root">
  <div class="mq-loading" id="mq-loading"><span class="spin"></span> Analyzing H1 candle quality…</div>
</div>

<script>
const SUPABASE_URL = 'https://lfmhnelejjrpqfbvosmt.supabase.co';
let _mqData = null;
let _mqHours = 168;
let _mqSessionFilter = 'ALL';

async function api(path) {
  let token = localStorage.getItem('nfx_token');
  let res = await fetch(path, { headers: { Authorization: `Bearer ${token}` } });
  if (res.status === 401) {
    const refresh = localStorage.getItem('nfx_refresh');
    if (refresh) {
      const r2 = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmbWhuZWxlanpycHFmYnZvc210Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM2MTcxMTYsImV4cCI6MjA1OTE5MzExNn0.5T424U9jEgMLVreKMFCJ_7oVBGhFB96MvOi0k38_BPc' },
        body: JSON.stringify({ refresh_token: refresh }),
      });
      if (r2.ok) {
        const t = await r2.json();
        localStorage.setItem('nfx_token', t.access_token);
        localStorage.setItem('nfx_refresh', t.refresh_token);
        token = t.access_token;
        res = await fetch(path, { headers: { Authorization: `Bearer ${token}` } });
      }
    }
  }
  if (res.status === 401) { location.href = '/login'; return null; }
  if (!res.ok) throw new Error(`API ${res.status}`);
  return res.json();
}

async function loadData() {
  try {
    document.getElementById('mq-root').innerHTML = '<div class="mq-loading"><span class="spin"></span> Analyzing H1 candle quality…</div>';
    _mqData = await api(`/api/structure-break?hours=${_mqHours}`);
    if (!_mqData) return;
    render();
  } catch (e) {
    document.getElementById('mq-root').innerHTML = `<div class="mq-loading"><span style="color:#ef4444">Error: ${e.message}</span></div>`;
  }
}

function qColor(cls) {
  return cls === 'VERY_CLEAN' ? '#22c55e' : cls === 'TRADEABLE' ? '#3b82f6' : cls === 'WEAK' ? '#eab308' : '#ef4444';
}

function fmtTime(iso) {
  const d = new Date(iso);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const day = days[d.getDay()];
  const dd = d.getDate();
  const mon = months[d.getMonth()];
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${day} ${dd} ${mon} · ${hh}:${mm}`;
}

function render() {
  const root = document.getElementById('mq-root');
  const d = _mqData;
  if (!d || !d.timeline.length) { root.innerHTML = '<div class="mq-loading">No H1 data available</div>'; return; }

  let html = '';

  // Filters
  html += '<div class="mq-filters">';
  for (const [label, hrs] of [['24H',24],['3D',72],['7D',168],['14D',336],['30D',720]]) {
    html += `<button class="mq-filter-btn ${_mqHours===hrs?'active':''}" onclick="_mqHours=${hrs};loadData()">${label}</button>`;
  }
  html += '<span style="width:12px"></span>';
  for (const s of ['ALL','ASIA','LONDON','NEW_YORK']) {
    html += `<button class="mq-filter-btn ${_mqSessionFilter===s?'active':''}" onclick="_mqSessionFilter='${s}';render()">${s === 'ALL' ? 'All' : s.replace('_',' ')}</button>`;
  }
  html += '</div>';

  // Timeline
  let timeline = d.timeline;
  if (_mqSessionFilter !== 'ALL') timeline = timeline.filter(s => s.session === _mqSessionFilter);

  for (const snap of timeline) {
    const sessClass = snap.session.toLowerCase();
    const avgColor = qColor(snap.avgQuality >= 45 ? 'TRADEABLE' : snap.avgQuality >= 30 ? 'WEAK' : 'CHOPPY');

    html += `<div class="mq-snap">`;
    html += `<div class="mq-snap-hd">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="mq-snap-time">${fmtTime(snap.time)}</span>
        <span class="mq-session-tag ${sessClass}">${snap.session.replace('_',' ')}</span>
      </div>
      <div class="mq-snap-meta">
        <span>avg <b style="color:${avgColor}">${snap.avgQuality}%</b></span>
        <span>clean <b style="color:#22c55e">${snap.veryClean}</b></span>
        <span>entry <b style="color:#22c55e">${snap.entryCount}</b></span>
      </div>
    </div>`;

    for (let i = 0; i < snap.top5.length; i++) {
      const p = snap.top5[i];
      const cls = p.classification.toLowerCase();
      const dc = p.direction === 'BULLISH' ? 'buy' : p.direction === 'BEARISH' ? 'sell' : 'neutral';
      const barColor = qColor(p.classification);
      const entryBadge = p.entryValid ? ' <span class="mq-entry-badge">ENTRY</span>' : '';
      const isTrending = p.trending;
      const trendBadge = isTrending ? ' <span class="mq-trend-badge">▲ 2x</span>' : '';

      html += `<div class="mq-pair-row${isTrending ? ' mq-trending' : ''}">
        <span class="mq-rank">${i + 1}</span>
        <span class="mq-pair-name">${p.pair.replace('_','/')}</span>
        <span class="mq-dir-tag ${dc}">${p.direction === 'BULLISH' ? 'BUY' : p.direction === 'BEARISH' ? 'SELL' : '—'}</span>
        <span class="mq-q-score" style="color:${barColor}">${p.quality}%</span>
        <span class="mq-badge ${cls}">${p.classification.replace('_',' ')}</span>${entryBadge}${trendBadge}
        <span class="mq-metrics">
          <span>D:<b>${p.directionScore > 0 ? '+' : ''}${p.directionScore}</b></span>
          <span>I:<b>${p.impulseStrength}</b></span>
          <span>W:<b>${p.wickCleanliness}</b></span>
        </span>
        <div class="mq-bar-bg"><div class="mq-bar-fill" style="width:${p.quality}%;background:${barColor}"></div></div>
      </div>`;
    }

    html += '</div>';
  }

  root.innerHTML = html;
}

(async () => {
  const token = localStorage.getItem('nfx_token');
  if (!token) { location.href = '/login'; return; }
  await loadData();
})();
</script>
</body>
</html>
