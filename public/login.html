<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NervaFX — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080b12;
      --card:    rgba(11, 14, 22, 0.92);
      --border:  rgba(255,255,255,0.07);
      --accent:  #3b82f6;
      --text:    #f1f5f9;
      --muted:   #64748b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Animated background ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      will-change: transform;
      animation: orb-drift 28s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 650px; height: 650px;
      background: radial-gradient(circle, rgba(37,99,235,0.35), transparent 70%);
      top: -180px; left: -180px;
      animation-duration: 24s;
    }
    .orb-2 {
      width: 550px; height: 550px;
      background: radial-gradient(circle, rgba(139,92,246,0.28), transparent 70%);
      bottom: -160px; right: -160px;
      animation-duration: 32s;
      animation-delay: -12s;
    }
    .orb-3 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(6,182,212,0.2), transparent 70%);
      top: 45%; left: 55%;
      animation-duration: 20s;
      animation-delay: -6s;
    }

    @keyframes orb-drift {
      0%   { transform: translate(0px, 0px) scale(1); }
      30%  { transform: translate(40px, -35px) scale(1.06); }
      70%  { transform: translate(-25px, 30px) scale(0.94); }
      100% { transform: translate(15px, -15px) scale(1.02); }
    }

    /* ── Dot grid ── */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 100%);
    }

    /* ── Page ── */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Logo ── */
    .logo-wrap {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
      line-height: 1;
    }
    .logo .fx {
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    /* ── Auth card ── */
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 36px 32px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 24px 64px rgba(0,0,0,0.55),
        0 0 0 1px rgba(59,130,246,0.08);
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
      position: relative;
    }
    .tab-pill {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-radius: 9px;
      box-shadow: 0 2px 16px rgba(79,70,229,0.4);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .tab-pill.right { transform: translateX(100%); }

    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      border-radius: 9px;
      cursor: pointer;
      border: none;
      background: none;
      position: relative;
      z-index: 1;
      transition: color 0.22s;
    }
    .tab.active { color: #fff; }

    /* ── Fields ── */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.7px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    /* Two fields side by side */
    .fields-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.35;
      pointer-events: none;
      font-size: 14px;
    }
    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 11px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 12px 14px 12px 38px;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .input-wrap input:focus {
      border-color: rgba(59,130,246,0.6);
      background: rgba(59,130,246,0.06);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.14);
    }
    .input-wrap input::placeholder { color: rgba(100,116,139,0.4); }
    /* Password match states */
    .input-wrap input.pw-match   { border-color: rgba(34,197,94,0.6) !important; background: rgba(34,197,94,0.05) !important; }
    .input-wrap input.pw-nomatch { border-color: rgba(239,68,68,0.6) !important; background: rgba(239,68,68,0.05) !important; }

    /* ── Signup-only fields (animated) ── */
    .signup-fields {
      overflow: hidden;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .signup-fields.visible {
      pointer-events: auto;
    }

    /* ── Password strength bar ── */
    .pw-strength-wrap {
      margin-top: 6px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .pw-strength-bar {
      flex: 1;
      height: 3px;
      border-radius: 3px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .pw-strength-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s, background 0.3s;
      width: 0%;
    }
    .pw-strength-label {
      font-size: 10px;
      font-weight: 600;
      min-width: 44px;
      text-align: right;
      color: var(--muted);
      transition: color 0.3s;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 20px 0;
    }

    /* ── Button ── */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      color: #fff;
      border: none;
      border-radius: 11px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.12s, box-shadow 0.2s, opacity 0.15s;
      box-shadow: 0 4px 24px rgba(37,99,235,0.38);
      letter-spacing: 0.1px;
    }
    /* Shimmer on hover */
    .btn-submit::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.18) 50%, transparent 65%);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(37,99,235,0.5); }
    .btn-submit:hover::before { transform: translateX(100%); }
    .btn-submit:active { transform: scale(0.99) translateY(0); }
    .btn-submit:disabled { opacity: 0.45; cursor: default; transform: none; pointer-events: none; }

    /* ── Messages ── */
    .msg {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.5;
      display: none;
    }
    .msg.show-error   { display: block; background: rgba(239,68,68,0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); animation: rise 0.25s ease; }
    .msg.show-success { display: block; background: rgba(34,197,94,0.1); color: #86efac;  border: 1px solid rgba(34,197,94,0.2);  animation: rise 0.25s ease; }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      vertical-align: middle;
      margin-right: 7px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .auth-footer {
      margin-top: 22px;
      font-size: 11px;
      color: rgba(100,116,139,0.45);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .auth-footer-dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(100,116,139,0.3); }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 22px 24px; border-radius: 16px; }
      .logo { font-size: 28px; }
    }
  </style>
</head>
<body>

  <!-- Ambient background -->
  <div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="grid-overlay"></div>

  <div class="page">

    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo">Nerva<span class="fx">FX</span></div>
      <div class="tagline">Currency Strength Engine</div>
    </div>

    <!-- Card -->
    <div class="auth-card">

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab-pill" id="tab-pill"></div>
        <button class="tab active" id="tab-login"  onclick="switchTab('login')">Sign In</button>
        <button class="tab"        id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Form -->
      <form id="auth-form" onsubmit="handleSubmit(event)" novalidate>

        <!-- ── Signup-only: Name row (animated in) ── -->
        <div class="signup-fields" id="signup-fields">
          <div class="fields-row" style="margin-bottom:16px">
            <div class="field" style="margin-bottom:0">
              <label for="first-name">First Name</label>
              <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input id="first-name" type="text" placeholder="John"
                       autocomplete="given-name" />
              </div>
            </div>
            <div class="field" style="margin-bottom:0">
              <label for="last-name">Last Name</label>
              <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input id="last-name" type="text" placeholder="Doe"
                       autocomplete="family-name" />
              </div>
            </div>
          </div>
        </div>

        <!-- Email — always visible -->
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">✉</span>
            <input id="email" type="email" placeholder="you@example.com"
                   autocomplete="email" required />
          </div>
        </div>

        <!-- Password — always visible -->
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input id="password" type="password" placeholder="••••••••"
                   autocomplete="current-password" required minlength="6"
                   oninput="onPasswordInput(this.value)" />
          </div>
          <!-- Strength bar — signup only -->
          <div class="pw-strength-wrap" id="pw-strength-wrap" style="display:none">
            <div class="pw-strength-bar">
              <div class="pw-strength-fill" id="pw-strength-fill"></div>
            </div>
            <span class="pw-strength-label" id="pw-strength-label">—</span>
          </div>
        </div>

        <!-- ── Signup-only: Confirm password (animated in) ── -->
        <div class="signup-fields" id="signup-fields-pw">
          <div class="field" style="margin-bottom:0">
            <label for="confirm-password">Confirm Password</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input id="confirm-password" type="password" placeholder="••••••••"
                     autocomplete="new-password"
                     oninput="onConfirmInput(this.value)" />
            </div>
          </div>
          <div style="height:18px"></div>
        </div>

        <div class="divider"></div>

        <button class="btn-submit" type="submit" id="btn-submit">Sign In</button>
        <div class="msg" id="msg"></div>
      </form>

    </div>

    <!-- Footer -->
    <div class="auth-footer">
      NervaFX
      <span class="auth-footer-dot"></span>
      Personal Trading Dashboard
    </div>

  </div>

  <script>
    // ── GSAP entrance animations ──────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof gsap === 'undefined') return;
      const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
      tl.from('.logo-wrap',  { y: -24, opacity: 0, duration: 0.65 })
        .from('.auth-card',  { y:  20, opacity: 0, duration: 0.6,  scale: 0.97 }, '-=0.4')
        .from('.auth-footer',{ y:  10, opacity: 0, duration: 0.4 }, '-=0.25');
    });

    let currentTab = 'login';

    /* ── Redirect if already authenticated ── */
    (function () {
      const token = localStorage.getItem('nfx_token');
      if (!token) return;
      try {
        const pay = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        if (pay.exp * 1000 > Date.now()) location.replace('/');
      } catch (_) {}
    })();

    // ── Tab switching — animate signup fields in/out ──────────────────────────
    function switchTab(tab) {
      currentTab = tab;
      const isSignup = tab === 'signup';

      document.getElementById('tab-login').classList.toggle('active',  !isSignup);
      document.getElementById('tab-signup').classList.toggle('active', isSignup);
      document.getElementById('tab-pill').classList.toggle('right',    isSignup);
      document.getElementById('btn-submit').textContent =
        isSignup ? 'Create Account' : 'Sign In';
      document.getElementById('password').autocomplete =
        isSignup ? 'new-password' : 'current-password';

      const signupPanels = document.querySelectorAll('.signup-fields');
      const strengthWrap = document.getElementById('pw-strength-wrap');

      if (isSignup) {
        signupPanels.forEach(el => {
          el.classList.add('visible');
          if (typeof gsap !== 'undefined') {
            gsap.to(el, { height: 'auto', opacity: 1, duration: 0.38, ease: 'power2.out' });
          } else {
            el.style.height = 'auto';
            el.style.opacity = '1';
          }
        });
        strengthWrap.style.display = 'flex';
        // Make required
        document.getElementById('first-name').required = true;
        document.getElementById('last-name').required  = true;
        document.getElementById('confirm-password').required = true;
      } else {
        signupPanels.forEach(el => {
          if (typeof gsap !== 'undefined') {
            gsap.to(el, {
              height: 0, opacity: 0, duration: 0.28, ease: 'power2.in',
              onComplete: () => el.classList.remove('visible'),
            });
          } else {
            el.style.height = '0';
            el.style.opacity = '0';
            el.classList.remove('visible');
          }
        });
        strengthWrap.style.display = 'none';
        // Remove required
        document.getElementById('first-name').required = false;
        document.getElementById('last-name').required  = false;
        document.getElementById('confirm-password').required = false;
        // Reset states
        document.getElementById('confirm-password').className = '';
        document.getElementById('confirm-password').value = '';
      }

      clearMsg();
    }

    // ── Password strength meter ───────────────────────────────────────────────
    function onPasswordInput(val) {
      if (currentTab !== 'signup') return;
      const fill  = document.getElementById('pw-strength-fill');
      const label = document.getElementById('pw-strength-label');
      let score = 0;
      if (val.length >= 8)                score++;
      if (/[A-Z]/.test(val))             score++;
      if (/[0-9]/.test(val))             score++;
      if (/[^A-Za-z0-9]/.test(val))      score++;
      const levels = [
        { pct: '20%',  color: '#ef4444', text: 'Weak'   },
        { pct: '40%',  color: '#f97316', text: 'Fair'   },
        { pct: '65%',  color: '#eab308', text: 'Good'   },
        { pct: '85%',  color: '#22c55e', text: 'Strong' },
        { pct: '100%', color: '#10b981', text: 'Great'  },
      ];
      const lvl = val.length === 0 ? null : levels[score];
      fill.style.width      = lvl ? lvl.pct   : '0%';
      fill.style.background = lvl ? lvl.color : '';
      label.textContent     = lvl ? lvl.text  : '—';
      label.style.color     = lvl ? lvl.color : 'var(--muted)';
      // Re-validate confirm
      onConfirmInput(document.getElementById('confirm-password').value);
    }

    // ── Confirm password match indicator ─────────────────────────────────────
    function onConfirmInput(val) {
      if (currentTab !== 'signup') return;
      const pw  = document.getElementById('password').value;
      const el  = document.getElementById('confirm-password');
      if (!val) { el.className = ''; return; }
      el.className = val === pw ? 'pw-match' : 'pw-nomatch';
    }

    // ── Messages ─────────────────────────────────────────────────────────────
    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className   = 'msg show-' + type;
    }

    function clearMsg() {
      document.getElementById('msg').className = 'msg';
    }

    // ── Submit ────────────────────────────────────────────────────────────────
    async function handleSubmit(e) {
      e.preventDefault();
      clearMsg();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('btn-submit');

      // Signup-only validation
      if (currentTab === 'signup') {
        const firstName = document.getElementById('first-name').value.trim();
        const lastName  = document.getElementById('last-name').value.trim();
        const confirm   = document.getElementById('confirm-password').value;

        if (!firstName || !lastName) {
          showMsg('Please enter your first and last name.', 'error');
          return;
        }
        if (password !== confirm) {
          showMsg('Passwords do not match.', 'error');
          document.getElementById('confirm-password').className = 'pw-nomatch';
          return;
        }
        if (password.length < 6) {
          showMsg('Password must be at least 6 characters.', 'error');
          return;
        }
      }

      btn.disabled  = true;
      btn.innerHTML = '<span class="spinner"></span>Please wait…';

      try {
        const body = { action: currentTab, email, password };
        if (currentTab === 'signup') {
          body.firstName = document.getElementById('first-name').value.trim();
          body.lastName  = document.getElementById('last-name').value.trim();
        }

        const res  = await fetch('/api/auth', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(data.error || 'Something went wrong. Try again.', 'error');
          return;
        }

        localStorage.setItem('nfx_token', data.token);
        localStorage.setItem('nfx_user',  JSON.stringify(data.user));

        showMsg(
          currentTab === 'signup'
            ? `✓ Welcome, ${body.firstName}! Setting up your account…`
            : '✓ Welcome back — redirecting…',
          'success'
        );

        if (currentTab === 'signup') {
          localStorage.setItem('nfx_needs_setup', 'true');
          setTimeout(() => location.replace('/setup'), 800);
        } else {
          setTimeout(() => location.replace('/'), 800);
        }

      } catch (err) {
        showMsg('Network error — check your connection and try again.', 'error');
      } finally {
        btn.disabled  = false;
        btn.textContent = currentTab === 'login' ? 'Sign In' : 'Create Account';
      }
    }
  </script>
</body>
</html>
