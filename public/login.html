<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NervaFX — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0c10;
      --card:    #111318;
      --border:  #1e2128;
      --accent:  #2563eb;
      --green:   #16a34a;
      --red:     #dc2626;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --dim:     #94a3b8;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 32px;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo span { color: var(--accent); }
    .tagline {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ── Card ── */
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 28px;
    }
    .tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      background: none;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
    }

    /* ── Form ── */
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus {
      border-color: var(--accent);
    }
    .field input::placeholder {
      color: #2d3748;
    }

    /* ── Submit ── */
    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.2px;
    }
    .btn-submit:hover  { opacity: 0.9; }
    .btn-submit:active { transform: scale(0.99); }
    .btn-submit:disabled { opacity: 0.5; cursor: default; }

    /* ── Error / Success ── */
    .msg {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.5;
    }
    .msg.error   { background: rgba(220,38,38,0.1);  color: #f87171; border: 1px solid rgba(220,38,38,0.25); display: block; }
    .msg.success { background: rgba(22,163,74,0.1);  color: #4ade80; border: 1px solid rgba(22,163,74,0.25);  display: block; }

    /* ── Footer ── */
    .auth-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <div class="logo">Nerva<span>FX</span></div>
    <div class="tagline">Currency Strength Engine</div>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab active" id="tab-login"  onclick="switchTab('login')">Sign In</button>
      <button class="tab"        id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <form id="auth-form" onsubmit="handleSubmit(event)">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required minlength="6" />
      </div>

      <button class="btn-submit" type="submit" id="btn-submit">Sign In</button>

      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div class="auth-footer">NervaFX — Personal Trading Dashboard</div>

  <script>
    let currentTab = 'login';

    // ── If already logged in, redirect straight to dashboard ──────────────────
    (function () {
      const token = localStorage.getItem('nfx_token');
      if (!token) return;
      try {
        const pay = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        if (pay.exp * 1000 > Date.now()) location.replace('/');
      } catch (_) {}
    })();

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-login').classList.toggle('active',  tab === 'login');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('btn-submit').textContent = tab === 'login' ? 'Sign In' : 'Create Account';
      document.getElementById('password').autocomplete = tab === 'login' ? 'current-password' : 'new-password';
      clearMsg();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    function clearMsg() {
      const el = document.getElementById('msg');
      el.className = 'msg';
      el.textContent = '';
    }

    async function handleSubmit(e) {
      e.preventDefault();
      clearMsg();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('btn-submit');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Please wait…';

      try {
        const res  = await fetch('/api/auth', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ action: currentTab, email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(data.error || 'Something went wrong. Please try again.', 'error');
          return;
        }

        // Store token and user info
        localStorage.setItem('nfx_token', data.token);
        localStorage.setItem('nfx_user',  JSON.stringify(data.user));

        showMsg(currentTab === 'signup' ? 'Account created! Redirecting…' : 'Welcome back! Redirecting…', 'success');
        setTimeout(() => location.replace('/'), 800);

      } catch (err) {
        showMsg('Network error — please check your connection.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = currentTab === 'login' ? 'Sign In' : 'Create Account';
      }
    }
  </script>

</body>
</html>
