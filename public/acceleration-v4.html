<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>NervaFX — Acceleration Engine v4</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/auth-guard.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .grid { display: block !important; }

    .sx-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px;
      background: rgba(8,11,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .sx-topbar-left { display: flex; align-items: center; gap: 12px; }
    .sx-logo img { height: 24px; display: block; }
    .sx-sep { color: rgba(255,255,255,0.1); font-size: 20px; font-weight: 200; }
    .sx-title-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .sx-back-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: none;
    }
    .sx-back-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

    .sx-main { max-width: 1100px; margin: 0 auto; padding: 20px 20px 80px; }

    .card {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; margin-bottom: 16px; overflow: hidden;
    }
    .card-hd {
      padding: 12px 16px; font-size: 12px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .card-hd i { width: 15px; height: 15px; }
    .card-note { font-size: 10.5px; color: var(--text-dim); text-transform: none; letter-spacing: 0; font-weight: 500; margin-left: auto; }
    .card-body { padding: 14px 16px; }

    /* Selected trade banner */
    .selected-wrap {
      display: grid; grid-template-columns: auto 1fr auto; gap: 14px;
      align-items: center; padding: 14px 16px;
      background: linear-gradient(135deg, rgba(96,165,250,0.08), rgba(96,165,250,0.02));
      border-radius: 8px; border: 1px solid rgba(96,165,250,0.2);
    }
    .selected-empty {
      padding: 22px 20px; color: var(--text-muted); text-align: center;
      background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.1);
      border-radius: 8px; font-size: 13px;
    }
    .sel-pair { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
    .sel-dir  { font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 6px; letter-spacing: 0.4px; }
    .sel-dir.BUY  { background: rgba(34,197,94,0.18); color: #4ade80; }
    .sel-dir.SELL { background: rgba(239,68,68,0.18); color: #f87171; }
    .sel-reason { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
    .sel-score  { font-size: 30px; font-weight: 800; color: #4ade80; font-family: 'SF Mono', Menlo, monospace; line-height: 1; }
    .sel-score-lbl { font-size: 9px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.6px; text-transform: uppercase; }

    /* Ranked rows */
    .rank-list { display: flex; flex-direction: column; gap: 4px; }
    .rank-row {
      display: grid; grid-template-columns: 30px 80px 60px 1fr auto;
      gap: 10px; align-items: center;
      padding: 8px 12px; border-radius: 6px;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
      cursor: pointer; transition: background 0.12s, border-color 0.12s;
    }
    .rank-row:hover { background: rgba(96,165,250,0.06); border-color: rgba(96,165,250,0.25); }
    .rank-row.qualified { border-color: rgba(34,197,94,0.28); background: rgba(34,197,94,0.04); }
    .rank-row.recurring { box-shadow: inset 3px 0 0 #fbbf24; }
    .rank-row .recur-dot,
    .hist-pair-row .recur-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #fbbf24; margin-left: 6px; vertical-align: middle;
    }
    .rank-idx  { font-size: 11px; color: var(--text-dim); font-family: 'SF Mono', Menlo, monospace; text-align: right; }
    .rank-pair { font-size: 13px; font-weight: 800; color: #fff; }
    .rank-dir  { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-align: center; }
    .rank-dir.BUY  { background: rgba(34,197,94,0.14); color: #4ade80; }
    .rank-dir.SELL { background: rgba(239,68,68,0.14); color: #f87171; }
    .rank-dir.NONE { background: rgba(148,163,184,0.14); color: #94a3b8; }
    .rank-meta { display: flex; gap: 12px; font-size: 10px; color: var(--text-dim); flex-wrap: wrap; }
    .rank-meta b { color: var(--text-muted); font-family: 'SF Mono', Menlo, monospace; }
    .rank-score { font-size: 15px; font-weight: 800; font-family: 'SF Mono', Menlo, monospace; }

    /* Filters */
    .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .filters .lbl { font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
    .filter-btn {
      padding: 4px 12px; border-radius: 7px; font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); cursor: pointer;
    }
    .filter-btn.active { background: rgba(96,165,250,0.15); border-color: rgba(96,165,250,0.5); color: #60a5fa; }
    .date-input {
      padding: 4px 8px; border-radius: 7px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-family: inherit; outline: none;
    }

    /* History cards */
    .hist-list { display: flex; flex-direction: column; gap: 10px; }
    .hist-card {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; overflow: hidden;
    }
    .hist-card-hd {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .hist-card-time { font-size: 12px; font-weight: 700; color: #fff; font-family: 'SF Mono', Menlo, monospace; }
    .hist-card-count {
      margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      padding: 3px 8px; border-radius: 5px;
      background: rgba(34,197,94,0.14); color: #4ade80;
    }
    .hist-card-body { padding: 6px 10px 10px; display: flex; flex-direction: column; gap: 3px; }
    .hist-pair-row {
      display: grid; grid-template-columns: 80px 60px 1fr auto; gap: 10px;
      align-items: center;
      padding: 8px 10px; border-radius: 6px;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
      cursor: pointer; transition: background 0.12s, border-color 0.12s;
    }
    .hist-pair-row:hover { background: rgba(96,165,250,0.06); border-color: rgba(96,165,250,0.25); }
    .hist-pair-row.recurring { box-shadow: inset 3px 0 0 #fbbf24; }
    .hist-pair-row .recur-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #fbbf24; margin-left: 6px; vertical-align: middle;
    }
    .hist-pair-name { font-weight: 800; color: #fff; font-size: 13px; }
    .hist-pair-metrics { color: var(--text-dim); font-size: 10px; font-family: 'SF Mono', Menlo, monospace; }
    .hist-pair-metrics b { color: var(--text-muted); }
    .hist-pair-score { font-size: 14px; font-weight: 800; font-family: 'SF Mono', Menlo, monospace; }
    .hist-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

    /* Detail modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: flex-start; justify-content: center;
      z-index: 200; padding: 40px 20px; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      max-width: 720px; width: 100%;
      background: #0d1117; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; overflow: hidden;
    }
    .modal-hd {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .modal-close {
      margin-left: auto; padding: 4px 10px; border-radius: 6px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); cursor: pointer; font-size: 11px;
    }
    .modal-body { padding: 18px 20px; }

    .comp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .comp-tile {
      padding: 10px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    }
    .comp-title {
      font-size: 9px; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .comp-score {
      font-size: 20px; font-weight: 800; font-family: 'SF Mono', Menlo, monospace;
      color: #fff; line-height: 1; margin-bottom: 4px;
    }
    .comp-detail { font-size: 10px; color: var(--text-muted); font-family: 'SF Mono', Menlo, monospace; }
    .comp-bar { height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    .comp-bar-fill { height: 100%; border-radius: 2px; }

    .rules-list { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }
    .rule-row {
      display: flex; align-items: center; gap: 8px; font-size: 12px;
      padding: 6px 10px; border-radius: 5px; background: rgba(255,255,255,0.02);
    }
    .rule-icon { font-size: 14px; }
    .rule-ok { color: #4ade80; }
    .rule-no { color: #f87171; }
  </style>
</head>
<body>
  <div class="sx-topbar">
    <div class="sx-topbar-left">
      <a href="/app" class="sx-logo"><img src="/nervafx-logo.png" alt="NervaFX" /></a>
      <span class="sx-sep">|</span>
      <span class="sx-title-text">Acceleration Engine v4</span>
    </div>
    <a href="/app" class="sx-back-btn"><i data-lucide="arrow-left" style="width:12px;height:12px"></i> Back</a>
  </div>

  <main class="sx-main">
    <!-- Selected + Live ranked pairs (M15 card) -->
    <section class="card">
      <div class="card-hd">
        <i data-lucide="rocket"></i> Live M15 Acceleration Scan
        <span class="card-note" id="live-time">Loading…</span>
      </div>
      <div class="card-body">
        <div class="filters" style="margin-bottom:14px">
          <span class="lbl">Anchor</span>
          <input type="date" class="date-input" id="live-date">
          <input type="time" class="date-input" id="live-time-input" step="900">
          <button class="filter-btn active" id="live-go">Go</button>
          <button class="filter-btn" id="live-now">Live</button>
          <span id="live-warmup" style="font-size:10.5px;color:var(--text-dim);margin-left:8px"></span>
        </div>
        <div id="selected-slot"></div>
        <div style="height:14px"></div>
        <div id="live-list" class="rank-list"></div>
      </div>
    </section>

    <!-- History card -->
    <section class="card">
      <div class="card-hd">
        <i data-lucide="history"></i> Signal History
        <span class="card-note">Qualified triggers only (score &gt; 85, all rules satisfied)</span>
      </div>
      <div class="card-body">
        <div class="filters" style="margin-bottom:12px">
          <span class="lbl">From</span>
          <input type="date" class="date-input" id="hist-from" value="2025-08-01">
          <span class="lbl">To</span>
          <input type="date" class="date-input" id="hist-to">
          <button class="filter-btn active" id="hist-btn">Load history</button>
          <span id="hist-status" style="font-size:10.5px;color:var(--text-dim);margin-left:8px"></span>
        </div>
        <div id="hist-list" class="hist-list">
          <div class="hist-empty">Set a date range and click Load history.</div>
        </div>
      </div>
    </section>
  </main>

  <!-- Detail modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-hd">
        <span id="modal-pair" style="font-size:20px;font-weight:800;color:#fff"></span>
        <span id="modal-dir"  class="sel-dir"></span>
        <span id="modal-score" style="font-size:22px;font-weight:800;color:#4ade80;font-family:'SF Mono',Menlo,monospace;margin-left:auto"></span>
        <button class="modal-close" id="modal-close">Close ×</button>
      </div>
      <div class="modal-body">
        <div class="comp-grid" id="modal-comp"></div>
        <div class="rules-list" id="modal-rules"></div>
        <div style="margin-top:14px;font-size:11px;color:var(--text-dim)" id="modal-context"></div>
      </div>
    </div>
  </div>

  <script>
    var TOKEN = localStorage.getItem('nfx_token') || '';
    var _userTz = localStorage.getItem('nfx_tz') || 'auto';
    function _tz() { return (_userTz === 'auto') ? Intl.DateTimeFormat().resolvedOptions().timeZone : (_userTz || 'UTC'); }

    async function loadProfileTz() {
      try {
        if (!TOKEN) return;
        var r = await fetch('/api/profile', { headers: { Authorization: 'Bearer ' + TOKEN } });
        if (!r.ok) return;
        var p = await r.json();
        if (p.timezone) {
          _userTz = (p.timezone === 'UTC') ? 'auto' : p.timezone;
          try { localStorage.setItem('nfx_tz', _userTz); } catch (_) {}
        }
      } catch (_) {}
    }

    function fmtTime(iso) {
      var d = new Date(iso);
      return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: _tz() });
    }
    function fmtNum(n, dp) { if (n == null) return '—'; return Number(n).toFixed(dp == null ? 1 : dp); }
    function scoreColor(s) { return s >= 85 ? '#4ade80' : s >= 70 ? '#facc15' : s >= 50 ? '#fbbf24' : '#f87171'; }

    var _lastResults = [];
    var _histCache = {};
    // Session-scoped set of pairs seen in the current live session so we can
    // highlight recurrences across all refreshes within the same session, not
    // just the immediately previous one.
    var _liveSession = { id: null, pairs: new Set() };

    // Session boundaries in UTC:
    //   Asia   = 21:00 (day N-1) -> 07:00 (day N)
    //   London = 07:00 -> 13:00
    //   NY     = 13:00 -> 21:00
    function getSessionId(iso) {
      var d = new Date(iso);
      var h = d.getUTCHours();
      var y = d.getUTCFullYear(), m = d.getUTCMonth(), day = d.getUTCDate();
      if (h >= 21) {
        var next = new Date(Date.UTC(y, m, day + 1));
        return 'ASIA|' + next.toISOString().slice(0, 10);
      }
      if (h < 7)  return 'ASIA|'   + d.toISOString().slice(0, 10);
      if (h < 13) return 'LONDON|' + d.toISOString().slice(0, 10);
      return 'NY|' + d.toISOString().slice(0, 10);
    }

    function renderSelected(sel, generatedAt) {
      var el = document.getElementById('selected-slot');
      if (!sel) {
        el.innerHTML = '<div class="selected-empty">No qualifying trade right now. All pairs below don\'t meet the full rule stack (H1 bias · M15 accel &gt; 55 · velocity &gt; 55 · score ≥ 75).</div>';
        return;
      }
      var cls = sel.direction === 'BUY' ? 'BUY' : 'SELL';
      el.innerHTML = ''
        + '<div class="selected-wrap">'
        + '  <div>'
        + '    <div class="sel-pair">' + sel.pair + '</div>'
        + '    <div class="sel-reason">H1 ' + sel.direction + ' flow · M15 accel ' + fmtNum(sel.components.m15Acceleration.score) + ' · velocity ' + fmtNum(sel.components.m15Velocity.score) + '</div>'
        + '  </div>'
        + '  <div><span class="sel-dir ' + cls + '">' + sel.direction + '</span></div>'
        + '  <div style="text-align:right"><div class="sel-score" style="color:' + scoreColor(sel.finalScore) + '">' + sel.finalScore + '</div><div class="sel-score-lbl">Final Score</div></div>'
        + '</div>';
    }

    function renderLive(results, anchorTime) {
      _lastResults = results;
      var el = document.getElementById('live-list');
      if (!results || !results.length) { el.innerHTML = '<div class="hist-empty">No live data yet.</div>'; return; }
      // Reset the recurring-set when we cross session boundaries so an Asia
      // pair doesn't stay highlighted after London opens.
      var sessionId = anchorTime ? getSessionId(anchorTime) : null;
      if (sessionId !== _liveSession.id) {
        _liveSession = { id: sessionId, pairs: new Set() };
      }
      var html = '';
      results.forEach(function(r, i) {
        var qCls = r.qualifies ? ' qualified' : '';
        var dCls = r.direction || 'NONE';
        var recurring = _liveSession.pairs.has(r.pair);
        var rCls = recurring ? ' recurring' : '';
        var dotHtml = recurring ? ' <span class="recur-dot" title="Also earlier in this session"></span>' : '';
        _liveSession.pairs.add(r.pair);
        html += '<div class="rank-row' + qCls + rCls + '" data-idx="' + i + '">'
             +   '<div class="rank-idx">' + (i + 1) + '</div>'
             +   '<div class="rank-pair">' + r.pair + dotHtml + '</div>'
             +   '<div class="rank-dir ' + dCls + '">' + (r.direction || '—') + '</div>'
             +   '<div class="rank-meta">'
             +     '<span>H1 <b>' + fmtNum(r.components.h1Bias.score, 0) + '</b></span>'
             +     '<span>Accel <b>' + fmtNum(r.components.m15Acceleration.score) + '</b></span>'
             +     '<span>Vel <b>' + fmtNum(r.components.m15Velocity.score) + '</b></span>'
             +     '<span>Comp <b>' + fmtNum(r.components.compression.score, 0) + '</b></span>'
             +     '<span>Cand <b>' + fmtNum(r.components.candleControl.score) + '</b></span>'
             +   '</div>'
             +   '<div class="rank-score" style="color:' + scoreColor(r.finalScore) + '">' + r.finalScore + '</div>'
             + '</div>';
      });
      el.innerHTML = html;
      el.querySelectorAll('.rank-row').forEach(function(row) {
        row.addEventListener('click', function() {
          var i = parseInt(row.dataset.idx, 10);
          openDetail(_lastResults[i]);
        });
      });
    }

    function ruleLine(ok, label) {
      var cls = ok ? 'rule-ok' : 'rule-no';
      var icon = ok ? '✓' : '✗';
      return '<div class="rule-row ' + cls + '"><span class="rule-icon">' + icon + '</span>' + label + '</div>';
    }

    function openDetail(r) {
      if (!r) return;
      document.getElementById('modal-pair').textContent  = r.pair;
      var dirEl = document.getElementById('modal-dir');
      dirEl.textContent = r.direction || 'NEUTRAL';
      dirEl.className = 'sel-dir ' + (r.direction || 'NONE');
      var sc = document.getElementById('modal-score');
      sc.textContent = r.finalScore;
      sc.style.color = scoreColor(r.finalScore);

      var comp = r.components;
      var h1 = comp.h1Bias || {};
      var h1Lines = [];
      h1Lines.push(r.direction ? ('Direction ' + r.direction) : 'Neutral (H1 alignment failed)');
      if (h1.now)  h1Lines.push('Now — C ' + fmtNum(h1.now.close, 5)  + ' / E20 ' + fmtNum(h1.now.ema20, 5)  + ' / E50 ' + fmtNum(h1.now.ema50, 5));
      if (h1.prev) h1Lines.push('Prev — C ' + fmtNum(h1.prev.close, 5) + ' / E20 ' + fmtNum(h1.prev.ema20, 5) + ' / E50 ' + fmtNum(h1.prev.ema50, 5));
      if (h1.prevHigh != null && h1.prevLow != null) {
        var brk = '';
        if (r.direction === 'BUY')       brk = 'H1 close ' + fmtNum(h1.now && h1.now.close, 5) + ' > prev H1 high ' + fmtNum(h1.prevHigh, 5);
        else if (r.direction === 'SELL') brk = 'H1 close ' + fmtNum(h1.now && h1.now.close, 5) + ' < prev H1 low ' + fmtNum(h1.prevLow, 5);
        else                             brk = 'prev H1 range ' + fmtNum(h1.prevLow, 5) + ' — ' + fmtNum(h1.prevHigh, 5);
        h1Lines.push(brk);
      }
      var tiles = [
        { title: 'H1 Bias',       score: comp.h1Bias.score,  detail: h1Lines.join(' · ') },
        { title: 'M15 Velocity',  score: comp.m15Velocity.score, detail: 'v = ' + fmtNum(comp.m15Velocity.velocity, 2) + ' ATR (signed ' + fmtNum(comp.m15Velocity.signed, 2) + ')' },
        { title: 'M15 Acceleration', score: comp.m15Acceleration.score, detail: 'Δv = ' + fmtNum(comp.m15Acceleration.acceleration, 2) + '  (V1 ' + fmtNum(comp.m15Acceleration.v1, 2) + ' vs V2 ' + fmtNum(comp.m15Acceleration.v2, 2) + ')' },
        { title: 'Compression',   score: comp.compression.score, detail: 'ATR14/ATR50 = ' + fmtNum(comp.compression.ratio, 2) },
        { title: 'Candle Control (H1)', score: comp.candleControl.score, detail: 'H1 body / range = ' + fmtNum(comp.candleControl.efficiency * 100, 0) + '%' },
      ];
      var html = '';
      tiles.forEach(function(t) {
        var col = scoreColor(t.score);
        var pct = Math.max(3, Math.min(100, t.score));
        html += '<div class="comp-tile">'
             +   '<div class="comp-title">' + t.title + '</div>'
             +   '<div class="comp-score" style="color:' + col + '">' + fmtNum(t.score, 0) + '</div>'
             +   '<div class="comp-detail">' + t.detail + '</div>'
             +   '<div class="comp-bar"><div class="comp-bar-fill" style="width:' + pct + '%;background:' + col + '"></div></div>'
             + '</div>';
      });
      document.getElementById('modal-comp').innerHTML = html;

      var rules = r.rules || {};
      document.getElementById('modal-rules').innerHTML = ''
        + ruleLine(rules.h1Bias,          'H1 Bias non-neutral')
        + ruleLine(rules.m15Aligned,      'M15 4-candle move aligned with H1 direction')
        + ruleLine(rules.accelAbove55,    'M15 Acceleration &gt; 55')
        + ruleLine(rules.velocityAbove55, 'M15 Velocity &gt; 55')
        + ruleLine(rules.finalAbove75,    'Final Score ≥ 75');

      document.getElementById('modal-context').textContent = 'M15 close @ ' + fmtTime(r.price.m15Time) + ' · ' + fmtNum(r.price.m15Close, 5);

      document.getElementById('modal').classList.add('open');
    }
    document.getElementById('modal-close').addEventListener('click', function() {
      document.getElementById('modal').classList.remove('open');
    });
    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    async function loadLive() {
      try {
        var dateVal = document.getElementById('live-date').value;
        var timeVal = document.getElementById('live-time-input').value;
        var qs = '';
        if (dateVal && timeVal) {
          qs = '?date=' + dateVal + '&time=' + timeVal;
        }
        var r = await fetch('/api/acceleration-v4' + qs, {
          headers: { Authorization: 'Bearer ' + TOKEN },
          cache: 'no-store',
        });
        if (!r.ok) throw new Error(await r.text());
        var json = await r.json();
        document.getElementById('live-time').textContent = 'Anchor ' + fmtTime(json.generatedAt) + ' · ' + json.total + ' pairs analysed';

        var warmupEl = document.getElementById('live-warmup');
        if (json.warmup && (json.warmup.haveH1 < json.warmup.needH1 || json.warmup.haveM15 < json.warmup.needM15)) {
          warmupEl.textContent = 'Warming up — need ' + json.warmup.needH1 + ' H1 / ' + json.warmup.needM15 + ' M15, have ' + json.warmup.haveH1 + ' / ' + json.warmup.haveM15;
          warmupEl.style.color = '#facc15';
        } else if (json.skippedInsufficient) {
          warmupEl.textContent = json.skippedInsufficient + ' pair(s) skipped (not enough candles)';
          warmupEl.style.color = 'var(--text-dim)';
        } else {
          warmupEl.textContent = '';
        }

        if (!json.total) {
          var need = json.warmup || { needH1: 51, needM15: 51, haveH1: 0, haveM15: 0 };
          var msg = 'No pair has enough history at this anchor. Need ' + need.needH1 + ' H1 + ' + need.needM15 + ' M15 candles. Currently max seen: ' + need.haveH1 + ' H1 / ' + need.haveM15 + ' M15.';
          document.getElementById('selected-slot').innerHTML = '<div class="selected-empty">' + msg + '</div>';
          document.getElementById('live-list').innerHTML = '';
          _lastResults = [];
          return;
        }

        renderSelected(json.selected, json.generatedAt);
        renderLive(json.results, json.generatedAt);
      } catch (e) {
        document.getElementById('live-list').innerHTML = '<div class="hist-empty" style="color:#f87171">Error: ' + e.message + '</div>';
      }
    }

    document.getElementById('live-go').addEventListener('click', loadLive);
    document.getElementById('live-now').addEventListener('click', function() {
      document.getElementById('live-date').value = '';
      document.getElementById('live-time-input').value = '';
      loadLive();
    });

    async function loadHistory() {
      var from = document.getElementById('hist-from').value;
      var to   = document.getElementById('hist-to').value;
      var status = document.getElementById('hist-status');
      var listEl = document.getElementById('hist-list');
      if (!from || !to) { status.textContent = 'Set both dates.'; return; }
      status.textContent = 'Scanning ' + from + ' → ' + to + '…';
      listEl.innerHTML = '<div class="hist-empty">Scanning…</div>';
      try {
        var r = await fetch('/api/acceleration-v4-history?from=' + from + '&to=' + to, {
          headers: { Authorization: 'Bearer ' + TOKEN },
        });
        if (!r.ok) throw new Error(await r.text());
        var json = await r.json();
        status.textContent = json.qualified + ' qualified signals across ' + json.anchors_scanned + ' anchors (' + json.duration_sec + 's)';
        if (!json.rows || !json.rows.length) {
          listEl.innerHTML = '<div class="hist-empty">No qualified signals in this window.</div>';
          return;
        }
        // Cache pair records keyed by "time|pair" so click → openDetail hydrates
        // straight from history without a second fetch.
        _histCache = {};
        // Ordered newest-first for display. Group cards by session so we can
        // highlight any pair that appeared earlier in the SAME trading session
        // (Asia / London / NY) — not just the immediately previous card.
        var displayRows = json.rows.slice().reverse();
        var pairSets = displayRows.map(function(row) {
          var s = new Set();
          (row.pairs || []).forEach(function(p) { s.add(p.pair); });
          return s;
        });
        var sessionIds = displayRows.map(function(row) { return getSessionId(row.time); });

        var html = '';
        displayRows.forEach(function(row, rIdx) {
          var pairs = row.pairs || [];
          // Walk forward in the reversed list (chronologically earlier cards)
          // and collect every pair seen in the same session as this row.
          var mySession = sessionIds[rIdx];
          var olderSet = new Set();
          for (var oi = rIdx + 1; oi < displayRows.length; oi++) {
            if (sessionIds[oi] !== mySession) continue;
            pairSets[oi].forEach(function(p) { olderSet.add(p); });
          }
          html += '<div class="hist-card">';
          html += '<div class="hist-card-hd">';
          html += '<span class="hist-card-time">' + fmtTime(row.time) + '</span>';
          html += '<span class="hist-card-count">' + pairs.length + ' PAIR' + (pairs.length > 1 ? 'S' : '') + '</span>';
          html += '</div>';
          html += '<div class="hist-card-body">';
          pairs.forEach(function(p, pIdx) {
            var key = rIdx + ':' + pIdx;
            _histCache[key] = p;
            var dCls = p.direction || 'NONE';
            var col = p.finalScore >= 90 ? '#4ade80' : p.finalScore >= 85 ? '#a3e635' : '#facc15';
            var accel = p.components && p.components.m15Acceleration ? p.components.m15Acceleration.score : 0;
            var vel   = p.components && p.components.m15Velocity     ? p.components.m15Velocity.score : 0;
            var comp  = p.components && p.components.compression     ? p.components.compression.score : 0;
            var cand  = p.components && p.components.candleControl   ? p.components.candleControl.score : 0;
            var recurring = olderSet.has(p.pair);
            var recurCls  = recurring ? ' recurring' : '';
            var dotHtml   = recurring ? ' <span class="recur-dot" title="Also earlier in this session"></span>' : '';
            html += '<div class="hist-pair-row' + recurCls + '" data-key="' + key + '">'
                 +   '<span class="hist-pair-name">' + p.pair + dotHtml + '</span>'
                 +   '<span class="rank-dir ' + dCls + '">' + p.direction + '</span>'
                 +   '<span class="hist-pair-metrics">Accel <b>' + fmtNum(accel) + '</b> · Vel <b>' + fmtNum(vel) + '</b> · Comp <b>' + comp + '</b> · Cand <b>' + fmtNum(cand) + '</b></span>'
                 +   '<span class="hist-pair-score" style="color:' + col + '">' + p.finalScore + '</span>'
                 + '</div>';
          });
          html += '</div></div>';
        });
        listEl.innerHTML = html;
        listEl.querySelectorAll('.hist-pair-row').forEach(function(row) {
          row.addEventListener('click', function() {
            var rec = _histCache[row.dataset.key];
            if (rec) openDetail(rec);
          });
        });
      } catch (e) {
        status.textContent = 'Error: ' + e.message;
        listEl.innerHTML = '<div class="hist-empty" style="color:#f87171">' + e.message + '</div>';
      }
    }
    document.getElementById('hist-btn').addEventListener('click', loadHistory);

    // Default hist-to to today
    (function() {
      var d = new Date();
      document.getElementById('hist-to').value = d.toISOString().slice(0, 10);
    })();

    lucide.createIcons();
    loadProfileTz().then(loadLive);

    // Auto-refresh live every 15 minutes at :05 past
    (function schedule() {
      var now = new Date();
      var cycle = now.getUTCMinutes() % 15;
      var minutesUntil = (5 - cycle + 15) % 15;
      var delay = (minutesUntil * 60 - now.getUTCSeconds()) * 1000;
      if (delay <= 0) delay += 15 * 60 * 1000;
      setTimeout(function() { loadLive(); schedule(); }, delay);
    })();
  </script>
</body>
</html>
