<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>NervaFX — M15 Break Impulse</title>
  <link rel="icon" type="image/png" href="/nervafx-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .grid { display: block !important; }
    .sx-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px;
      background: rgba(8,11,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .sx-topbar-left { display: flex; align-items: center; gap: 12px; }
    .sx-logo img { height: 24px; display: block; }
    .sx-sep { color: rgba(255,255,255,0.1); font-size: 20px; font-weight: 200; }
    .sx-title-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .sx-back-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: none;
    }
    .sx-back-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .sx-subtitle {
      text-align: center; padding: 18px 20px 10px;
      font-size: 11px; color: var(--text-dim); letter-spacing: 0.3px;
    }

    /* Filters */
    .sx-filters {
      display: flex; align-items: center; gap: 8px; padding: 10px 20px;
      flex-wrap: wrap; justify-content: center;
    }
    .sx-days {
      padding: 5px 12px; border-radius: 7px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer;
    }
    .sx-days.active { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.4); color: #fbbf24; }
    .sx-days:hover { background: rgba(255,255,255,0.08); }
    .sx-session-filter {
      padding: 5px 10px; border-radius: 7px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer;
    }
    .sx-session-filter.active { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.3); color: #fbbf24; }
    .sx-date-input {
      padding: 5px 10px; border-radius: 7px; font-size: 11px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--text-muted); width: 110px;
    }
    .sx-go-btn {
      padding: 5px 12px; border-radius: 7px; font-size: 11px; font-weight: 700;
      background: rgba(245,158,11,0.2); border: 1px solid rgba(245,158,11,0.4);
      color: #fbbf24; cursor: pointer;
    }

    /* Cards */
    .brk-card {
      margin: 12px 20px; border-radius: 14px;
      background: rgba(255,255,255,0.02); border: 1px solid var(--border);
      overflow: hidden;
    }
    .brk-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .brk-time-block { display: flex; flex-direction: column; }
    .brk-time { font-size: 16px; font-weight: 800; color: #fff; }
    .brk-date { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
    .brk-count {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px;
      background: rgba(245,158,11,0.12); color: #fbbf24;
    }

    /* Signal rows */
    .brk-signals { padding: 12px 18px; }
    .brk-signal {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; margin-bottom: 8px; border-radius: 10px;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
      cursor: pointer; transition: background 0.2s; flex-wrap: wrap;
    }
    .brk-signal:hover { background: rgba(255,255,255,0.04); }
    .brk-signal.open .brk-detail { display: block; }
    .brk-pair { font-size: 14px; font-weight: 800; color: #fff; min-width: 70px; }
    .brk-dir {
      font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 5px;
      letter-spacing: 0.5px;
    }
    .brk-dir.BUY { background: rgba(34,197,94,0.15); color: #4ade80; }
    .brk-dir.SELL { background: rgba(239,68,68,0.15); color: #f87171; }
    .brk-body-tag {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 5px;
      background: rgba(245,158,11,0.12); color: #fbbf24;
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    }
    .brk-break-tag {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 5px;
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    }
    .brk-break-tag.BUY { background: rgba(34,197,94,0.1); color: #4ade80; }
    .brk-break-tag.SELL { background: rgba(239,68,68,0.1); color: #f87171; }
    .brk-gbp-tag {
      font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
      background: rgba(96,165,250,0.1); color: #60a5fa;
      letter-spacing: 0.3px;
    }
    .brk-min-label {
      font-size: 10px; color: var(--text-dim); margin-left: auto;
    }

    /* Detail panel */
    .brk-detail {
      display: none; margin-top: 10px; width: 100%;
      border-top: 1px solid rgba(255,255,255,0.04); padding-top: 8px;
    }
    .brk-detail-table {
      width: 100%; border-collapse: collapse; font-size: 10px;
    }
    .brk-detail-table th {
      text-align: left; padding: 4px 8px; color: var(--text-dim);
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .brk-detail-table td { padding: 4px 8px; }
    .brk-bull { color: #4ade80; }
    .brk-bear { color: #f87171; }
    .brk-label-row {
      font-size: 9px; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
      .brk-card { margin: 8px 10px; }
      .brk-signal { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="sx-topbar">
    <div class="sx-topbar-left">
      <a href="/app" class="sx-logo"><img src="/nervafx-logo.png" alt="NervaFX" /></a>
      <span class="sx-sep">|</span>
      <span class="sx-title-text">M15 Break Impulse</span>
    </div>
    <a href="/app" class="sx-back-btn"><i data-lucide="arrow-left" style="width:12px;height:12px"></i> Back</a>
  </div>

  <div class="sx-subtitle">M15 impulse breaks — close above prev high (BUY) or below prev low (SELL) with body ≥15 pips GBP, ≥10 pips others</div>

  <div class="sx-filters">
    <button class="sx-days active" data-days="1">1D</button>
    <button class="sx-days" data-days="2">2D</button>
    <button class="sx-days" data-days="5">5D</button>
    <button class="sx-days" data-days="10">10D</button>
    <button class="sx-session-filter active" data-session="all">All</button>
    <button class="sx-session-filter" data-session="asia">Asia</button>
    <button class="sx-session-filter" data-session="london">London</button>
    <button class="sx-session-filter" data-session="newyork">New York</button>
    <input type="date" class="sx-date-input" id="sx-date-from" placeholder="dd/mm/yyyy" />
    <input type="date" class="sx-date-input" id="sx-date-to" placeholder="dd/mm/yyyy" />
    <button class="sx-go-btn" id="sx-go">Go</button>
  </div>

  <div id="brk-cards"></div>

  <script>
    var TOKEN = localStorage.getItem('nfx_token') || '';
    var _userTz = localStorage.getItem('nfx_tz') || 'auto';
    function _tz() { return (_userTz === 'auto') ? Intl.DateTimeFormat().resolvedOptions().timeZone : (_userTz || 'UTC'); }
    var currentDays = 1;
    var currentSession = 'all';
    var cachedRows = [];

    function hrLabel(t) {
      return new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: _tz() });
    }
    function dayLabel(t) {
      return new Date(t).toLocaleDateString('en-GB', { weekday: 'short', month: 'short', day: '2-digit', timeZone: _tz() });
    }
    function isWeekend(t) {
      var d = new Date(t).getUTCDay();
      return d === 0 || d === 6;
    }
    function inSession(t) {
      if (currentSession === 'all') return true;
      var h = new Date(t).getUTCHours();
      if (currentSession === 'asia') return h >= 0 && h < 9;
      if (currentSession === 'london') return h >= 7 && h < 16;
      if (currentSession === 'newyork') return h >= 13 && h < 22;
      return true;
    }

    function renderCards(rows) {
      var el = document.getElementById('brk-cards');
      var html = '';
      var reversed = rows.slice().reverse();

      for (var r = 0; r < reversed.length; r++) {
        var row = reversed[r];
        if (isWeekend(row.time)) continue;
        if (!inSession(row.time)) continue;

        html += '<div class="brk-card">';
        html += '<div class="brk-hd">';
        html += '<div class="brk-time-block">';
        html += '<span class="brk-time">' + hrLabel(row.time) + '</span>';
        html += '<span class="brk-date">' + dayLabel(row.time) + '</span>';
        html += '</div>';
        html += '<span class="brk-count">' + row.signals.length + ' break' + (row.signals.length > 1 ? 's' : '') + '</span>';
        html += '</div>';

        html += '<div class="brk-signals">';
        for (var s = 0; s < row.signals.length; s++) {
          var sig = row.signals[s];
          var isGbp = sig.instrument && sig.instrument.includes('GBP');
          html += '<div class="brk-signal">';

          html += '<span class="brk-pair">' + sig.pair + '</span>';
          html += '<span class="brk-dir ' + sig.direction + '">' + sig.direction + '</span>';
          html += '<span class="brk-body-tag">' + sig.bodyPips + ' pip body</span>';
          html += '<span class="brk-break-tag ' + sig.direction + '">' + (sig.direction === 'BUY' ? '▲' : '▼') + ' ' + sig.breakPips + ' pip break</span>';
          if (isGbp) html += '<span class="brk-gbp-tag">GBP 15+</span>';
          html += '<span class="brk-min-label">min ' + sig.minPips + ' pips</span>';

          // Detail panel (hidden)
          html += '<div class="brk-detail">';
          html += '<table class="brk-detail-table">';
          html += '<thead><tr><th>Candle</th><th>Time</th><th>Open</th><th>High</th><th>Low</th><th>Close</th></tr></thead>';
          html += '<tbody>';

          var prec = sig.pair.includes('JPY') ? 3 : 5;

          // Previous candle
          if (sig.prevCandle) {
            var pc = sig.prevCandle;
            var pcBull = pc.close > pc.open;
            var pcCls = pcBull ? 'brk-bull' : 'brk-bear';
            html += '<tr class="' + pcCls + '">';
            html += '<td class="brk-label-row">Prev</td>';
            html += '<td>' + hrLabel(pc.time) + '</td>';
            html += '<td>' + pc.open.toFixed(prec) + '</td>';
            html += '<td>' + pc.high.toFixed(prec) + '</td>';
            html += '<td>' + pc.low.toFixed(prec) + '</td>';
            html += '<td>' + pc.close.toFixed(prec) + '</td>';
            html += '</tr>';
          }

          // Current candle (the break candle)
          if (sig.candle) {
            var cc = sig.candle;
            var ccCls = sig.direction === 'BUY' ? 'brk-bull' : 'brk-bear';
            html += '<tr class="' + ccCls + '" style="font-weight:700">';
            html += '<td class="brk-label-row">Break</td>';
            html += '<td>' + hrLabel(cc.time) + '</td>';
            html += '<td>' + cc.open.toFixed(prec) + '</td>';
            html += '<td>' + cc.high.toFixed(prec) + '</td>';
            html += '<td>' + cc.low.toFixed(prec) + '</td>';
            html += '<td>' + cc.close.toFixed(prec) + '</td>';
            html += '</tr>';
          }

          // Break level annotation
          if (sig.direction === 'BUY' && sig.prevHigh) {
            html += '<tr><td colspan="6" style="font-size:9px;color:var(--text-dim);padding-top:6px">Close ' + sig.candle.close.toFixed(prec) + ' broke above prev high ' + sig.prevHigh.toFixed(prec) + '</td></tr>';
          } else if (sig.direction === 'SELL' && sig.prevLow) {
            html += '<tr><td colspan="6" style="font-size:9px;color:var(--text-dim);padding-top:6px">Close ' + sig.candle.close.toFixed(prec) + ' broke below prev low ' + sig.prevLow.toFixed(prec) + '</td></tr>';
          }

          html += '</tbody></table></div>';

          html += '</div>';
        }
        html += '</div></div>';
      }

      el.innerHTML = html || '<div class="br-empty">No impulse breaks found in this period.</div>';
      el.querySelectorAll('.brk-signal').forEach(function(card) {
        card.addEventListener('click', function() { card.classList.toggle('open'); });
      });
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function load() {
      document.getElementById('brk-cards').innerHTML = '<div class="sx-loading"><span class="spinner"></span> Loading…</div>';

      var fromEl = document.getElementById('sx-date-from');
      var toEl = document.getElementById('sx-date-to');
      var qs;
      if (fromEl.value && toEl.value) {
        qs = 'from=' + fromEl.value + '&to=' + toEl.value;
      } else {
        qs = 'days=' + currentDays;
      }

      try {
        var res = await fetch('/api/m15-break-impulse?' + qs, {
          headers: { Authorization: 'Bearer ' + TOKEN },
        });
        if (!res.ok) throw new Error(await res.text());
        var json = await res.json();
        cachedRows = json.rows || [];
        renderCards(cachedRows);
      } catch (e) {
        document.getElementById('brk-cards').innerHTML =
          '<div class="br-empty" style="color:#f87171">Error: ' + e.message + '</div>';
      }
    }

    document.querySelectorAll('.sx-days').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.sx-days').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentDays = parseInt(btn.dataset.days, 10);
        document.getElementById('sx-date-from').value = '';
        document.getElementById('sx-date-to').value = '';
        load();
      });
    });
    document.querySelectorAll('.sx-session-filter').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.sx-session-filter').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentSession = btn.dataset.session;
        renderCards(cachedRows);
      });
    });
    document.getElementById('sx-go').addEventListener('click', load);

    load();
    setInterval(load, 15 * 60 * 1000);
  </script>
</body>
</html>
