name: NervaFX Hourly Update

on:
  schedule:
    # Every hour at minute 5, Mon–Fri only (UTC)
    # Market opens Sun 21:00 UTC — covered by the Sun 21:05 run below
    - cron: '5 * * * 1-5'   # Mon–Fri, every hour
    - cron: '5 21 * * 0'    # Sunday 21:05 UTC — market open
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run hourly update
        env:
          OANDA_API_KEY:        ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID:     ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_BASE_URL:       ${{ secrets.OANDA_BASE_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACCOUNT_BALANCE:      ${{ secrets.ACCOUNT_BALANCE }}
          ACTION_MODE:          ${{ secrets.ACTION_MODE }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/index.js update
