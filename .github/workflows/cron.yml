name: NervaFX Hourly Update

on:
  schedule:
    # Run every 30 minutes, all days — isMarketOpen() in src/index.js handles
    # skipping when market is actually closed (Sat all day, Sun before 21:00,
    # Fri from 21:00). Running 2x/hour means even a 20-min GitHub delay still
    # covers every market hour.
    - cron: '5 * * * *'    # :05 past every hour
    - cron: '35 * * * *'   # :35 past every hour (backup / redundancy)
  workflow_dispatch:        # manual trigger from GitHub UI or external cron
    inputs:
      reason:
        description: 'Why are you triggering this manually?'
        required: false
        default: 'manual'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run hourly update
        env:
          OANDA_API_KEY:        ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID:     ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_BASE_URL:       ${{ secrets.OANDA_BASE_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACCOUNT_BALANCE:      ${{ secrets.ACCOUNT_BALANCE }}
          ACTION_MODE:          ${{ secrets.ACTION_MODE }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/index.js update
