name: NervaFX Hourly Update

on:
  workflow_dispatch:        # triggered by cron-job.org at :01 every hour Mon-Fri
    inputs:
      reason:
        description: 'Why are you triggering this manually?'
        required: false
        default: 'manual'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run hourly update
        env:
          OANDA_API_KEY:        ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID:     ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_BASE_URL:       ${{ secrets.OANDA_BASE_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACCOUNT_BALANCE:      ${{ secrets.ACCOUNT_BALANCE }}
          ACTION_MODE:          ${{ secrets.ACTION_MODE }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
        run: node src/index.js update
